 "text": "Zabieg endoskopowy — kolonoskopia", "correct": false}, {"letter": "C", "text": "Laparoskopia", "correct": false}, {"letter": "D", "text": "Założenie sondy Sengstakena-Blakemore'a", "correct": false}, {"letter": "E", "text": "Założenie sondy i płukanie żołądka zimnym NaCl", "correct": false}], "type": "single"}, {"text": "Co jest charakterystyczne dla endometriozy?", "hint": "Endometrioza = tkanka endometrialna poza macicą. Klasyczny objaw = dysmenorrhea (bolesne miesiączki) + dyspareunia + ból miednicy. Wariant e) także jest możliwy, ale bolesne miesiączki = najbardziej charakterystyczny i najczęściej testowany objaw.", "options": [{"letter": "A", "text": "Bezbolesne miesiączki", "correct": false}, {"letter": "B", "text": "Krwawienia kontaktowe", "correct": false}, {"letter": "C", "text": "Bolesne miesiączki (dysmenorrhea)", "correct": true}, {"letter": "D", "text": "Częste zakażenia dróg moczowych", "correct": false}, {"letter": "E", "text": "Ból w dolnej części brzucha niezależny od cyklu", "correct": false}], "type": "single"}, {"text": "Biegunka to:", "hint": "Definicja WHO: biegunka = ≥3 luźne lub płynne stolce na dobę. 3 półpłynne stolce = spełnia definicję. 1 płynny stolec = za mało (potrzebne ≥3). Mnemonik: Biegunka = 3+ luźne/dobę.", "options": [{"letter": "A", "text": "4 stolce typu 5 wg skali Bristol", "correct": false}, {"letter": "B", "text": "2 papkowate stolce w ciągu doby", "correct": false}, {"letter": "C", "text": "3 półpłynne stolce w ciągu doby", "correct": true}, {"letter": "D", "text": "1 płynny stolec w ciągu doby", "correct": false}, {"letter": "E", "text": "Wszystkie prawidłowe", "correct": false}], "type": "single"}, {"text": "Jakie leczenie stosuje się przy ciężkich głębokich oparzeniach?", "hint": "Głębokie oparzenia wymagają chirurgicznego opracowania + przeszczepu skóry. Siatka autologiczna (meshed autograft) = złoty standard: własna skóra pacjenta rozciągnięta w siatkę → pokrywa większą powierzchnię. Ksenodermalna = tymczasowa. Leczenie zachowawcze = tylko przy powierzchownych.", "options": [{"letter": "A", "text": "Chirurgiczne opracowanie rany z siatką autologiczną", "correct": true}, {"letter": "B", "text": "Chirurgiczne opracowanie rany z siatką ksenodermalną", "correct": false}, {"letter": "C", "text": "Chirurgiczne opracowanie rany bez siatki — jednolity płat skóry", "correct": false}, {"letter": "D", "text": "Chirurgiczne opracowanie rany — zamknięcie opatrunkami biologicznymi", "correct": false}, {"letter": "E", "text": "Leczenie zachowawcze maściami i opatrunkami gazowymi", "correct": false}], "type": "single"}, {"text": "U pacjenta podejrzewa się niedokrwistość hemolityczną. Który z poniższych zestawów wyników laboratoryjnych jest najbardziej typowy?", "hint": "Hemoliza → rozpad erytrocytów → uwolnienie LDH (↑) + hemoglobiny → wzrost bilirubiny pośredniej (niesprzężonej). Erytrocyty prawidłowe (niedokrwistość normocytarna). ↓ haptoglobina, retikulocytoza. Mikrocytarna = niedobór Fe / talasemia. Makrocytarna = B12/folian. Mnemonik: Hemoliza = normo + ↑LDH + ↑bilirubina pośrednia + ↓haptoglobina.", "options": [{"letter": "A", "text": "Niedokrwistość mikrocytarna, zmniejszone LDH", "correct": false}, {"letter": "B", "text": "Niedokrwistość normocytarna normochromna, zwiększone LDH, wzrost bilirubiny pośredniej (niesprzężonej)", "correct": true}, {"letter": "C", "text": "Niedokrwistość makrocytarna, zmniejszone LDH", "correct": false}, {"letter": "D", "text": "Niedokrwistość mikrocytarna, zwiększone LDH", "correct": false}, {"letter": "E", "text": "Niedokrwistość makrocytarna, zwiększone LDH", "correct": false}], "type": "single"}, {"text": "Zespół objawów: otyłość centralna ze szczupłymi kończynami, twarz „księżycowata\", „byczy kark\", ścieńczenie skóry, czerwono-sine rozstępy, wylewy krwawe, nadciśnienie tętnicze, obrzęki kończyn. Jakie rozpoznanie?", "hint": "Klasyczny obraz hiperkortyzolemii: otyłość centralna + moon face + buffalo hump + rozstępy + atrofia skóry + nadciśnienie. Addison = odwrotność (↓ kortyzol). Conn = aldosteron (NT + hipokaliemia). SIADH = hiponatremia. Mnemonik: Cushing = cortisol excess = otyłość centralna.", "options": [{"letter": "A", "text": "Zespół Addisona", "correct": false}, {"letter": "B", "text": "Zespół Cushinga", "correct": true}, {"letter": "C", "text": "Zespół Conna", "correct": false}, {"letter": "D", "text": "Zespół SIADH", "correct": false}], "type": "single"}, {"text": "Uchyłek Meckla występuje w:", "hint": "Uchyłek Meckla = pozostałość przewodu żółtkowo-jelitowego (ductus omphaloentericus). Lokalizacja: jelito kręte (ileum), ~60 cm od zastawki krętniczo-kątniczej. Reguła dwójek: 2% populacji, 2 stopy od zastawki, 2 cale długości, 2 typy tkanki ektopowej (żołądkowa, trzustkowa). Mnemonik: Meckel = jelito cienkie (ileum).", "options": [{"letter": "A", "text": "Żołądku", "correct": false}, {"letter": "B", "text": "Oskrzelu głównym", "correct": false}, {"letter": "C", "text": "Jelicie cienkim", "correct": true}, {"letter": "D", "text": "Pęcherzu moczowym", "correct": false}, {"letter": "E", "text": "Cewce moczowej", "correct": false}], "type": "single"}, {"text": "Zaznacz nieprawdziwą informację dotyczącą zatok sitowych nosa u dzieci:", "hint": "Zatoki sitowe (ethmoidalne) są obecne OD URODZENIA — rozwijają się w życiu płodowym, są pierwsze do pneumatyzacji. „Ok. 4 roku\" to NIEPRAWDA. Rozwój zatok: sitowe = od urodzenia, szczękowe = od urodzenia (małe), klinowa ~5–6 lat, czołowe ~7–8 lat. Mnemonik: Sitowe = Start (od urodzenia).", "options": [{"letter": "A", "text": "Ostre zapalenie zatok sitowych powinno być leczone szpitalnie antybiotykiem dożylnym", "correct": false}, {"letter": "B", "text": "Zatoki sitowe rozwijają się ok. 4 roku życia dziecka", "correct": true}, {"letter": "C", "text": "Zapalenie zatok sitowych wiąże się zwykle z ciężkim stanem dziecka, wysoką gorączką i obrzękiem powiek", "correct": false}, {"letter": "D", "text": "Powikłaniem zapalenia zatok sitowych może być zapalenie opon mózgowo-rdzeniowych", "correct": false}, {"letter": "E", "text": "Powikłaniem zapalenia zatok sitowych może być zapalenie oczodołu", "correct": false}], "type": "single"}, {"text": "3-miesięczne dziecko: trudności z oddawaniem smółki, wypadanie odbytu, wiotkość mięśni, niedobór masy ciała. Diagnoza?", "hint": "Triada mukowiscydozy u niemowląt: niedrożność smółkowa (meconium ileus) + biegunki tłuszczowe + infekcje dróg oddechowych. Wypadanie odbytu u małego dziecka jest BARDZO sugestywne dla mukowiscydozy. Prader-Willi → hipotonia + hiperfagia (ale później). Mnemonik: Muco = Meconium + Malabsorption + Mucus + wypadanie odbytu.", "options": [{"letter": "A", "text": "Zespół Pradera-Williego", "correct": false}, {"letter": "B", "text": "Alergia na białko mleka krowiego", "correct": false}, {"letter": "C", "text": "Niedrożność jelit", "correct": false}, {"letter": "D", "text": "Niedobór alfa-1-antytrypsyny", "correct": false}, {"letter": "E", "text": "Mukowiscydoza", "correct": true}], "type": "single"}, {"text": "Złoty standard diagnostyki skrętu jajnika i jajowodu to:", "hint": "Skręt jajnika = stan nagły → laparoskopia jest jednocześnie diagnostyczna i terapeutyczna (odkręcenie). USG Doppler może sugerować rozpoznanie (brak przepływu), ale laparoskopia = złoty standard. Mnemonik: Torsion = Theatre (laparoskopia).", "options": [{"letter": "A", "text": "TK z kontrastem jamy brzusznej", "correct": false}, {"letter": "B", "text": "Laparoskopia", "correct": true}, {"letter": "C", "text": "Punkcja torbieli", "correct": false}, {"letter": "D", "text": "Antybiotykoterapia empiryczna", "correct": false}, {"letter": "E", "text": "Obserwacja i leki przeciwbólowe", "correct": false}], "type": "single"}, {"text": "45-letnia pacjentka: oporne na leczenie nadciśnienie tętnicze, hipokaliemia, zasadowica metaboliczna, wysoki aldosteron przy niskiej reninie. Rozpoznanie?", "hint": "Klasyczna triada Conna: nadciśnienie + hipokaliemia + zasadowica metaboliczna. Kluczowy układ: ↑ aldosteron + ↓ renina (ARR). Cushing → ↑ kortyzol + rozstępy. Pheo → napadowe NT + kołatanie. Addison → hipotensja + hiperkaliemia. Mnemonik: Conn = K⁺ down, aldosteron up, renin down.", "options": [{"letter": "A", "text": "Zespół Cushinga", "correct": false}, {"letter": "B", "text": "Zespół Conna (hiperaldosteronizm pierwotny)", "correct": true}, {"letter": "C", "text": "Choroba Addisona", "correct": false}, {"letter": "D", "text": "Guz chromochłonny (pheochromocytoma)", "correct": false}, {"letter": "E", "text": "Przełom nadnerczowy", "correct": false}], "type": "single"}, {"text": "Kobieta, okresowe wzrosty ciśnienia do 220/100 mmHg, bóle głowy. W badaniu obrazowym: guz nadnercza 2 cm. Postępowanie?", "hint": "Guz chromochłonny → napadowe nadciśnienie + bóle głowy + kołatanie + poty. Przed operacją OBOWIĄZKOWO: α-bloker (fenoksybenzamina/doksazosyna) przez ≥10–14 dni → POTEM β-bloker. NIGDY β-bloker bez α-blokera (ryzyko przełomu nadciśnieniowego)! Mnemonik: Pheo = First Alpha, then Beta, then Surgery.", "options": [{"letter": "A", "text": "Obserwacja, kontrolne MRI za 6 miesięcy", "correct": false}, {"letter": "B", "text": "Zakwalifikować do zabiegu po podaniu α- i β-blokerów", "correct": true}, {"letter": "C", "text": "Operacja natychmiast", "correct": false}, {"letter": "D", "text": "Embolizacja tętnicy nerkowej", "correct": false}, {"letter": "E", "text": "Leczenie farmakologiczne bez operacji", "correct": false}], "type": "single"}, {"text": "Pacjent ze stopą cukrzycową, gorączka, ropna wydzielina z palca, podwyższone CRP. Czego NIE robimy?", "hint": "Infekcja stopy cukrzycowej z ropą = pilnie: drenaż ropnia + antybiotyk empiryczny + RTG (wykluczenie osteomyelitis). UWAGA: dwie odpowiedzi są błędne — (d) leki rozszerzające naczynia (nie przy aktywnej infekcji bez krytycznego niedokrwienia) ORAZ (e) czekanie tydzień (zwłoka = ryzyko sepsy/amputacji). Jeśli test wymaga JEDNEJ odpowiedzi „czego NIE robimy\", wybieraj wazodylatatory jako działanie aktywnie szkodliwe. Mnemonik: Ropna stopa = drenaż + ATB natychmiast.", "options": [{"letter": "A", "text": "Drenaż ropnia", "correct": false}, {"letter": "B", "text": "Antybiotykoterapia", "correct": false}, {"letter": "C", "text": "RTG stopy", "correct": false}, {"letter": "D", "text": "Podanie leków rozszerzających naczynia", "correct": true}, {"letter": "E", "text": "Czekamy tydzień na poprawę", "correct": false}], "type": "single"}, {"text": "Najważniejszym badaniem przesiewowym w profilaktyce raka szyjki macicy jest:", "hint": "Test HPV (DNA/mRNA) = badanie przesiewowe 1. wyboru (WHO, ESGO). Cytologia (Pap test) → uzupełnia lub jest alternatywą. Kolposkopia = diagnostyka, nie screening. CA-125 = rak jajnika, nie szyjki. Mnemonik: Screening szyjki = HPV test.", "options": [{"letter": "A", "text": "Test HPV jako badanie samodzielne lub współtest (HPV + cytologia)", "correct": true}, {"letter": "B", "text": "Biopsja szyjki macicy", "correct": false}, {"letter": "C", "text": "Oznaczenie CA-125", "correct": false}, {"letter": "D", "text": "Kolposkopia", "correct": false}, {"letter": "E", "text": "USG przezpochwowe", "correct": false}], "type": "single"}, {"text": "W II okresie porodu, przy potylicznym przedlodowaniu, szew strzałkowy ustawia się w wymiarze prostym wchodu do miednicy. Główka wykonała:", "hint": "Mechanizm porodu: I zwrot = przygięcie (bródka do klatki), II zwrot = rotacja wewnętrzna (szew strzałkowy z wymiaru poprzecznego → prosty, potylica pod spojenie), III = odgięcie (rodzenie główki), IV = rotacja zewnętrzna (obrót barków). Szew w wymiarze prostym = rotacja ukończona. Mnemonik: Prosty wymiar = Po Rotacji.", "options": [{"letter": "A", "text": "I zwrot — przygięcie (zgięcie)", "correct": false}, {"letter": "B", "text": "II zwrot — rotacja wewnętrzna", "correct": true}, {"letter": "C", "text": "III zwrot — odgięcie", "correct": false}, {"letter": "D", "text": "IV zwrot — zwrot zewnętrzny", "correct": false}], "type": "single"}, {"text": "Rak endometrium z najlepszym rokowaniem (ultra favourable / ultra low risk) to podtyp molekularny:", "hint": "Klasyfikacja molekularna raka endometrium (TCGA/ProMisE): POLEmut = najlepsze rokowanie (ultra low risk, nawet przy wysokim stopniu histologicznym). TP53-mutated = najgorsze rokowanie. MMRd = pośrednie, kwalifikuje do immunoterapii. NSMP = pośrednie. Mnemonik: POLE = najlepsze rokowanie („POLEposition\" — na pierwszym miejscu).", "options": [{"letter": "A", "text": "TP53-mutated", "correct": false}, {"letter": "B", "text": "MMRd (mismatch repair deficient)", "correct": false}, {"letter": "C", "text": "POLEmut (POLE ultramutated)", "correct": true}, {"letter": "D", "text": "NSMP (no specific molecular profile)", "correct": false}, {"letter": "E", "text": "pMMR", "correct": false}], "type": "single"}, {"text": "Pacjentka wyczuła guz w piersi. USG: hipoechogeniczny guz — BIRADS 2, cechy gruczolakowłókniaka. Postępowanie?", "hint": "BIRADS 2 = zmiana łagodna (benign). Gruczolakowłókniak (fibroadenoma) u młodej kobiety = najczęstsza łagodna zmiana piersi. Nie wymaga biopsji ani operacji → kontrola USG za 3–6 mies. BIRADS 3 → kontrola co 6 mies. BIRADS 4/5 → biopsja. Mnemonik: BIRADS 2 = Benign = kontroluj, nie operuj.", "options": [{"letter": "A", "text": "Biopsja gruboigłowa", "correct": false}, {"letter": "B", "text": "Biopsja cienkoigłowa", "correct": false}, {"letter": "C", "text": "Operacja", "correct": false}, {"letter": "D", "text": "Kontrola USG za 3–6 miesięcy", "correct": true}, {"letter": "E", "text": "Zmiana łagodna — nie wymaga kontroli", "correct": false}], "type": "single"}, {"text": "Który nowotwór najczęściej daje przerzuty drogą wszczepionową (implantacyjną) do jamy brzusznej?", "hint": "Rak jajnika = klasyczny nowotwór rozsiewający się drogą implantacyjną po otrzewnej. Komórki nowotworowe złuszczają się z powierzchni jajnika → pływają w płynie otrzewnowym → implantują się na otrzewnej, sieci większej, jelitach. Mnemonik: Jajnik → Jama otrzewna (implantacja).", "options": [{"letter": "A", "text": "Rak jajnika", "correct": true}, {"letter": "B", "text": "Rak endometrium", "correct": false}, {"letter": "C", "text": "Rak sromu", "correct": false}, {"letter": "D", "text": "Rak szyjki macicy", "correct": false}, {"letter": "E", "text": "Rak trzonu macicy", "correct": false}], "type": "single"}, {"text": "Gdzie osłuchujemy zastawkę mitralną (dwudzielną)?", "hint": "Punkty osłuchiwania: Aortalna → 2. prawe, Pulmonalna → 2. lewe, Trójdzielna → dolna lewa krawędź mostka / wyrostek mieczykowaty, Mitralna → koniuszek (5. lewe MCL). Mnemonik: „APT-M\" = od góry do dołu, od prawej do lewej → Aorta, Pulmo, Tricuspid, Mitral.", "options": [{"letter": "A", "text": "4. międzyżebrze po lewej stronie mostka", "correct": false}, {"letter": "B", "text": "2. międzyżebrze po prawej stronie mostka", "correct": false}, {"letter": "C", "text": "2. międzyżebrze po lewej stronie mostka", "correct": false}, {"letter": "D", "text": "Koniuszek serca (5. międzyżebrze, linia środkowoobojczykowa lewa)", "correct": true}, {"letter": "E", "text": "Nad wyrostkiem mieczykowatym", "correct": false}], "type": "single"}, {"text": "U pacjenta stwierdzono: TSH obniżone, T3 i T4 podwyższone. Jakie rozpoznanie?", "hint": "TSH ↓ + FT3/FT4 ↑ = nadczynność pierwotna (tarczyca sama produkuje za dużo → przysadka hamuje TSH przez ujemne sprzężenie zwrotne). Nadczynność wtórna = TSH ↑ + T3/T4 ↑ (guz przysadki produkujący TSH). Niedoczynność pierwotna = TSH ↑ + T4 ↓. Mnemonik: Pierwotna = problem w tarczycy → TSH reaguje odwrotnie.", "options": [{"letter": "A", "text": "Niedoczynność tarczycy pierwotna", "correct": false}, {"letter": "B", "text": "Niedoczynność tarczycy wtórna", "correct": false}, {"letter": "C", "text": "Nadczynność tarczycy pierwotna", "correct": true}, {"letter": "D", "text": "Nadczynność tarczycy wtórna", "correct": false}, {"letter": "E", "text": "Eutyreoza", "correct": false}], "type": "single"}, {"text": "Pacjent z podejrzeniem uszkodzenia szyjnego odcinka kręgosłupa: hipotonia, zaburzenia czucia i ruchu kończyn. Postępowanie?", "hint": "Uraz C-spine: ABCDE — priorytet A (drożność dróg oddechowych) + natychmiastowa IMMOBILIZACJA szyi (kołnierz ortopedyczny/stabilizacja manualna). NIGDY nie mobilizować kręgosłupa szyjnego! Hipotonia po urazie C-spine → wstrząs neurogenny (↓ napięcia naczyń) → leki wazopresyjne (noradrenalina) + płyny. Intubacja przy GCS <8 lub zagrożeniu drożności.", "options": [{"letter": "A", "text": "Mobilizacja szyi", "correct": false}, {"letter": "B", "text": "Sprawdzić drożność dróg oddechowych", "correct": false}, {"letter": "C", "text": "Podać leki wazopresyjne", "correct": false}, {"letter": "D", "text": "A + B", "correct": false}, {"letter": "E", "text": "A + B + C (jeśli „A\" = immobilizacja/stabilizacja szyi)", "correct": true}], "type": "single"}, {"text": "Zespół Mallory-Weissa to: Naderwanie (rozdarcie) błony śluzowej połączenia przełykowo-żołądkowego, najczęściej po silnych wymiotach, powodujące krwawienie z górnego odcinka przewodu pokarmowego.", "hint": "Klasyczny obraz: intensywne wymioty (często po alkoholu) → krwawienie (krwiste wymioty / hematemesis). Rozerwanie dotyczy śluzówki, nie pełnej ściany (pełna grubość = zespół Boerhaave'a). Leczenie: zwykle samoograniczające się, endoskopia, jeśli krwawienie aktywne. Mnemonik: Mallory-Weiss = Wymioty → rozdarcie Śluzówki. Boerhaave = Burst (perforacja).", "options": [], "correct_text": "Naderwanie (rozdarcie) błony śluzowej połączenia przełykowo-żołądkowego, najczęściej po silnych wymiotach, powodujące krwawienie z górnego odcinka przewodu pokarmowego.", "type": "reveal"}, {"text": "Oddech Kussmaula to: Głęboki, przyspieszony oddech kompensacyjny występujący w kwasicy metabolicznej (np. cukrzycowa kwasica ketonowa — DKA).", "hint": "Kwasica metaboliczna → organizm kompensuje przez ↑ wentylacji → wydala CO₂ → oddech Kussmaula. Najczęstsze przyczyny: DKA, niewydolność nerek (mocznica), zatrucie metanolem/glikolem etylenowym. Mnemonik: Kussmaul = Kwasica = Kompensacja oddechowa (głęboki + szybki).", "options": [], "correct_text": "Głęboki, przyspieszony oddech kompensacyjny występujący w kwasicy metabolicznej (np. cukrzycowa kwasica ketonowa — DKA).", "type": "reveal"}, {"text": "Triada Charcota w zapaleniu dróg żółciowych (cholangitis) to: 1) Gorączka z dreszczami, 2) Żółtaczka, 3) Ból w prawym podżebrzu", "hint": "Cholangitis = zakażenie dróg żółciowych (zwykle na tle kamicy). Triada Charcota: gorączka + żółtaczka + ból RUQ. Pentada Reynoldsa (ciężki cholangitis): triada + hipotensja + zaburzenia świadomości → wskazanie do pilnego ERCP/drenażu. Mnemonik: Charcot = Chill (dreszcze) + Cholestasis (żółtaczka) + Colicky pain.", "options": [{"letter": "1", "text": "Gorączka z dreszczami, 2) Żółtaczka, 3) Ból w prawym podżebrzu", "correct": true}], "type": "single"}, {"text": "Jaki jest stosunek uciśnięć klatki piersiowej do oddechów ratunkowych podczas resuscytacji dziecka (dwóch ratowników medycznych)? 15:2", "hint": "Wg wytycznych ERC: dorośli → 30:2 (jeden lub dwóch ratowników). Dzieci (personel medyczny, dwóch ratowników) → 15:2. Jeden ratownik / osoba bez przeszkolenia → 30:2 także u dzieci. Na egzaminie LEK: 15:2. Mnemonik: Dzieci = 15:2 (dwóch ratowników).", "options": [], "correct_text": "15:2", "type": "reveal"}, {"text": "Operacja Hartmanna to: Resekcja zmienionego odcinka jelita grubego (najczęściej esicy/zstępnicy) z wytworzeniem kolostomii końcowej i zamknięciem kikuta odbytnicy (bez pierwotnego zespolenia).", "hint": "Wskazania: perforacja jelita + zapalenie otrzewnej, guz jelita grubego w trybie nagłym (niedrożność/perforacja), powikłania uchyłkowatości (np. ropień, perforacja). Zaleta: unika zespolenia w warunkach zapalenia → mniejsze ryzyko nieszczelności. Drugi etap (odtworzenie ciągłości) — planowy. Mnemonik: Hartmann = resekcja + kolostomia, BEZ zespolenia.", "options": [], "correct_text": "Resekcja zmienionego odcinka jelita grubego (najczęściej esicy/zstępnicy) z wytworzeniem kolostomii końcowej i zamknięciem kikuta odbytnicy (bez pierwotnego zespolenia).", "type": "reveal"}, {"text": "1) normocytarna, ↑ retikulocyty, ↑ bilirubina NIESPRZĘŻONA, ↑ LDH, ↓ haptoglobina, żółtaczka", "hint": "Hemoliza → rozpad erytrocytów → uwolnienie Hb → bilirubina NIESPRZĘŻONA (pośrednia, indirect) ↑. Wątroba sprzęga bilirubinę, ale przy hemolizie produkcja przekracza możliwości sprzęgania. Stąd ↑ bilirubiny niesprzężonej (NIE sprzężonej!). Pozostałe markery: ↑LDH (z RBC), ↓haptoglobina (wiąże wolną Hb), ↑retikulocyty (kompensacja), normocytarna/normochromna. Sprzężona ↑ = cholestaza/uszkodzenie wątroby, NIE hemoliza. Mnemonik: Hemoliza = NIESPRZĘŻONA bilirubina.", "items": ["normocytarna, ↑ retikulocyty, ↑ bilirubina sprzężona, ↑ LDH, ↓ haptoglobina, żółtaczka", "mikrocytarna ...", "makrocytarna ...", "makrocytarna ..."], "options": [{"letter": "1", "text": "normocytarna, ↑ retikulocyty, ↑ bilirubina NIESPRZĘŻONA, ↑ LDH, ↓ haptoglobina, żółtaczka", "correct": true}, {"letter": "2", "text": "normocytarna, ↑ retikulocyty, ↑ bilirubina sprzężona, ↑ LDH, ↓ haptoglobina, żółtaczka", "correct": false}, {"letter": "3", "text": "mikrocytarna ...", "correct": false}, {"letter": "4", "text": "makrocytarna ...", "correct": false}, {"letter": "5", "text": "makrocytarna ...", "correct": false}], "type": "single"}, {"text": "- Q116 — DODANO brakującą odpowiedź: opcja 1 (normocytarna + ↑bilirubina niesprzężona + ↑LDH + ↓haptoglobina). W hemolizie bilirubina jest NIESPRZĘŻONA (pośrednia, indirect), ponieważ rozpad RBC uwalnia Hb → bilirubinę pośrednią szybciej niż wątroba zdąży ją sprzęgnąć. - Q4 (zwężenie tchawicy >50%) — Próg \"klinicznie istotnego\" zwężenia zależy od źródła. Polskie podręczniki typowo podają >50% (duszność wysiłkowa), ale niektóre źródła zachodnie przyjmują >75% (duszność spoczynkowa, stridor). Odpowiedź c) >50% jest najbardziej zgodna z pytaniem \"klinicznie istotne i objawia się dusznością\". - Q41 (OGTT 92, 173, 150) — Wartość 92 mg/dl na czczo to próg GRANICZNY. Kryterium ≥92 → włącznie z 92 → GDM. Studenci często myślą, że 92 to jeszcze norma, ale formalnie ≥92 = GDM (zalecenia PTGiP/IADPSG/WHO). - Q42 (obrzęk płuc) — Marked: Furosemid + Nitroprusydek. W praktyce klinicznej i polskich wytycznych częściej stosowana jest nitrogliceryna (azotany) jako wazodilator w obrzęku płuc. Nitroprusydek jest preferowany przy ciężkim NT lub disekcji aorty. Oba są akceptowalne. Możliwe, że oryginalny test używał słowa \"nitrogliceryna\" lub \"azotany\". - Q49 (brak unoszenia połowy klatki piersiowej) — Wariant 1 (duża ilość płynu w opłucnej) TEŻ może powodować ograniczenie ruchu klatki, ale autorzy testu zwykle uznają, że masywny wysięk daje \"stłumienie + osłabione szmery\", a nie \"brak unoszenia\". Marked 2+4+5 zgodnie z konwencją testową. - Q53 (BCG) — Wariant a) \"zmniejsza ryzyko rozsianej gruźlicy\" jest faktycznie prawdziwy, ale d) \"ciężkie formy choroby\" jest szerszy i bardziej kompletny (obejmuje rozsianą + zapalenie opon). Marked d jako lepsza odpowiedź. - Q54 (holosystoliczny szmer) — Ten sam typ pytania pojawiał się w różnych wariantach w innych egzaminach. Klucz: holosystoliczny = MR + TR + VSD. - Q55 (palce pałeczkowate w POChP) — Klasyczna pułapka: pomimo hipoksji w POChP, palce pałeczkowate NIE są charakterystyczne. Jeśli pacjent z POChP ma clubbing, należy szukać raka płuca lub rozstrzeni oskrzeli. - Q59 (rdzeniasty rak tarczycy) — Wariant 1 (\"szybki rozrost z naciekiem\") bardziej pasuje do raka anaplastycznego, nie rdzeniastego. Marked 3 (twarda tarczyca) — najbliżej charakterystyki MTC. - Q60 (statyny) — Wariant 1 \"koniecznie odstawić\" brzmi jak trwałe zaprzestanie u pacjenta po MI = błąd. Marked 4 (tymczasowe odstawienie + monitoring) — prawidłowy algorytm. - Q70 (4-miesięczne dziecko) — W opisie student napisał \"biegunka\", ale typowo w wrodzonej niedoczynności tarczycy występują ZAPARCIA. Możliwe nieprecyzyjne odtworzenie. Reszta objawów (przepuklina pępkowa + makroglosja + przedłużona żółtaczka + hipotonia) jest tak charakterystyczna, że odpowiedź pozostaje WCH. - Q80 (gruźlica — kontynuacja 2) — W fazie kontynuacji NIE stosuje się ANI Pyrazynamidu, ANI Etambutolu (oba tylko w fazie intensywnej). Odpowiedzi A (Pyrazynamid) i B (Etambutol) obie poprawne. Marked A — częściej wybierany na egzaminie. - Q86 (9-mies dziecko) — Mieszanka objawów krzywicy (craniotabes) i niedoczynności tarczycy (żółta skóra, zaparcia). Craniotabes (\"ping-pong\") jest najbardziej specyficzny dla krzywicy. Niedoczynność tarczycy zwykle wykrywana przez przesiew noworodkowy. - Q91 (endometrioza) — Wariant e) \"ból niezależny od cyklu\" też możliwy w endometriozie zaawansowanej (przewlekły ból miednicy), ale bolesne miesiączki (dysmenorrhea) jest najbardziej charakterystyczny i najczęściej testowany. - Q102 (stopa cukrzycowa) — Zarówno (d) \"leki rozszerzające naczynia\" jak i (e) \"czekamy tydzień\" są nieprawidłowe w aktywnej infekcji. Marked d — w aktywnej infekcji wazodilatatory nie są wskazane (priorytet: drenaż + ATB). - Q106 (BIRADS 2) — Formalnie BIRADS 2 = zmiana łagodna, NIE wymaga kontroli (rutynowy screening). Jednak w polskiej praktyce klinicznej dla pierwszorazowego gruczolakowłókniaka u młodej kobiety często zaleca się kontrolę USG za 3-6 mies. (potwierdzenie stabilności). Marked d zgodne z polską praktyką, ale technicznie (e) byłoby zgodne ze ścisłą interpretacją BIRADS. - Q110 (uraz C-spine) — Jeśli wariant \"a\" w teście brzmiał \"mobilizacja szyi\" → to BŁĄD (powinno być immobilizacja). Marked e (a+b+c) zakłada, że \"a\" oznacza stabilizację. - Q21 (kaczkowaty chód) — Student nie zapamiętał, że \"badanie CK\" było jedną z opcji. Odpowiedź podana w formie tekstu, nie litery. - Q26, Q32, Q39, Q44, Q49, Q50, Q51, Q60, Q92, Q110 — Niektóre opcje niekompletne (\"...\"), ale prawidłowa odpowiedź jednoznaczna. - 115/116 odpowiedzi było prawidłowo zaznaczonych w oryginale - 1/116 wymagało dodania odpowiedzi (Q116 — brak markera) - 0/116 wymagało zmiany odpowiedzi (wszystkie zaznaczone xt": "45", "correct": false}, {"letter": "E", "text": "25", "correct": false}], "type": "single"}, {"text": "Szpiczak plazmocytowy (CRAB):", "hint": "Kryteria CRAB szpiczaka: Ca >2,75 mmol/l, kreatynina >2 mg/dl (lub CrCl <40), Hb <10 g/dl, zmiany kostne. Czyli punkty 2, 3, 5.", "items": ["stężenie wapnia skorygowanego > 2,5 mmol/l", "stężenie wapnia > 2,75 mmol/l", "kreatynina > 2 mg/dl", "kreatynina > 1,5 mg/dl", "hemoglobina <10 g/dl", "hemoglobina <11 g/dl"], "options": [{"letter": "A", "text": "1, 2, 3", "correct": false}, {"letter": "B", "text": "2, 4, 5", "correct": false}, {"letter": "C", "text": "2, 3, 5", "correct": true}, {"letter": "D", "text": "1, 2, 3, 4", "correct": false}, {"letter": "E", "text": "2, 3, 4, 5", "correct": false}, {"letter": "F", "text": "3, 4, 5, 6", "correct": false}, {"letter": "G", "text": "wszystkie wymienione", "correct": false}], "type": "single"}, {"text": "Dziecko (cukrzyca 1 typu) / hipoglikemia na wycieczce rowerowej poczuł osłabienie, stosuje insulinę, stracił przytomność, glukoza 66 mg/dl:", "hint": "Ciężka hipoglikemia z utratą przytomności poza szpitalem → glukagon i.m. (preferowane wg PALS/ISPAD 2022) lub s.c. — dawka: 0,5 mg dla <25 kg, 1 mg dla ≥25 kg. Alternatywa: glukagon donosowy (Baqsimi). NIGDY doustnie (aspiracja!). Po odzyskaniu przytomności → szybkie węglowodany p.o. + posiłek.", "options": [{"letter": "A", "text": "glukagon podskórnie", "correct": true}, {"letter": "B", "text": "glukagon dożylnie", "correct": false}, {"letter": "C", "text": "podać glukozę dożylnie", "correct": false}, {"letter": "D", "text": "podać doustnie pokarm zawierający 15 g glukozy", "correct": false}, {"letter": "E", "text": "wyzwać pogotowie", "correct": false}], "type": "single"}, {"text": "Jakie wczesne powikłanie po naczyniowych operacjach?", "hint": "Wczesne powikłania operacji naczyniowych: krwawienie, krwiak, zakrzepica. Tętniak rzekomy, zakażenie protezy — powikłania późne.", "options": [{"letter": "A", "text": "ropień", "correct": false}, {"letter": "B", "text": "krwiak", "correct": true}, {"letter": "C", "text": "tętniak rzekomy", "correct": false}, {"letter": "D", "text": "tętniak prawdziwy", "correct": false}, {"letter": "E", "text": "seroma", "correct": false}], "type": "single"}, {"text": "Zaznacz fałszywą odpowiedź dotyczącą stosowania żelaza:", "hint": "Taniny (herbata, kawa) i Ca POGARSZAJĄ wchłanianie żelaza. Witamina C poprawia. Fe²⁺ wchłania się lepiej niż Fe³⁺. Tetracykliny i Fe — chelaty, rozdzielać.", "options": [{"letter": "A", "text": "żelazo wchłania się w dwunastnicy, jelicie cienkim", "correct": false}, {"letter": "B", "text": "lepiej wchłania się Fe dwuwalentne", "correct": false}, {"letter": "C", "text": "między stosowaniem żelaza i tetracykliny odstęp czasowy około 4 h", "correct": false}, {"letter": "D", "text": "czarna herbata polepsza wchłanianie żelaza", "correct": true}, {"letter": "E", "text": "nie wolno stosować IPP i żelazo", "correct": false}], "type": "single"}, {"text": "Dziecko 5 lat, skarży się na bóle w nóżkach, nie chce iść do szkoły. Noc poprzedzająca - temperatura ciała 37. Na szyi - wybroczyny. Na nogach - krwawe podbiegnięcia:", "hint": "Bóle kostne + wybroczyny + siniaki u dziecka → podejrzenie ALL lub ITP. Pierwsze badanie — morfologia krwi z rozmazem (poszukiwanie blastów, małopłytkowości).", "options": [{"letter": "A", "text": "zgłosić na policję", "correct": false}, {"letter": "B", "text": "skierować do reumatologa", "correct": false}, {"letter": "C", "text": "morfologia krwi z rozmazem", "correct": true}, {"letter": "D", "text": "OB", "correct": false}, {"letter": "E", "text": "zaspokoić rodziców", "correct": false}], "type": "single"}, {"text": "Mężczyzna LVEF <38%, LBBB, STEMI w wywiadzie, ma częstoskurcz komorowy nieutrwalony. Optymalne leczenie:", "hint": "Profilaktyka pierwotna SCD (ESC 2022): ICD przy LVEF ≤35% po MI (≥40 dni) + HF NYHA II-III mimo OMT. Przy LBBB z QRS ≥130 ms + LVEF ≤35% → CRT-D (terapia resynchronizująca z defibrylatorem) — optymalna w tej sytuacji. NSVT u pacjenta po STEMI ze złą frakcją — dodatkowe wzmocnienie wskazania. Wśród podanych opcji — kardiowerter-defibylator (C).", "options": [{"letter": "A", "text": "wdrążyć leczenie amiodaronem jako 1 rzut", "correct": false}, {"letter": "B", "text": "kardiowersja", "correct": false}, {"letter": "C", "text": "kardiowerter-defibrilator", "correct": true}, {"letter": "D", "text": "ablacja", "correct": false}, {"letter": "E", "text": "ß-bloker", "correct": false}], "type": "single"}, {"text": "Jaki czynnik etiologiczny wywołuje płatowe zapalenie płuc u osób 30 lat:", "hint": "Płatowe (krupowate) zapalenie płuc u młodych dorosłych — klasycznie Streptococcus pneumoniae. Mykoplazma powoduje śródmiąższowe (atypowe) zapalenie płuc.", "options": [{"letter": "A", "text": "Staphylococcus aureus", "correct": false}, {"letter": "B", "text": "Streptococcus pneumoniae", "correct": true}, {"letter": "C", "text": "Mykoplasma pneumoniae", "correct": false}, {"letter": "D", "text": "Legionella pneumophila", "correct": false}, {"letter": "E", "text": "Pseudomonas aeruginosa", "correct": false}], "type": "single"}, {"text": "ŻZSK. Jakie podstawowe badanie jest potrzebne do rozpoznania?", "hint": "ZZSK — rozpoznanie wg kryteriów nowojorskich: radiologiczne zapalenie stawów krzyżowo-biodrowych ≥2. stopnia (obustronne) — obowiązkowe. MRI — do wczesnego wykrywania.", "options": [{"letter": "A", "text": "RTG stawów biodrowo-krzyżowych", "correct": true}, {"letter": "B", "text": "RTG lędźwiowego odcinka kręgosłupa", "correct": false}, {"letter": "C", "text": "RM kręgosłupa", "correct": false}, {"letter": "D", "text": "PET", "correct": false}, {"letter": "E", "text": "TK", "correct": false}], "type": "single"}, {"text": "Dziecko we wstrząsie hipowolemicznym. Początek infuzyjnej terapii, bolus płynów, dawka?", "hint": "PALS: bolus krystaloidu 20 ml/kg w ciągu 5-20 min we wstrząsie hipowolemicznym u dzieci, powtarzać do 60 ml/kg. We wstrząsie septycznym — ost wać, aby zredukować masę ciała?", "hint": "Semaglutyd (Wegovy) — agonista GLP-1, zmniejsza apetyt i masę ciała o ~15%. Przy otyłości opornej i hiperfagii (wieczornej) — lek pierwszego wyboru w Polsce.", "options": [{"letter": "A", "text": "semaglutyd", "correct": true}, {"letter": "B", "text": "orlistat", "correct": false}, {"letter": "C", "text": "metformina", "correct": false}, {"letter": "D", "text": "tirzepatyd", "correct": false}, {"letter": "E", "text": "kontynuacja diety, zwiększyć aktywność fizyczną", "correct": false}], "type": "single"}, {"text": "Celiakia — objawy:", "hint": "Celiakia jest wieloobjawowa: zahamowanie wzrostu, zaburzenia zachowania/depresja, osłabienie mięśni (hipoK, Mg), stolce tłuszczowe, opryszczkowate zapalenie skóry Duhringa, padaczka z patologicznym EEG. Wszystkie wymienione objawy są możliwe.", "items": ["zahamowanie wzrostu", "zaburzenia behawioralne i depresja", "osłabienie siły mięśniowej", "stolce tłuszczowe", "zmiany skórne", "nieprawidłowy zapis EEG"], "options": [{"letter": "A", "text": "1, 2, 3, 4", "correct": false}, {"letter": "B", "text": "4, 5, 6", "correct": false}, {"letter": "C", "text": "1, 3, 4", "correct": false}, {"letter": "D", "text": "1, 4, 5", "correct": false}, {"letter": "E", "text": "1, 2, 3, 4, 5", "correct": false}, {"letter": "F", "text": "2, 3, 4, 5", "correct": false}, {"letter": "G", "text": "wszystkie wymienione", "correct": true}], "type": "single"}, {"text": "Kobieta 39 lat, z rakiem trzustki (4 st) na paliatywnym leczeniu i noworozpoznaną cukrzycą na insulinie. Celowa HbA1C?", "hint": "PTD: przy leczeniu paliatywnym i krótkim oczekiwanym czasie życia cel HbA1c ≤8,0%. Najważniejsze — unikać objawowej hiperglikemii i hipoglikemii, nie dążyć do ścisłych celów.", "options": [{"letter": "A", "text": "6,5", "correct": false}, {"letter": "B", "text": "6", "correct": false}, {"letter": "C", "text": "7,5", "correct": false}, {"letter": "D", "text": "8", "correct": true}, {"letter": "E", "text": "7", "correct": false}], "type": "single"}, {"text": "Biegunka u dziecka:", "hint": "Ostra biegunka u dziecka — podstawą leczenia jest doustne nawadnianie (ORS). Antybiotyki tylko przy szczególnych zakażeniach (ciężka shigelloza, cholera, C. difficile).", "options": [{"letter": "A", "text": "wankomicyna", "correct": false}, {"letter": "B", "text": "nawadnianie doustne", "correct": true}, {"letter": "C", "text": "amoksycylina", "correct": false}, {"letter": "D", "text": "azytromycyna", "correct": false}, {"letter": "E", "text": "amoksycylina z kwasem klawulanowym", "correct": false}], "type": "single"}, {"text": "Rozpoczęcie porodu fizjologicznego:", "hint": "Początek porodu = regularne skurcze (≥1 na 10 min) + zmiany strukturalne szyjki (skrócenie + rozwarcie). Same skurcze lub samo odejście wód — to jeszcze nie poród.", "options": [{"letter": "A", "text": "regularna czynność skurczowa macicy w odstępach maksymalnie 10 min", "correct": false}, {"letter": "B", "text": "odejście wód płodowych", "correct": false}, {"letter": "C", "text": "czynność skurczowa macicy i skrócenie szyjki macicy 3 cm", "correct": false}, {"letter": "D", "text": "czynność skurczowa macicy", "correct": false}, {"letter": "E", "text": "regularna czynność skurczowa macicy w odstępach maksymalnie 10 min, skrócenie szyjki macicy, rozwarcie szyjki macicy", "correct": true}, {"letter": "F", "text": "regularna czynność skurczowa macicy w odstępach maksymalnie 3 min", "correct": false}], "type": "single"}, {"text": "Infekcja, która u facetów bezobjawowa, a u kobiet — upławy, pienista żółto-zielona wydzielina, dyspareunia. Na błonie śluzowej szyjki macicy — nadżerki i krostki:", "hint": "Trichomonas vaginalis: pieniste żółto-zielone upławy, „strawberry cervix\" (truskawkowa szyjka), u mężczyzn — często bezobjawowo. Leczenie — metronidazol u obojga partnerów.", "options": [{"letter": "A", "text": "waginoza bakteryjna", "correct": false}, {"letter": "B", "text": "rzeżączka", "correct": false}, {"letter": "C", "text": "rzęsistkowica", "correct": true}, {"letter": "D", "text": "kandydoza", "correct": false}, {"letter": "E", "text": "kiła", "correct": false}], "type": "single"}, {"text": "Niedźwięczne krótkie szmery oddechowe, wywoływane przez nagłe wyrównanie ciśnienia gazów pomiędzy dwoma obszarami płucnymi:", "hint": "Trzeszczenia (crepitations) = krótkie, niegłośne, na końcu wdechu — otwieranie się zapadniętych pęcherzyków/oskrzelików. Typowe przy obrzęku płuc, włóknieniu, zapaleniu płuc.", "options": [{"letter": "A", "text": "furczenie", "correct": false}, {"letter": "B", "text": "tarcie opłucnej", "correct": false}, {"letter": "C", "text": "trzeszczenia", "correct": true}, {"letter": "D", "text": "rzężenia", "correct": false}, {"letter": "E", "text": "świsty", "correct": false}], "type": "single"}, {"text": "Mężczyzna przygotowywał się do maratonu. Podczas treningu poczuł się źle, stracił przytomność. Stosuje leki na cukrzycę. W gazometrii: PH 7,1, niedobór zasad, ketonuria, glukoza 140. O przedawkowaniu jakiego leku to może świadczyć?", "hint": "Euglikemiczna kwasica ketonowa (pH↓, ciała ketonowe +, glikemia prawie prawidłowa) — typowa dla inhibitorów SGLT-2 (flozyn), zwłaszcza w stresie/wysiłku/głodzeniu.", "options": [{"letter": "A", "text": "metformina", "correct": false}, {"letter": "B", "text": "insulina", "correct": false}, {"letter": "C", "text": "flozyny", "correct": true}, {"letter": "D", "text": "glibenklamid", "correct": false}, {"letter": "E", "text": "glukozamina", "correct": false}], "type": "single"}, {"text": "Stopień klinicznego zaawansowania raka szyjki macicy można opisać wg skali:", "hint": "Rak szyjki macicy stopniowany jest wg FIGO (kliniczno-chirurgicznie od 2018) i TNM. POP-Q — dla obniżenia narządu rodnego.", "options": [{"letter": "A", "text": "TNM i FIGO", "correct": true}, {"letter": "B", "text": "FIGO i POP-Q", "correct": false}, {"letter": "C", "text": "tylko FIGO", "correct": false}, {"letter": "D", "text": "White, TNM, FIGO", "correct": false}, {"letter": "E", "text": "Grate, TNM, FIGO", "correct": false}], "type": "single"}, {"text": "Wczesnym objawem krzywicy u dziecka 4 mies. może być:", "hint": "Wczesne objawy krzywicy: kraniotabes (rozmiękanie potylicy, „ping-pong\"), pocenie się, niepokój, łysienie potyliczne. Deformacje kości kończyn — późne (po staniu).", "options": [{"letter": "A", "text": "rozmiękanie potylicy", "correct": true}, {"letter": "B", "text": "niedobór masy ciała", "correct": false}, {"letter": "C", "text": "deformacja klatki piersiowej", "correct": false}, {"letter": "D", "text": "opóźnione zarastanie ciemion", "correct": false}, {"letter": "E", "text": "zniekształcenia kości kończyn dolnych — koślawość, szpotawość", "correct": false}], "type": "single"}, {"text": "Patognomoniczny objaw idiopatycznego zwłóknienia płuc:", "hint": "IPF (UIP): „plastry miodu\" (honeycombing), trakcyjne rozstrzenie oskrzeli, podopłucnowo i przy podstawach na HRCT. Obraz UIP — patognomoniczny.", "options": [{"letter": "A", "text": "FEV1/FVC <70%", "correct": false}, {"letter": "B", "text": "\"plastry miodu\" na TK klatki piersiowej", "correct": true}, {"letter": "C", "text": "rozszerzenie przestrzeni powietrznych w płucach", "correct": false}, {"letter": "D", "text": "zacienienie przy dolnej części płuca", "correct": false}, {"letter": "E", "text": "guzy, nacieki", "correct": false}], "type": "single"}, {"text": "4 mies. dziecko choruje od 4 dni z gorączką do 38, po chwilowej poprawie ponownie skok temperatury, bez objawów zakażenia górnych dróg oddechowych, brak apetytu. RTG klp — norma. Rozpoznanie:", "hint": "Gorączka bez ogniska u niemowlęcia — zawsze wykluczać ZUM (najczęstsza przyczyna u dzieci do 2 lat). Wykonać badanie ogólne + posiew moczu.", "options": [{"letter": "A", "text": "gorączka trzydniowa", "correct": false}, {"letter": "B", "text": "ZUM", "correct": true}, {"letter": "C", "text": "zakażenie Enterowirusowe", "correct": false}, {"letter": "D", "text": "angina", "correct": false}, {"letter": "E", "text": "zapalenie ucha środkowego", "correct": false}], "type": "single"}, {"text": "CURB-65. Mężczyzna 67 lat z zaburzeniem świadomości (spłątanie). Mocznik, kreatynina — norma, BP 120/70, HR 75/min, RTG — podejrzenie zapalenia dolnego płata prawego płuca. Jaki przebieg i postępowanie?", "hint": "CURB-65: Confusion (+1) + wiek ≥65 (+1) = 2 punkty. 0-1 — leczenie ambulatoryjne, 2 — krótka hospitalizacja, ≥3 — ciężki przebieg, szpital/OIT.", "options": [{"letter": "A", "text": "ciężki przebieg, leczenie ambulatoryjne", "correct": false}, {"letter": "B", "text": "umiarkowany przebieg, leczenie szpitalne", "correct": true}, {"letter": "C", "text": "ciężki przebieg, leczenie szpitalne", "correct": false}, {"letter": "D", "text": "umiarkowany przebieg, leczenie ambulatoryjne", "correct": false}, {"letter": "E", "text": "przebieg łagodny, nie potrzebuje leczenia", "correct": false}], "type": "single"}, {"text": "APGAR. Dziecko — wiotkość mięśni, periodyczny oddech, tętno 80/min, skóra — zasinienie kończyn, reakcja — grymasa na cewnik. Ile punktów?", "hint": "APGAR: wiotkość (0) + nieregularny oddech (1) + HR 80 (1) + akrocyjanoza (1) + grymas (1) = 4 pkt. Umiarkowana zamartwica.", "options": [{"letter": "A", "text": "4", "correct": true}, {"letter": "B", "text": "0", "correct": false}, {"letter": "C", "text": "1", "correct": false}, {"letter": "D", "text": "8", "correct": false}, {"letter": "E", "text": "2", "correct": false}], "type": "single"}, {"text": "Nadgłośniowe zapalenie. Lekarz przyszedł na wizytę domową, dziecko choruje kilka dni — nie może połykać śliny, trudności z oddychaniem, obrzęk okolicy nadgłośniowej:", "hint": "Zapalenie nagłośni = stan nagły! Pilny transport z anestezjologiem (ryzyko niedrożności dróg oddechowych). NIE oglądać gardła szpatułką, NIE kłaść dziecka.", "options": [{"letter": "A", "text": "hospitalizacja karetką z anestezjologiem", "correct": true}, {"letter": "B", "text": "antybiotykoterapia", "correct": false}, {"letter": "C", "text": "otworzyć okno, żeby zmniejszyć temperaturę powietrza w pokoju", "correct": false}, {"letter": "D", "text": "inhalacja GKS przez nebulajzer", "correct": false}, {"letter": "E", "text": "skierować w szpital na oddział pulmonologiczny", "correct": false}], "type": "single"}, {"text": "Odruch Moro, prawda:", "hint": "Odruch Moro: zanika w 3-6 mies., wywoływany ostrym dźwiękiem lub szarpnięciem. Jednostronny = porażenie splotu ramiennego (Erba). Stwierdzenie 2 jest fałszywe (1-2 mies. zbyt wcześnie).", "items": ["zanika w 3-6 mies", "zanika w 1-2 mies", "wywołuje się jako reakcja na bodziec słuchowy", "jeżeli nie wygasa do 9 mies — porażenie piramidalne", "jednostronny — objaw porażenia splotu ramiennego z jednej strony"], "options": [{"letter": "A", "text": "1, 2, 4", "correct": false}, {"letter": "B", "text": "1, 3, 5", "correct": true}, {"letter": "C", "text": "2, 4, 5", "correct": false}, {"letter": "D", "text": "1, 2, 3, 5", "correct": false}, {"letter": "E", "text": "wszystkie odpowiedzi prawidłowe", "correct": false}], "type": "single"}, {"text": "Wskaż fałszywe stwierdzenie dotyczące rodzinnej polipowatości gruczolakowatej (FAP):", "hint": "FAP/zespół Gardnera: guzy desmoidalne (częściej krezki, po operacjach) — charakterystyczne (10-30%). Stwierdzenie D FAŁSZYWE. Gen APC, AD, rak brodawkowaty tarczycy, rak jelita grubego do 40. r.ż. = 100%.", "options": [{"letter": "A", "text": "u młodych robi się operacja Hartmana", "correct": false}, {"letter": "B", "text": "występuje zwiększona zachorowalność na raka brodawkowatego tarczycy", "correct": false}, {"letter": "C", "text": "dziedziczenie jest autosomalne i dominujące, mutacja dotyczy genu APC", "correct": false}, {"letter": "D", "text": "w jamie brzusznej nie tworzą się guzy desmoidalne", "correct": true}, {"letter": "E", "text": "w 4. dekadzie życia ryzyko rozwoju raka jelita grubego wynosi 100%", "correct": false}], "type": "single"}, {"text": "Maść z nitrogliceryną stosowana w proktologii? Leczenie czego?", "hint": "Maść z 0,2-0,4% nitrogliceryną rozluźnia zwieracz wewnętrzny odbytu → leczenie szczeliny odbytu. Alternatywa — diltiazem miejscowo.", "options": [{"letter": "A", "text": "hemoroidy", "correct": false}, {"letter": "B", "text": "ropień odbytu", "correct": false}, {"letter": "C", "text": "szczelina odbytu", "correct": true}, {"letter": "D", "text": "ostra niedokrwistość odbytu", "correct": false}, {"letter": "E", "text": "ostra niewydolność odbytu", "correct": false}], "type": "single"}, {"text": "Objaw Chwostka:", "hint": "Chvostek = uderzenie w n. facialis poniżej łuku jarzmowego → skurcz mięśni twarzy — utajona tężyczka/hipokalcemia. Opis B = objaw Trousseau (inny test na hipokalcemię).", "options": [{"letter": "A", "text": "utajona hipokalcemia (tężyczka), uderzenie młoteczkiem neurologicznym w nerw twarzowy tuż poniżej wyrostka jarzmowego", "correct": true}, {"letter": "B", "text": "3-minutowe ucinięcie ramienia mankietem ciśnieniomierza napompowanym do 20 mm Hg powyżej ciśnienia skurczowego", "correct": false}, {"letter": "C", "text": "uderzenie młoteczkiem neurologicznym w nerw strzałkowy wspólny", "correct": false}, {"letter": "D", "text": "skurcz mięśni wywołany zastosowaniem prądu galwanicznego o natężeniu <5 mA", "correct": false}], "type": "single"}, {"text": "Hiponatremia u pacjenta: stężenie sodu w surowicy 122 mmol/l, osmolalność osocza 225 mOsm/kg, osmolalność moczu 200 mOs/kg, stężenie sodu w moczu 50 mmol/l. Brak cech obrzęków, odwodnienia, hipowolemii. Normowolemia. Brak stosowania diuretyków:", "hint": "SIADH: hiponatremia + hipoosmia osocza + nieadekwatnie zagęszczony mocz (osm >100) + Na w moczu >20-40 + euwolemia + brak diuretyków. Wszystkie kryteria spełnione.", "options": [{"letter": "A", "text": "zespół mózgowej utraty soli", "correct": false}, {"letter": "B", "text": "SIADH", "correct": true}, {"letter": "C", "text": "polidypsja pierwotna", "correct": false}, {"letter": "D", "text": "zespół nerczycowy", "correct": false}, {"letter": "E", "text": "wymioty", "correct": false}], "type": "single"}, {"text": "Zespół metaboliczny. Według zaleceń PTD z 2019 roku, zwiększone ryzyko rozwoju cukrzycy typu 2 oraz zespołu metabolicznego wiąże się z obwodem talii przekraczającym:", "hint": "Obwód talii (PTD/IDF): ↑ryzyko M ≥94/K ≥80, bardzo ↑ ryzyko M ≥102/K ≥88. U mężczyzn zawsze wyższe progi. Zapamiętaj „94-80-102-88\".", "options": [{"letter": "A", "text": "dla mężczyzn ≥80 cm, dla kobiet ≥94 cm; bardzo wysokie ryzyko: dla mężczyzn ≥88 cm, dla kobiet ≥102 cm", "correct": false}, {"letter": "B", "text": "dla mężczyzn ≥88 cm, dla kobiet ≥102 cm; bardzo wysokie ryzyko: dla mężczyzn ≥80 cm, dla kobiet ≥94 cm", "correct": false}, {"letter": "C", "text": "dla mężczyzn ≥94 cm, dla kobiet ≥80 cm; bardzo wysokie ryzyko: dla mężczyzn ≥102 cm, dla kobiet ≥88 cm", "correct": true}, {"letter": "D", "text": "dla mężczyzn ≥88 cm, dla kobiet ≥80 cm; bardzo wysokie ryzyko: dla mężczyzn ≥102 cm, dla kobiet ≥94 cm", "correct": false}], "type": "single"}, {"text": "Jaki lek na nadciśnienie przeciwwskazany dla kobiety w ciąży:", "hint": "ACE-I, ARB, ARNI PRZECIWWSKAZANE w ciąży (teratogenne we wszystkich trymestrach). Bezpieczne: metyldopa, labetalol, nifedypina, hydralazyna.", "options": [{"letter": "A", "text": "kaptopril", "correct": true}, {"letter": "B", "text": "metyldopa", "correct": false}, {"letter": "C", "text": "nifedypyna", "correct": false}, {"letter": "D", "text": "labetalol", "correct": false}, {"letter": "E", "text": "amlodypyna", "correct": false}], "type": "single"}, {"text": "Ciężarna, pierwszy raz zgłosiła się do lekarza z glikemią na czczo 120 mg. Co robić?", "hint": "PTD 2024 — algorytm diagnostyki cukrzycy w ciąży: (1) glikemia na czczo <92 mg/dl → OGTT 24-28 tc.; (2) 92-125 mg/dl → niezwłocznie OGTT 75 g (jak tutaj: 120); (3) ≥126 mg/dl → potwierdzić drugim pomiarem → cukrzyca w ciąży (PGDM). Kryteria GDM w OGTT: na czczo 92-125 / 1h ≥180 / 2h 153-199 mg/dl (wystarczy jeden wynik poza normą).", "options": [{"letter": "A", "text": "rozpoznać cukrzycę i rozpocząć leczenie insuliną", "correct": false}, {"letter": "B", "text": "rozpoznać cukrzycę ciężarnej", "correct": false}, {"letter": "C", "text": "zrobić test OGTT 75 g glukozy w 24-28 t.c", "correct": false}, {"letter": "D", "text": "powtórzyć glikemię na czczo z krwi żylnej", "correct": false}, {"letter": "E", "text": "niezwłocznie zrobić test OGTT z 75 g glukozy", "correct": true}], "type": "single"}, {"text": "Kobieta po porodzie, trądzik, otyła, rozstępy na brzuchu, owłosienie w okolicy pleców. Pacjentka z próbą deksametazonu 1 mg, miała pomiar kortyzolu rano 30. Taktyka:", "hint": "Objawy Cushinga + nietłumiony kortyzol po 1 mg deksametazonu (>50 nmol/l / >1,8 μg/dl) → potwierdzenie hiperkortyzolemii → pilne skierowanie do endokrynologii w celu dalszej diagnostyki (ACTH, TK, MRI).", "options": [{"letter": "A", "text": "uspokoić i odpuścić z Bogiem", "correct": false}, {"letter": "B", "text": "skierowanie na oddział endokrynologii PILNE", "correct": true}, {"letter": "C", "text": "pilnie zrobić TK mózgu", "correct": false}, {"letter": "D", "text": "planowe skierowanie do poradni endokrynologicznej", "correct": false}], "type": "single"}, {"text": "Skala Tannera:", "hint": "Skala Tannera — stadia rozwoju płciowego (1-5): piersi i owłosienie łonowe u dziewcząt, narządy płciowe i owłosienie u chłopców. Określa „wiek płciowy\". Wiek kostny — wg Greulich-Pyle.", "options": [{"letter": "A", "text": "wspólna dla chłopców i dziewczynek", "correct": false}, {"letter": "B", "text": "określa kostny wiek dziecka", "correct": false}, {"letter": "C", "text": "określa wiek płciowy dziecka", "correct": true}, {"letter": "D", "text": "ocena zaburzenia dojrzewania płciowego u chłopców z zespołem Turnera", "correct": false}, {"letter": "E", "text": "wszystko wymienione", "correct": false}], "type": "single"}, {"text": "Przepuklina, jak leczyć chirurgicznie beznapięciowo:", "hint": "Plastyka beznapięciowa = metoda Lichtensteina (siatka syntetyczna). Bassini, Shouldice, Halsted, Girard — metody napięciowe (tissue repair).", "options": [{"letter": "A", "text": "metoda Bassiniego", "correct": false}, {"letter": "B", "text": "operacja Halsteda", "correct": false}, {"letter": "C", "text": "Lichtensteina", "correct": true}, {"letter": "D", "text": "Girarda", "correct": false}, {"letter": "E", "text": "Shouldice'a", "correct": false}], "type": "single"}, {"text": "TAPP – technika leczenia przepuklin:", "hint": "TAPP (Trans-Abdominal Pre-Peritoneal) i TEP (Total Extra-Peritoneal) — laparoskopowe metody beznapięciowe z siatką w przepuklinach pachwinowych.", "options": [{"letter": "A", "text": "laparoskopowa, napięciowa", "correct": false}, {"letter": "B", "text": "otwarta, napięciowa", "correct": false}, {"letter": "C", "text": "laparoskopowa, beznapięciowa", "correct": true}, {"letter": "D", "text": "otwarta, beznapięciowa", "correct": false}, {"letter": "E", "text": "endoskopowa, odbarczająca", "correct": false}], "type": "single"}, {"text": "Młody mężczyzna, bez przewlekłych chorób, zapalenie w okolicy szpary pośladkowej, bolesność, podczas badania brak wycieku ropnego:", "hint": "Torbiel włosowa (pilonidalna) — typowa u młodych mężczyzn w bruździe międzypośladkowej, bolesna. Bez wycieku ropnego = torbiel niepowikłana. Leczenie — wycięcie.", "options": [{"letter": "A", "text": "przetoka okołoodbytnicza", "correct": false}, {"letter": "B", "text": "ropień okołoodbytniczy (w fazie bez zapalenia)", "correct": false}, {"letter": "C", "text": "torbiel włosowa", "correct": true}, {"letter": "D", "text": "szczelina odbytu", "correct": false}, {"letter": "E", "text": "postać skórna wędrującego zapalenia jelita grubego", "correct": false}], "type": "single"}, {"text": "Która z poniższych nie przemawia za rozwojem czerniaka ze znamienia barwnikowego:", "hint": "ABCDE czerniaka: Asymmetry, Border irregular, Color varied, Diameter >6 mm, Evolution. Równomierny rozkład barwnika = cecha łagodna, prze i na twarzy", "correct": true}, {"letter": "B", "text": "mocz koloru \"coca-cola\", żółte powieki, dyslipidemia, proteinuria, obrzęki", "correct": false}, {"letter": "C", "text": "mocz koloru \"popłuczyn mięsnych\", blade powieki, dyslipidemia, proteinuria", "correct": false}, {"letter": "D", "text": "pienisty mocz, nadciśnienie tętnicze, proteinuria, obrzęki płuc", "correct": false}, {"letter": "E", "text": "mocz koloru \"popłuczyn mięsnych\", nadciśnienie tętnicze, proteinemia", "correct": false}], "type": "single"}, {"text": "Kobieta 56 lat, menopauza, krwawienie po stosunku i suchość pochwy, endometrium 2 mm na USG, wizyty u ginekologa regularne, hormony norma, cytologia norma:", "hint": "Pomenopauzalnie + suchość + krwawienie po stosunku + endometrium 2 mm (norma <5 mm) + prawidłowa cytologia = atrofia pochwy (zapalenie zanikowe). Leczenie — estrogeny miejscowo.", "options": [{"letter": "A", "text": "zanik (atrofia) błony śluzowej pochwy", "correct": true}, {"letter": "B", "text": "rak trzonu macicy", "correct": false}, {"letter": "C", "text": "rak szyjki macicy", "correct": false}, {"letter": "D", "text": "rak jajnika", "correct": false}, {"letter": "E", "text": "rak pochwy", "correct": false}], "type": "single"}, {"text": "Chirurg podczas operacji wykonuje manewr Pringle'a. To polega na uciśnięciu:", "hint": "Manewr Pringle'a = zaciśnięcie lig. hepatoduodenale (zawiera a. hepatica, v. portae, ductus choledochus) → zatrzymanie krwawienia z wątroby. Maks. 15-20 min.", "options": [{"letter": "A", "text": "tętnicy śledzionowej", "correct": false}, {"letter": "B", "text": "sieci mniejszej", "correct": false}, {"letter": "C", "text": "więzadła wątrobowo-dwunastniczego", "correct": true}, {"letter": "D", "text": "więzadła sierpowatego", "correct": false}, {"letter": "E", "text": "więzadła obłego wątroby", "correct": false}], "type": "single"}, {"text": "Dziecko z objawami zapalenia jelit, przebieg choroby WZJG. Jaki wskaźniki istotne dla określenia stopnia ciężkości choroby:", "hint": "Skala Truelove-Wittsa dla ciężkości WZJG: liczba krwistych stolców na dobę (>6 — ciężki), gorączka, tachykardia, Hb, OB. Najważniejsza — częstość stolców z krwią.", "options": [{"letter": "A", "text": "USG jamy brzusznej", "correct": false}, {"letter": "B", "text": "hematokryt", "correct": false}, {"letter": "C", "text": "badanie histopatologiczne bioptatów jelita grubego", "correct": false}, {"letter": "D", "text": "liczba krwistych stolców", "correct": true}, {"letter": "E", "text": "wskaźnik Fanta", "correct": false}], "type": "single"}, {"text": "Objawy Jaworskiego, Rovsinga, Blumberga:", "hint": "Zapalenie wyrostka robaczkowego: Jaworski (psoas), Rovsing (ucisk z lewej → ból z prawej), Blumberg (objaw odbicia). Objaw Murphy'ego — zapalenie pęcherzyka żółciowego.", "options": [{"letter": "A", "text": "zapalenie pęcherza moczowego", "correct": false}, {"letter": "B", "text": "zapalenie pęcherzyka żółciowego", "correct": false}, {"letter": "C", "text": "kolka moczowa", "correct": false}, {"letter": "D", "text": "zapalenie trzustki", "correct": false}, {"letter": "E", "text": "zapalenie wyrostka robaczkowego", "correct": true}], "type": "single"}, {"text": "Pacjent z oparzeniami 2 st. — przednia część klatki piersiowej i dwie kończyny górne. Obliczyć ilość płynów w ciągu pierwszej doby:", "hint": "Reguła dziewiątek: klatka piersiowa z przodu = 9%, kończyna górna = 9% (×2 = 18%) → 27%. Wzór Parklanda: 4 ml × kg × % = objętość na 24 godz. (50% w pierwszych 8 godz.). Bez masy ciała — nie da się policzyć.", "options": [{"letter": "A", "text": "29%, 10 l bazowe potrzeby plus 200 ml na każdą biegunkę", "correct": false}, {"letter": "B", "text": "27%, nie można policzyć bo brak masy ciała", "correct": true}, {"letter": "C", "text": "36%, nie można policzyć bo brak masy ciała", "correct": false}, {"letter": "D", "text": "18%, 3 600 ml", "correct": false}, {"letter": "E", "text": "27%, 10,8 l", "correct": false}], "type": "single"}, {"text": "Choroba — achalazja przełyku, skurcz dolnego zwieracza przełyku. Leczenie:", "hint": "Achalazja: pneumatyczna dylatacja balonowa, miotomia Hellera, POEM, toksyna botulinowa (u starszych/wysokiego ryzyka). Fundoplikacja — przy GERD, nie przy achalazji.", "options": [{"letter": "A", "text": "botulotoksynoterapia", "correct": true}, {"letter": "B", "text": "fundoplikacja", "correct": false}, {"letter": "C", "text": "ezofagostomia", "correct": false}, {"letter": "D", "text": "operacja Grünberga w modyfikacji Nakresona", "correct": false}, {"letter": "E", "text": "beznapięciowe operacji przełyku", "correct": false}], "type": "single"}, {"text": "Jakie leki nie stosuje się rutynowo podczas leczenia napadu podagry?", "hint": "Ostry napad dny: NLPZ, kolchicyna, GKS, anty-IL-1 (anakinra, kanakinumab — przy nietolerancji pozostałych). Allopurinolu NIE rozpoczyna się w napadzie (paradoksalne wytrącenie kryształów → nasilenie), tylko w okresie międzynapadowym. UWAGA: opcja E zawiera błąd — powinno być „anty-IL-1\", NIE „IL-6\" (tocilizumab to anty-IL-6, stosowany w RZS).", "options": [{"letter": "A", "text": "kolchicyna", "correct": false}, {"letter": "B", "text": "GKS", "correct": false}, {"letter": "C", "text": "NLPZ", "correct": false}, {"letter": "D", "text": "allopurinol", "correct": true}, {"letter": "E", "text": "IL-6", "correct": false}], "type": "single"}, {"text": "Skala Glasgow-Blatchford:", "hint": "Skala Glasgow-Blatchford — ocena krwawienia z górnego odcinka PP: przy 0 punktach — leczenie ambulatoryjne, ≥1 — szpital. Uwzględnia mocznik, Hb, HR, RR, smoliste stolce, omdlenie.", "options": [{"letter": "A", "text": "skala oceny poziomu świadomości pacjenta", "correct": false}, {"letter": "B", "text": "skala przewidywania konieczności hospitalizacji i ryzyka zgonu z powodu ostrego pozaszpitalnego zapalenia płuc", "correct": false}, {"letter": "C", "text": "skala przewidywania konieczności hospitalizacji i ryzyka zgonu z powodu krwawienia z górnego odcinka przewodu pokarmowego", "correct": true}, {"letter": "D", "text": "skala przewidywania ryzyka zgonu z powodu niedokrwiennego udaru mózgu", "correct": false}, {"letter": "E", "text": "skala przewidywania ryzyka zgonu z powodu zawału serca", "correct": false}], "type": "single"}, {"text": "Najczęstsze miejscowe powikłanie anginy?", "hint": "Najczęstsze miejscowe powikłanie zapalenia migdałków = ropień okołomigdałkowy (ropniak okołomigdałkowy). Ostre KZN i gorączka reumatyczna — późne powikłania ogólnoustrojowe.", "options": [{"letter": "A", "text": "ropniak", "correct": true}, {"letter": "B", "text": "róża", "correct": false}, {"letter": "C", "text": "zapalenie nerek", "correct": false}, {"letter": "D", "text": "zapalenie stawów", "correct": false}, {"letter": "E", "text": "zapalenie wsierdzia", "correct": false}], "type": "single"}, {"text": "Najczęstsza przyczyna krwawień z GOPP?", "hint": "Krwawienie z górnego odcinka PP: wrzód dwunastnicy + żołądka = ~50% przypadków. Żylaki przełyku — 10-20% (śmiertelność jednak wyższa). Mallory-Weiss — 5-10%.", "options": [{"letter": "A", "text": "choroba wrzodowa", "correct": true}, {"letter": "B", "text": "zespół Mallory'ego-Weissa", "correct": false}, {"letter": "C", "text": "żylaki przełyku", "correct": false}, {"letter": "D", "text": "poszerzenie żyły wrotnej", "correct": false}, {"letter": "E", "text": "rak przełyku", "correct": false}], "type": "single"}, {"text": "1. stopień uszkodzenia dróg żółciowych wg klasyfikacji Bismutha?", "hint": "Bismuth: I — uszkodzenie CHD >2 cm od rozwidlenia, II — <2 cm, III — na rozwidleniu, IV — rozdzielenie przewodów płatowych, V — uszkodzenie przewodu dodatkowego.", "options": [{"letter": "A", "text": "na poziomie ostrogi łączącej przewody wątrobowe", "correct": false}, {"letter": "B", "text": "< 2 cm od ostrogi łączącej przewody wątrobowe", "correct": false}, {"letter": "C", "text": "> 2 cm od ostrogi łączącej przewody wątrobowe", "correct": true}, {"letter": "D", "text": "prawego lub lewego przewodu wątrobowego", "correct": false}, {"letter": "E", "text": "wyłącznie przewodu żółciowego wspólnego", "correct": false}], "type": "single"}, {"text": "Rak jelita grubego, klasyfikacja wg Dukesa, I stopień:", "hint": "Dukes: A — w obrębie muscularis propria, B — przekroczenie ściany, C — zajęcie węzłów chłonnych, D — przerzuty odległe. I (= A) = do warstwy mięśniowej.", "options": [{"letter": "A", "text": "nowotwór nie przekracza błony podśluzowej", "correct": false}, {"letter": "B", "text": "nowotwór nie przekracza błony śluzowej", "correct": false}, {"letter": "C", "text": "nowotwór nie przekracza błony mięśniowej", "correct": true}, {"letter": "D", "text": "guz przekraczający ścianę jelita", "correct": false}, {"letter": "E", "text": "przerzuty w węzłach chłonnych", "correct": false}], "type": "single"}, {"text": "Zespół krótkiego jelita — możliwa przyczyna:", "hint": "Zespół krótkiego jelita = po rozległej resekcji jelita cienkiego (<200 cm). Przyczyny: zator t. krezkowej górnej, choroba Crohna z resekcjami, uwięźnięcie, uraz.", "options": [{"letter": "A", "text": "uwięźnięta przepuklina", "correct": false}, {"letter": "B", "text": "wrzód jelita cienkiego", "correct": false}, {"letter": "C", "text": "wrzód dwunastnicy", "correct": false}, {"letter": "D", "text": "wrzód żołądka", "correct": false}, {"letter": "E", "text": "zator tętnicy krezkowej", "correct": true}], "type": "single"}, {"text": "W jaki sposób ocenia się rozwój dziecka:", "hint": "Tablice centylowe (siatki centylowe) — podstawa oceny rozwoju dziecka: wzrost, masa, obwód głowy według wieku/płci. Norma zwykle 3.-97. centyl.", "options": [{"letter": "A", "text": "BMI", "correct": false}, {"letter": "B", "text": "wskaźniki proporcji", "correct": false}, {"letter": "C", "text": "biochemiczne wskaźniki rozwoju", "correct": false}, {"letter": "D", "text": "tablice centylowe", "correct": true}, {"letter": "E", "text": "wskaźniki składu ciała", "correct": false}], "type": "single"}, {"text": "Wskazania do operacji tętniaka aorty:", "hint": "Wskazania do operacji AAA: bezobjawowy ≥5,5 cm (K ≥5,0), każdy objawowy, szybki wzrost >5 mm/6 mies., rozwarstwienie/pęknięcie.", "options": [{"letter": "A", "text": "tętniak bezobjawowy 5,5 cm", "correct": false}, {"letter": "B", "text": "tętniak objawowy 2,5 cm", "correct": false}, {"letter": "C", "text": "rozwarstwienie tętniaka", "correct": false}, {"letter": "D", "text": "odpowiedzi A, B, C są prawidłowe", "correct": true}, {"letter": "E", "text": "żadna odpowiedź nie jest prawidłowa", "correct": false}], "type": "single"}, {"text": "Do najczęstszych objawów tzw „ostrego brzucha\" nie zalicza się:", "hint": "„Ostry brzuch\" przy zapaleniu otrzewnej: wymioty, wzdęcie, obrona mięśniowa, objaw Blumberga, BRAK perystaltyki (niedrożność porażenna). „Burza nad brzuchem\" — przy niedrożności mechanicznej.", "options": [{"letter": "A", "text": "wymiotów", "correct": false}, {"letter": "B", "text": "wzdęcia brzucha", "correct": false}, {"letter": "C", "text": "wzmożonych ruchów perystaltycznych — „burza nad brzuchem\"", "correct": true}, {"letter": "D", "text": "dodatniego objawu Blumberga", "correct": false}, {"letter": "E", "text": "objawu obrony mięśniowej", "correct": false}], "type": "single"}, {"text": "Czy usuwa się śledzionę podczas rezekcji żołądka i podczas operacji na trzonie trzustki?", "hint": "Splenektomia + dystalna pankreatektomia — często wykonywane razem z powodu wspólnych naczyń (a./v. lienalis przy górnym brzegu trzustki). Przy resekcji żołądka śledzionę zwykle pozostawia się.", "options": [{"letter": "A", "text": "tak, zawsze rutynowo", "correct": false}, {"letter": "B", "text": "tylko podczas obwodowej rezekcji trzustki", "correct": true}, {"letter": "C", "text": "podczas rezekcji żołądka", "correct": false}, {"letter": "D", "text": "podczas usunięcia pęcherzyka żółciowego z powodu kamicy", "correct": false}, {"letter": "E", "text": "podczas rezekcji przełyka", "correct": false}], "type": "single"}, {"text": "Leczenie encefalopatii wątrobowej:", "hint": "Leczenie encefalopatii wątrobowej: laktuloza (obniża amoniak), ryfaksymina (antybiotyk niewchłaniający się), L-asparaginian L-ornityny. Cyprofloksacyna — przy SBP, nie przy encefalopatii.", "options": [{"letter": "A", "text": "laktuloza", "correct": false}, {"letter": "B", "text": "cyprofloxacin", "correct": false}, {"letter": "C", "text": "L-asparaginian", "correct": false}, {"letter": "D", "text": "ryfaksymina", "correct": false}, {"letter": "E", "text": "1, 3, 4", "correct": true}], "type": "single"}, {"text": "Najczęstsza lokalizacja zatoru tętnic:", "hint": "Najczęstsza lokalizacja zatoru tętnic kończyn — rozwidlenie tętnicy udowej wspólnej (~40-50%) → rozprzestrzenianie do tętnicy udowej powierzchownej. Źródło najczęściej migotanie przedsionków.", "options": [{"letter": "A", "text": "t. udowa głęboka", "correct": false}, {"letter": "B", "text": "t. biodrowa", "correct": false}, {"letter": "C", "text": "t. ramienna", "correct": false}, {"letter": "D", "text": "t. barkowa", "correct": false}, {"letter": "E", "text": "t. udowa powierzchniowa", "correct": true}], "type": "single"}, {"text": "Objawy kliniczne związane z uchyłkiem Zenkera obejmują:", "hint": "Uchyłek Zenkera: dysfagia + zarzucanie nieprzetrawionego pokarmu + aspiracja (zachłystywanie) + cuchnący oddech + uczucie kuli. Możliwy ból zamostkowy.", "options": [{"letter": "A", "text": "cofanie pokarmu z żołądka, ból w klatce piersiowej, niedoczynność czynnościowa", "correct": false}, {"letter": "B", "text": "cofanie pokarmu z żołądka, zachłystywanie się, niedoczynność czynnościowa", "correct": false}, {"letter": "C", "text": "utrudnione połykanie, zachłystywanie się, niedoczynność czynnościowa", "correct": false}, {"letter": "D", "text": "utrudnione połykanie, zachłystywanie się, ból w klatce piersiowej", "correct": true}, {"letter": "E", "text": "utrudnione połykanie, ból w klatce piersiowej, niedoczynność czynnościowa", "correct": false}], "type": "single"}, {"text": "Mięśniaki macicy — prawda:", "hint": "Mięśniaki macicy: częściej u Afroamerykanek (×2-3), szczyt 35-50 r.ż., estrogenozależne. Przed 20. r.ż. — rzadko. Palenie nieco zmniejsza ryzyko, ale nie „leczy\".", "options": [{"letter": "A", "text": "mięśniaki — to samo co włókniaki", "correct": false}, {"letter": "B", "text": "przyczyny zmniejszające pojawienie się mięśniaka — palenie, kawa", "correct": false}, {"letter": "C", "text": "częściej u kobiet rasy czarnej", "correct": true}, {"letter": "D", "text": "częściej przed 20. rż", "correct": false}, {"letter": "E", "text": "wszystko wymienione", "correct": false}], "type": "single"}, {"text": "Zespół HELLP:", "hint": "HELLP: Hemolysis + Elevated Liver enzymes + Low Platelets. Płytki ↓<100 tys. Odpowiedź F błędna z powodu pkt D (podwyższone płytki).", "options": [{"letter": "A", "text": "hemoliza", "correct": false}, {"letter": "B", "text": "podwyższone próby wątrobowe", "correct": false}, {"letter": "C", "text": "obniżenie poziomu płytek", "correct": false}, {"letter": "D", "text": "podwyższenie poziomu płytek", "correct": false}, {"letter": "E", "text": "1, 2, 3", "correct": true}, {"letter": "F", "text": "wszystkie wymienione", "correct": false}], "type": "single"}, {"text": "Wrzodziejące zapalenie jelita grubego — złoty standard w leczeniu planowym chirurgicznym:", "hint": "Planowe leczenie chir. WZJG = proktokolektomia odtwórcza z IPAA (J-pouch) — złoty standard. Usuwa się całe jelito grube + odbytnicę, tworzy zbiornik krętniczo-odbytowy.", "options": [{"letter": "A", "text": "kolektomia sp. Hartmanna", "correct": false}, {"letter": "B", "text": "kolektomia z zespoleniem ileorektalnym", "correct": false}, {"letter": "C", "text": "proktokolektomia odtworcza", "correct": true}, {"letter": "D", "text": "proktokolektomia odtworcza z ileostomią pętlową", "correct": false}, {"letter": "E", "text": "odcinkowa resekcja okrężnicy", "correct": false}], "type": "single"}, {"text": "W klasyfikacji TNM raka jelita grubego cecha T1 oznacza naciekanie:", "hint": "TNM CRC: Tis — in situ (mucosa), T1 — submucosa, T2 — muscularis propria, T3 — subserosa/perirectal, T4 — błona surowicza/sąsiednie narządy.", "options": [{"letter": "A", "text": "błony śluzowej", "correct": false}, {"letter": "B", "text": "błony podśluzowej", "correct": true}, {"letter": "C", "text": "błony mięśniowej", "correct": false}, {"letter": "D", "text": "błony surowiczej", "correct": false}, {"letter": "E", "text": "sąsiednich narządów", "correct": false}], "type": "single"}, {"text": "W przypadku gruczolakoraka zlokalizowanego w esicy możliwe jest wykonanie:", "hint": "Gruczolakorak esicy — wybór zależy od sytuacji: planowa laparoskopia z resekcją (preferowana), zabieg otwarty, operacja Hartmanna (przy perforacji/niedrożności). Wszystkie metody możliwe.", "options": [{"letter": "A", "text": "laparoskopii, resekcji esicy", "correct": false}, {"letter": "B", "text": "operacji Hartmana przez laparotomię", "correct": false}, {"letter": "C", "text": "resekcji esicy przez laparotomię", "correct": false}, {"letter": "D", "text": "laparoskopii, operacji Hartmana", "correct": false}, {"letter": "E", "text": "wszystkich wymienionych", "correct": true}], "type": "single"}, {"text": "Zespół DIC:", "hint": "DIC: małopłytkowość, schistocyty, ↑PT/APTT/TT, OBNIŻENIE fibrynogenu (zużycie!), ↑D-dimerów. Pkt 4 fałszywy — fibrynogen spada, nie rośnie.", "items": ["małopłytkowość", "schistocyty w rozmazie krwi obwodowej", "przedłużony PT, przedłużony APTT i czas trombinowy", "zwiększone stężenie fibrynogenu", "zwiększone stężenie D-dimeru"], "options": [{"letter": "A", "text": "1, 2, 4", "correct": false}, {"letter": "B", "text": "2, 3, 5", "correct": false}, {"letter": "C", "text": "1, 2, 4, 5", "correct": false}, {"letter": "D", "text": "1, 2, 3, 5", "correct": true}, {"letter": "E", "text": "wszystkie odpowiedzi prawidłowe", "correct": false}], "type": "single"}, {"text": "Najczęstsza alergia u niemowląt:", "hint": "Alergia na białko mleka krowiego (ABMK) — najczęstsza u niemowląt (~2-3%). Często ustępuje do 3.-5. r.ż. Objawy: atopowe zapalenie skóry, ze strony PP, ze strony układu oddechowego.", "options": [{"letter": "A", "text": "soja", "correct": false}, {"letter": "B", "text": "jajo kurze", "correct": false}, {"letter": "C", "text": "orzechy", "correct": false}, {"letter": "D", "text": "krewetki", "correct": false}, {"letter": "E", "text": "białko mleka krowiego", "correct": true}], "type": "single"}, {"text": "Mężczyzna, krwotok z GOPP, ma stent (w wywiadzie — zawał), stosuje kwas acetylosalicylowy i klopidogrel. Zalecone postępowanie:", "hint": "Krwawienie z górnego odcinka PP u pacjenta na DAPT po stencie: kontynuować ASA (główna ochrona stentu), tymczasowo odstawić klopidogrel. Pełne odstawienie — ryzyko zakrzepicy w stencie.", "options": [{"letter": "A", "text": "odstawić oba leki", "correct": false}, {"letter": "B", "text": "nie odstawiać", "correct": false}, {"letter": "C", "text": "odstawić kwas acetylosalicylowy, zostawić leki przeciwkrzepliwe", "correct": false}, {"letter": "D", "text": "zostawić kwas acetylosalicylowy, odstawić leki przeciwkrzepliwe", "correct": true}, {"letter": "E", "text": "niezwłocznie zwiększyć dawki obu leków", "correct": false}], "type": "single"}, {"text": "Zator tętnicy krezkowej — co jest prawdą?", "hint": "Ostre niedokrwienie krezki: nagły silny ból w okolicy okołopępkowej („pain out of proportion\"), następnie rozlane zapalenie otrzewnej. Często krwawa biegunka, wymioty, na początku ↑perystaltyki.", "options": [{"letter": "A", "text": "silny ból w śródbrzuszu w okolicy pępka, który następnie obejmuje całą jamę brzuszną", "correct": true}, {"letter": "B", "text": "początkowo ma charakter stały, a później falowy", "correct": false}, {"letter": "C", "text": "umiarkowany ból, promieniujący do okolicy lędźwiowej", "correct": false}, {"letter": "D", "text": "nie towarzyszy temu wzmożenie perystaltyki, biegunka z krwią i śluzem oraz wymioty", "correct": false}, {"letter": "E", "text": "żadna odpowiedź nie jest prawidłowa", "correct": false}], "type": "single"}, {"text": "Niskie poprzeczne ustawienie główki płodu to:", "hint": "Niskie poprzeczne stanie główki: pełne rozwarcie, główka na dnie miednicy, brak rotacji wewnętrznej, szew strzałkowy w wymiarze poprzecznym wychodu → zatrzymanie porodu. Wymaga interwencji (próżniociąg/CC).", "options": [{"letter": "A", "text": "przy całkowitym rozwarciu ujścia szyjki macicy główka płodu osiągnęła dno miednicy, nie dokonała drugiego zwrotu, a szew strzałkowy przebiega w wymiarze poprzecznym wychodu miednicy i dochodzi do zahamowania porodu", "correct": true}, {"letter": "B", "text": "przy całkowitym rozwarciu ujścia szyjki macicy główka płodu osiągnęła dno miednicy, nie dokonała drugiego zwrotu, a szew strzałkowy przebiega w wymiarze poprzecznym wychodu miednicy, przoduje ciemię małe i dochodzi do spowolnienia porodu", "correct": false}, {"letter": "C", "text": "przy całkowitym rozwarciu ujścia szyjki macicy główka płodu osiągnęła dno miednicy, nie dokonała drugiego zwrotu, a szew strzałkowy przebiega w wymiarze skośnym wychodu miednicy i dochodzi do spowolnienia porodu", "correct": false}, {"letter": "D", "text": "przy prawie pełnym rozwarciu ujścia szyjki macicy główka płodu osiągnęła dno miednicy, dokonała drugi zwrot i szew strzałkowy przebiega w wymiarze poprzecznym wychodu miednicy i dochodzi do spowolnienia porodu", "correct": false}, {"letter": "E", "text": "przy prawie pełnym rozwarciu ujścia szyjki macicy główka płodu osiągnęła dno miednicy, nie dokonała drugiego zwrotu, a szew strzałkowy przebiega w wymiarze poprzecznym wychodu miednicy i dochodzi do spowolnienia porodu", "correct": false}], "type": "single"}, {"text": "Do nieprawidłowości w ułożeniu główki w czasie porodu nie należy:", "hint": "Ustawienie potylicowe PRZEDNIE — to prawidłowe, fizjologiczne ułożenie! Tylne, poprzeczne stanie, wysokie proste — patologia.", "options": [{"letter": "A", "text": "niskie poprzeczne stanie główki", "correct": false}, {"letter": "B", "text": "wysokie proste stanie główki", "correct": false}, {"letter": "C", "text": "ustawienie potylicowe tylne", "correct": false}, {"letter": "D", "text": "położenie skośne", "correct": false}, {"letter": "E", "text": "ustawienie potylicowe przednie", "correct": true}], "type": "single"}, {"text": "Uszkodzenie nerek w SLE:", "hint": "Aktywne toczniowe zapalenie nerek: ↓C3, ↓C4 (zużycie przez kompleksy immunologiczne), ↑anty-dsDNA. Hipokomplementemia — marker aktywności zapalenia nerek. Anty-GBM — zespół Goodpasture'a.", "options": [{"letter": "A", "text": "podwyższone ciśnienie i przewlekła proteinuria", "correct": false}, {"letter": "B", "text": "markery tocznia rumieniowatego — anty-dsDNA, Anty-Sm", "correct": false}, {"letter": "C", "text": "przeciwciała anty-GBM", "correct": false}, {"letter": "D", "text": "< dopełniacza C3, C4", "correct": true}, {"letter": "E", "text": "zwiększenie aktywności AST, ALT", "correct": false}], "type": "single"}, {"text": "Dystocja barkowa: objawy, manewry, powikłania:", "hint": "Dystocja barkowa: „turtle sign\" (objaw żółwia — główka cofa się), manewr McRobertsa (hiperfleksja bioder) + ucisk nadłonowy. Powikłanie — porażenie Erba (splot ramienny).", "options": [{"letter": "A", "text": "objaw kraba, sposób Brachta, porażenie splotu krzyżowego", "correct": false}, {"letter": "B", "text": "objaw żółwia, manewr McRoberts, porażenie splotu barkowego", "correct": true}, {"letter": "C", "text": "objaw czajki, sposób Müllera, złamanie kości udowej", "correct": false}, {"letter": "D", "text": "objaw wieloryba, sposób Bickenbacha, zwichnięcie stawu szczytowo-potylicznego", "correct": false}, {"letter": "E", "text": "żadna odpowiedź nie jest prawidłowa", "correct": false}], "type": "single"}, {"text": "II stopień w klasyfikacji powikłań zapalenia uchyłków jelita grubego wg Hinchey'a oznacza:", "hint": "Hinchey: I — ropień okołookrężniczy, II — odległy (miedniczny/międzypętlowy) ropień, III — ropne zapalenie otrzewnej, IV — kałowe zapalenie otrzewnej. III-IV — operacja Hartmanna.", "options": [{"letter": "A", "text": "zapalenie uchyłków z wytworzeniem ropnia okołookrężniczego", "correct": false}, {"letter": "B", "text": "zapalenie uchyłków z wytworzeniem ropnia odległego", "correct": true}, {"letter": "C", "text": "zapalenie uchyłków z rozlanym ropnym zapaleniem otrzewnej", "correct": false}, {"letter": "D", "text": "zapalenie uchyłków z rozlanym kałowym zapaleniem otrzewnej", "correct": false}, {"letter": "E", "text": "klasyfikacja Hinchey'a nie dotyczy zapalenia uchyłków", "correct": false}], "type": "single"}, {"text": "Co nie jest przeciwwskazaniem do zajścia w ciążę:", "hint": "Bezwzględne PP do ciąży: ciężka PChN, niekontrolowane NT, NYHA III-IV, retinopatia proliferacyjna (bez leczenia). Izolowany białkomocz — NIE jest bezwzględnym PP, wymaga obserwacji.", "options": [{"letter": "A", "text": "retinopatia proliferacyjna", "correct": false}, {"letter": "B", "text": "niekontrolowane ciśnienie tętnicze", "correct": false}, {"letter": "C", "text": "białkomocz", "correct": true}, {"letter": "D", "text": "niewydolność serca", "correct": false}, {"letter": "E", "text": "nefropatia zaawansowana", "correct": false}], "type": "single"}, {"text": "Dziecko z anafilaksją, wybierz prawidłowe postępowanie:", "hint": "Anafilaksja u dziecka: adrenalina 0,01 mg/kg (1:1000) i.m. w boczną powierzchnię uda, maks. 0,3 mg (dzieci) / 0,5 mg (dorośli). NIE i.v. (ryzyko arytmii)!", "options": [{"letter": "A", "text": "GKS", "correct": false}, {"letter": "B", "text": "adrenalina 0,01 mg/kg, 1:1000, nie więcej niż 0,3 mg i.v.", "correct": false}, {"letter": "C", "text": "adrenalina 0,01 mg/kg, 1:1000, nie więcej niż 0,3 mg i.m.", "correct": true}, {"letter": "D", "text": "adenozyna 0,1 mg/kg, 1:100, nie więcej niż 3 mg i.c.", "correct": false}, {"letter": "E", "text": "leki antyhistaminowe, p.o.", "correct": false}], "type": "single"}, {"text": "Wskaż prawdziwe stwierdzenie dotyczące wysiłkowego nietrzymania moczu:", "hint": "Wysiłkowe NTM: wyciek przy ↑ciśnienia wewnątrzbrzusznego (kaszel, kichanie, wysiłek fiz.). Nykturia i parcia naglące — dla urge-incontinence (pęcherz nadreaktywny).", "options": [{"letter": "A", "text": "wzrostowi ciśnienia wewnątrz jamy brzusznej towarzyszy mimowolne wyciekanie moczu", "correct": true}, {"letter": "B", "text": "wyciekaniu moczu towarzyszy silne, ale krótkie parcie na mocz", "correct": false}, {"letter": "C", "text": "objętość moczu jest duża", "correct": false}, {"letter": "D", "text": "wzrasta częstość mikcji w nocy", "correct": false}, {"letter": "E", "text": "obserwuje się nadmierną pobudliwość mięśnia wypieracza pęcherza moczowego", "correct": false}], "type": "single"}, {"text": "Spośród wymienionych jedynym lekiem zarejestrowanym do leczenia wysiłkowego nietrzymania moczu jest:", "hint": "Duloksetyna (SNRI) — jedyny lek zarejestrowany do leczenia wysiłkowego NTM u kobiet. Wzmaga napięcie zwieracza przez serotoninę/noradrenalinę w jądrze Onufa.", "options": [{"letter": "A", "text": "paroksetyna", "correct": false}, {"letter": "B", "text": "duloksetyna", "correct": true}, {"letter": "C", "text": "wenlafaksyna", "correct": false}, {"letter": "D", "text": "dapoksetyna", "correct": false}, {"letter": "E", "text": "fluoksetyna", "correct": false}], "type": "single"}, {"text": "Czynnikami ryzyka wystąpienia wysiłkowego nietrzymania moczu są:", "hint": "ChR wysiłkowego NTM: ↑wiek, ↑BMI (otyłość), porody drogami natury, wielorództwo, przewlekły kaszel (POChP, palenie), przewlekłe zaparcia (parcia tłoczni brzusznej), histerektomia, niedobór estrogenów (menopauza). Leki diuretyczne → głównie ↑parcia naglące/pęcherz nadreaktywny, nie czyste WNM; mogą jednak nasilać objawy. Młody wiek i niskie BMI — NIE są ChR.", "items": ["młody wiek", "BMI < 30 kg/m²", "przewlekłe zaparcia", "przyjmowanie leków diuretycznych i hipotensyjnych", "choroby przewlekłe przebiegające z kaszlem"], "options": [{"letter": "A", "t
