t": "Plastyka części zstępującej dwunastnicy", "correct": false}, {"letter": "C", "text": "Plastyka przełyku, dna żołądka i rozworu przełykowego", "correct": true}, {"letter": "D", "text": "Plastyka jelit sposobem Bischop-Koopa", "correct": false}, {"letter": "E", "text": "Plastyka odźwiernika żołądka", "correct": false}], "type": "single"}, {"text": "Kardiomiotomia to zabieg operacyjny stosowany w leczeniu:", "hint": "Kardiomiotomia Hellera = podłużne nacięcie mięśni dolnego zwieracza przełyku. Leczenie achalazji (zaburzenie relaksacji LES).", "options": [{"letter": "A", "text": "Zaciskającego zapalenia osierdzia", "correct": false}, {"letter": "B", "text": "Koarktacji aorty", "correct": false}, {"letter": "C", "text": "Achalazji przełyku", "correct": true}, {"letter": "D", "text": "Zwłóknienia opłucnej", "correct": false}, {"letter": "E", "text": "IZW (infekcyjnego zapalenia wsierdzia)", "correct": false}], "type": "single"}, {"text": "Powikłaniem choroby uchyłkowej jelita grubego NIE JEST:", "hint": "Powikłania uchyłkowatości: zapalenie uchyłków, perforacja, ropień, krwawienie, przetoka, niedrożność. Odcinkowa martwica jelita to objaw niedokrwiennego zapalenia jelita, a nie powikłanie uchyłkowatości.", "options": [{"letter": "A", "text": "Krwotok z uchyłka", "correct": false}, {"letter": "B", "text": "Odcinkowa martwica jelita", "correct": true}, {"letter": "C", "text": "Zapalenie uchyłków", "correct": false}, {"letter": "D", "text": "Perforacja przewodu pokarmowego", "correct": false}, {"letter": "E", "text": "Ropień śródbrzuszny", "correct": false}], "type": "single"}, {"text": "Do czynników utrudniających gojenie przetok jelitowych należą:", "hint": "Mnemonik FRIENDS: Foreign body (ciało obce), Radiation (radioterapia), Infection/IBD (zakażenie/NChZJ), Epithelialization (epitelializacja), Neoplasm (nowotwór), Distal obstruction (dystalna niedrożność), Steroids/Sepsis (steroidy/sepsa) — wszystkie te czynniki utrudniają gojenie przetoki.", "options": [{"letter": "A", "text": "Niedrożność jelita w odcinku dystalnym od przetoki", "correct": false}, {"letter": "B", "text": "Wszystkie odpowiedzi są poprawne", "correct": true}, {"letter": "C", "text": "Ciało obce", "correct": false}, {"letter": "D", "text": "Przebyta radioterapia jelita", "correct": false}, {"letter": "E", "text": "Aktywna choroba nowotworowa", "correct": false}], "type": "single"}, {"text": "U 67-letniego mężczyzny z bezbólową żółtaczką od 2 tygodni stwierdzono znacznie powiększony, niebolesny pęcherzyk żółciowy. Najbardziej prawdopodobna przyczyna żółtaczki:", "hint": "Objaw Courvoisiera: bezbólowa żółtaczka + powiększony, niebolesny pęcherzyk żółciowy = pozawątrobowa niedrożność dróg żółciowych o etiologii złośliwej (najczęściej rak głowy trzustki). W kamicy pęcherzyk jest zwykle obkurczony (przewlekły stan zapalny).", "options": [{"letter": "A", "text": "Zatkanie przewodu żółciowego wspólnego przez kamień", "correct": false}, {"letter": "B", "text": "Ostre zapalenie pęcherzyka żółciowego", "correct": false}, {"letter": "C", "text": "Ostre zapalenie trzustki, postać obrzękowa", "correct": false}, {"letter": "D", "text": "Ucisk na przewód żółciowy wspólny przez guz głowy trzustki", "correct": true}, {"letter": "E", "text": "Alkoholowe zapalenie wątroby", "correct": false}], "type": "single"}, {"text": "Najrzadsze złamanie żeber. Jakich?", "hint": "Złamanie żeber I–III jest rzadkie (są chronione przez obojczyk, łopatkę i mięśnie), ale wymaga DUŻEJ siły urazu → wiąże się z ciężkim urazem (uszkodzenie dużych naczyń, splotu ramiennego).", "options": [{"letter": "A", "text": "I-III", "correct": true}, {"letter": "B", "text": "IV-VII", "correct": false}, {"letter": "C", "text": "V-VIII", "correct": false}, {"letter": "D", "text": "X-XII", "correct": false}], "type": "single"}, {"text": "W leczeniu ropniaka opłucnej stosuje się:", "hint": "Leczenie ropniaka opłucnej: antybiotyki + drenaż (stadium I–II) → fibrynoliza doopłucnowa (stadium II–III) → VATS/torakotomia z ocz pozostaje rozcieńczony. Następnie podaje się desmopresynę: postać ośrodkowa odpowiada, nefrogenna — nie.", "options": [{"letter": "A", "text": "Przewodnienia", "correct": false}, {"letter": "B", "text": "Niewydolności nerek", "correct": false}, {"letter": "C", "text": "SIADH", "correct": false}, {"letter": "D", "text": "Hiperaldosteronizmu pierwotnego", "correct": false}, {"letter": "E", "text": "Moczówki prostej", "correct": true}], "type": "single"}, {"text": "Kobieta 40 lat, leczona z powodu cukrzycy, sepsa po usunięciu zęba. Po poprawie: obrzęk płuc, gorączka 38,5°C, niedowład połowiczy lewostronny. Echo — wegetacja na zastawce mitralnej. W posiewach krwi — Staphylococcus aureus. Wskaż przyczynę:", "hint": "Triada infekcyjnego zapalenia wsierdzia: gorączka + wegetacja w ECHO + dodatni posiew krwi (S. aureus). Niedowład połowiczy — zator septyczny do mózgu. Zabieg stomatologiczny — typowe źródło zakażenia.", "options": [{"letter": "A", "text": "IZW", "correct": true}, {"letter": "B", "text": "Wstrząs septyczny", "correct": false}, {"letter": "C", "text": "Nabyta wada serca w wyniku infekcji", "correct": false}, {"letter": "D", "text": "Zatory tłuszczowe", "correct": false}, {"letter": "E", "text": "Obrzęk płuc z powodu przewodnienia", "correct": false}], "type": "single"}, {"text": "U 40-letniej pacjentki po operacji wątroby, zaintubowanej, z wentylacją mechaniczną i dużym PEEP, nagle tachykardia, zaburzenia rytmu, hipotonia, saturacja 60%. Najbardziej prawdopodobna przyczyna:", "hint": "Wysokie PEEP + wentylacja mechaniczna → zwiększone ryzyko odmy prężnej. Nagła hipotonia + desaturacja + tachykardia u pacjenta wentylowanego = podejrzenie odmy prężnej → pilna dekompresja.", "options": [{"letter": "A", "text": "Zator tętnicy płucnej", "correct": false}, {"letter": "B", "text": "Septyczne zapalenie wsierdzia", "correct": false}, {"letter": "C", "text": "Odma opłucnowa", "correct": true}, {"letter": "D", "text": "Udar mózgu", "correct": false}, {"letter": "E", "text": "Zawał serca", "correct": false}], "type": "single"}, {"text": "Do leków przeciwpłytkowych nie należy:", "hint": "Leki przeciwpłytkowe: ASA, inhibitory P2Y12 (klopidogrel, prasugrel, tikagrelor), blokery GP IIb/IIIa (abciksymab). Rywaroksaban to lek przeciwkrzepliwy (DOAC, inhibitor czynnika Xa).", "options": [{"letter": "A", "text": "Klopidogrel", "correct": false}, {"letter": "B", "text": "Bloker GP IIb/IIIa", "correct": false}, {"letter": "C", "text": "Prasugrel", "correct": false}, {"letter": "D", "text": "Kwas acetylosalicylowy", "correct": false}, {"letter": "E", "text": "Rywaroksaban", "correct": true}], "type": "single"}, {"text": "Stopień ciężkości obturacji — ciężki — oznacza FEV1:", "hint": "Stadia GOLD (FEV1% wartości należnej): I (łagodne) ≥80%, II (umiarkowane) 50–79%, III (ciężkie) 30–49%, IV (bardzo ciężkie) <30%.", "options": [{"letter": "A", "text": "<30%", "correct": false}, {"letter": "B", "text": ">50% i <80%", "correct": false}, {"letter": "C", "text": ">80%", "correct": false}, {"letter": "D", "text": "<20%", "correct": false}, {"letter": "E", "text": ">30% i <50%", "correct": true}], "type": "single"}, {"text": "U pacjenta z nawracającym bólem wieńcowym, bez zmian EKG świadczących o niedokrwieniu i prawidłowych troponinach — koronarografię należy wykonać:", "hint": "Stabilna dławica piersiowa (bez cech niedokrwienia w EKG, bez ↑troponin) → koronarografia w trybie planowym po wynikach badań nieinwazyjnych. <2 h — STEMI, <24 h — NSTEMI wysokiego ryzyka.", "options": [{"letter": "A", "text": "Nie ma wskazań", "correct": false}, {"letter": "B", "text": "Jak najszybciej, do 2h", "correct": false}, {"letter": "C", "text": "W trybie planowym", "correct": true}, {"letter": "D", "text": "W ciągu 24h od wystąpienia bólu", "correct": false}, {"letter": "E", "text": "W ciągu 48h od wystąpienia bólu", "correct": false}], "type": "single"}, {"text": "Zespół rakowiaka — napadowe zaczerwienienie skóry twarzy, tachykardia, zawroty głowy, biegunka. Nowotwór neuroendokrynny wytwarzający:", "hint": "Zespół rakowiaka = serotonina (5-HT) + tachykininy. Objawy: napadowe zaczerwienienie skóry (flushing), biegunka, skurcz oskrzeli, zmiany w sercu (prawe serce). Marker: 5-HIAA w moczu.", "options": [{"letter": "A", "text": "VIP", "correct": false}, {"letter": "B", "text": "Insulinę", "correct": false}, {"letter": "C", "text": "Tyreotropinę", "correct": false}, {"letter": "D", "text": "Serotoninę", "correct": true}, {"letter": "E", "text": "Leptynę", "correct": false}], "type": "single"}, {"text": "58-letnia kobieta, bóle brzucha, wymioty, wzdęcie, 5 dni bez stolca. RTG — liczne poziomy płynów i znaczne rozdęcie okrężnicy. Niedrożność jelita grubego spowodowana:", "hint": "Najczęstsza przyczyna niedrożności jelita grubego u pacjenta >50 lat = nowotwór (~60%), następnie skręt jelita i zwężenia w przebiegu uchyłkowatości. Dla jelita cienkiego — zrosty pooperacyjne.", "options": [{"letter": "A", "text": "Uchyłkami jelita grubego", "correct": false}, {"letter": "B", "text": "Połkniętym ciałem obcym", "correct": false}, {"letter": "C", "text": "Guzem nowotworowym", "correct": true}, {"letter": "D", "text": "Zrostami otrzewnowymi pooperacyjnymi", "correct": false}, {"letter": "E", "text": "Uchyłkiem Meckela", "correct": false}], "type": "single"}, {"text": "Przesiewowa kolonoskopia — guz odbytnicy na wysokości 11 cm, śr. 3 cm. Hist-pat: gruczolak kosmkowy. Postępowanie:", "hint": "Gruczolak kosmkowy — zmiana przedrakowa (~30% ryzyko transformacji złośliwej) → usunąć w całości endoskopowo (polipektomia/EMR/ESD). Leczenie operacyjne — wyłącznie przy niepowodzeniu endoskopii lub stwierdzeniu raka inwazyjnego.", "options": [{"letter": "A", "text": "Radioterapia na obszar miednicy", "correct": false}, {"letter": "B", "text": "Uspokoić — to nie jest zmiana nowotworowa, nie potrzebne leczenie", "correct": false}, {"letter": "C", "text": "Przednia resekcja odbytnicy", "correct": false}, {"letter": "D", "text": "Kontrolna kolonoskopia za 12 mies", "correct": false}, {"letter": "E", "text": "Polipektomia endoskopowa — usunięcie zmiany w całości", "correct": true}], "type": "single"}, {"text": "Niedokrwistość chorób przewlekłych:", "hint": "Niedokrwistość chorób przewlekłych (ACD): Fe ↓, TIBC ↓, ferrytyna ↑ (białko ostrej fazy), TSAT N/↓. IDA: Fe ↓↓, TIBC ↑, ferrytyna ↓, TSAT ↓↓. Główna różnica — ferrytyna.", "options": [{"letter": "A", "text": "Żelazo N/↑, TIBC N/↓, TSAT N/↑, Ferrytyna N/↑", "correct": false}, {"letter": "B", "text": "Żelazo ↓↓, TIBC ↑, TSAT ↓, Ferrytyna ↓ lub N", "correct": false}, {"letter": "C", "text": "Żelazo ↑, TIBC N, TSAT ↑, Ferrytyna ↑", "correct": false}, {"letter": "D", "text": "Żelazo N, TIBC N, TSAT N, Ferrytyna N", "correct": false}, {"letter": "E", "text": "Żelazo ↓, TIBC ↓, TSAT N lub ↓, Ferrytyna ↑ lub N", "correct": true}], "type": "single"}, {"text": "Rak jelita grubego — najczętsza lokalizacja:", "hint": "~30% raka jelita grubego lokalizuje się w odbytnicy, ~25% w esicy. Razem odbytnica + esica = ~55–60% wszystkich CRC. Wyjaśnia to dużą wartość diagnostyczną sigmoidoskopii.", "options": [{"letter": "A", "text": "Poprzecznica", "correct": false}, {"letter": "B", "text": "Wstępnica z kątnicą", "correct": false}, {"letter": "C", "text": "Esica", "correct": false}, {"letter": "D", "text": "Zstępnica", "correct": false}, {"letter": "E", "text": "Odbytnica", "correct": true}], "type": "single"}, {"text": "Hormonalnie czynny guz przysadki, który można skutecznie leczyć farmakologicznie, wytwarza:", "hint": "Prolactinoma — jedyny gruczolak przysadki skutecznie leczony farmakologicznie (kabergolina, bromokryptyna — agoniści D2). W pozostałych gruczolakach przysadki — głównie leczenie operacyjne.", "options": [{"letter": "A", "text": "Folikulotropinę (FSH)", "correct": false}, {"letter": "B", "text": "Kortykotropinę (ACTH)", "correct": false}, {"letter": "C", "text": "Hormon wzrostu (GH)", "correct": false}, {"letter": "D", "text": "Prolaktynę (PRL)", "correct": true}, {"letter": "E", "text": "Lutropinę (LH)", "correct": false}], "type": "single"}, {"text": "U pacjenta z pierwotną nadczynnością tarczycy stwierdzisz zmiany hormonalne:", "hint": "Pierwotna nadczynność tarczycy: ↑FT3/FT4 → ujemne sprzężenie zwrotne → ↓TSH, ↓TRH. Pierwotna niedoczynność tarczycy — odwrotnie: ↑TSH, ↓FT3/FT4.", "options": [{"letter": "A", "text": "TRH norma, TSH norma, FT3 obniżone, FT4 norma", "correct": false}, {"letter": "B", "text": "TRH obniżone, TSH obniżone, FT4 podwyższone, FT3 podwyższone", "correct": true}, {"letter": "C", "text": "TRH norma, TSH norma, FT3 norma, FT4 norma", "correct": false}, {"letter": "D", "text": "TRH podwyższone, TSH podwyższone, FT3 obniżone, FT4 obniżone", "correct": false}, {"letter": "E", "text": "TRH podwyższone, TSH norma, FT4 norma, FT3 podwyższone", "correct": false}], "type": "single"}, {"text": "Najczęstszy rak tarczycy u dorosłych:", "hint": "Rak tarczycy: brodawkowaty (~80%, najlepsze rokowanie), pęcherzykowy (~15%), rdzeniasty (~5%, MEN2), anaplastyczny (~1%, najgorsze rokowanie).", "options": [{"letter": "A", "text": "Rak rdzeniasty", "correct": false}, {"letter": "B", "text": "Rak brodawkowaty", "correct": true}, {"letter": "C", "text": "Rak pęcherzykowy", "correct": false}, {"letter": "D", "text": "Przerzuty raka z innych narządów", "correct": false}, {"letter": "E", "text": "Rak anaplastyczny", "correct": false}], "type": "single"}, {"text": "Wideotorakoskopia (VATS) to:", "hint": "VATS = Video-Assisted Thoracoscopic Surgery — małoinwazyjna chirurgia jamy opłucnej (biopsja, resekcja, dekortykacja). Dla jamy brzusznej — laparoskopia.", "options": [{"letter": "A", "text": "Rodzaj fibrobronchoskopii (bardziej zaawansowany)", "correct": false}, {"letter": "B", "text": "Małoinwazyjna forma chirurgii jamy otrzewnej", "correct": false}, {"letter": "C", "text": "Małoinwazyjna forma chirurgii jamy opłucnej", "correct": true}, {"letter": "D", "text": "Małoinwazyjna forma chirurgii krtani i gardła", "correct": false}, {"letter": "E", "text": "Małoinwazyjna forma chirurgii żołądka i dwunastnicy", "correct": false}], "type": "single"}, {"text": "Które z poniższych stwierdzeń NIE jest typową zaletą VATS w porównaniu do klasycznej torakotomii?", "hint": "Zalety VATS: mniejszy ból, ↓ infekcji rany, lepszy efekt kosmetyczny, szybsza rehabilitacja. ALE: ograniczona wizualizacja (zwłaszcza przy dużych guzach i złożonych strukturach śródpiersia) — to NIE jest zaleta.", "options": [{"letter": "A", "text": "Krótszy czas hospitalizacji i szybszy powrót do aktywności", "correct": false}, {"letter": "B", "text": "Lepsza wizualizacja i dostęp do wszystkich struktur śródpiersia, niezależnie od lokalizacji i rozmiaru", "correct": true}, {"letter": "C", "text": "Mniejsze ryzyko infekcji rany operacyjnej", "correct": false}, {"letter": "D", "text": "Mniejsze nasilenie bólu pooperacyjnego", "correct": false}, {"letter": "E", "text": "Mniejszy uraz i lepszy efekt kosmetyczny", "correct": false}], "type": "single"}, {"text": "Wśród metod leczenia choroby refluksowej przełyku stosuje się:", "hint": "GERD: IPP (podstawa leczenia), zabiegi endoskopowe (Stretta, ARMS), laparoskopowa fundoplikacja Nissena. Aminoglikozydy i α-blokery nie mają zastosowania w GERD.", "items": ["Aminoglikozydy", "IPP", "Endoskopowe zabiegi antyrefluksowe", "Laparoskopowe/robotyczne zabiegi (fundoplikacja)", "Alfa-blokery"], "options": [{"letter": "A", "text": "3, 4", "correct": false}, {"letter": "B", "text": "1, 2, 3, 4, 5", "correct": false}, {"letter": "C", "text": "1, 2, 3", "correct": false}, {"letter": "D", "text": "2, 4, 5", "correct": false}, {"letter": "E", "text": "2, 3, 4", "correct": true}], "type": "single"}, {"text": "Jak leczyć torbiel śledziony 7 cm bez towarzyszących objawów:", "hint": "Bezobjawowe torbiele śledziony <10 cm — obserwacja (USG). Wskazania do operacji: objawy, wielkość ≥10 cm, powikłania (pęknięcie, krwawienie, zakażenie). Preferowane zabiegi oszczędzające śledzionę (częściowa resekcja, fenestr yn górnych). Fizjologiczny u noworodka, zanika w 4.–6. m.ż. Utrzymywanie się >6 m.ż. = patologia OUN.", "options": [{"letter": "A", "text": "Polega na silnym skurczu palców dłoni noworodka na podanym przedmiocie", "correct": false}, {"letter": "B", "text": "Jest jednym z objawów tężyczki u noworodka", "correct": false}, {"letter": "C", "text": "Należy do odruchów świadczących o patologii OUN noworodka", "correct": false}, {"letter": "D", "text": "Utrzymuje się do 12. miesiąca życia", "correct": false}, {"letter": "E", "text": "Stanowi reakcję zaskoczenia na nagły bodziec u noworodka (zanika do 4-6 mies.)", "correct": true}], "type": "single"}, {"text": "Leczenie operacyjne wnętrostwa (niezstąpienia jądra) u chłopców zalecane jest w wieku:", "hint": "Orchidopeksja — optymalnie między 6. a 18. m.ż. (≤2 r.ż.). Późniejsza interwencja — zwiększone ryzyko azoospermii i raka jądra (~5×).", "options": [{"letter": "A", "text": "12-16 roku życia", "correct": false}, {"letter": "B", "text": "Noworodkowym", "correct": false}, {"letter": "C", "text": "Dorosłym", "correct": false}, {"letter": "D", "text": "4-7 roku życia", "correct": false}, {"letter": "E", "text": "1-2 roku życia", "correct": true}], "type": "single"}, {"text": "Która z poniższych wad płodu jest najczęściej związana z wielowodziem?", "hint": "Wielowodzie = płód nie połyka płynu owodniowego → atrezja przełyku/dwunastnicy, niedrożności GOPP, bezmózgowie. Małowodzie = ↓ produkcji moczu przez płód → agenezja nerek (zespół Pottera).", "options": [{"letter": "A", "text": "Atrezja przełyku", "correct": true}, {"letter": "B", "text": "Przepuklina pępkowa", "correct": false}, {"letter": "C", "text": "Hipoplazja lewej komory serca", "correct": false}, {"letter": "D", "text": "Zespół Turnera", "correct": false}, {"letter": "E", "text": "Zespół Downa", "correct": false}], "type": "single"}, {"text": "Przyczyna niedoboru wzrostu NIE JEST:", "hint": "Somatotropinoma = gruczolak przysadki wydzielający GH → gigantyzm u dzieci / akromegalia u dorosłych = WYSOKOROŚLOŚĆ, a nie niskorosłość. Pozostałe odpowiedzi to częste przyczyny niedoboru wzrostu.", "options": [{"letter": "A", "text": "Zespół Turnera", "correct": false}, {"letter": "B", "text": "Somatotropinoma", "correct": true}, {"letter": "C", "text": "Celiakia", "correct": false}, {"letter": "D", "text": "Zespół Pradera-Willego", "correct": false}, {"letter": "E", "text": "Niedoczynność tarczycy w chorobie Hashimoto", "correct": false}], "type": "single"}, {"text": "U 4-miesięcznego niemowlęcia karmionego mlekiem sztucznym z nasilonym AZS. W leczeniu zaleca się:", "hint": "W alergii na białka mleka krowiego/ciężkim AZS u dziecka karmionego sztucznie — hydrolizat o znacznym stopniu hydrolizy (eHF). Jeśli nieskuteczny → preparat aminokwasowy (AAF). Mleko kozie daje reakcję krzyżową z krowim (~90%).", "options": [{"letter": "A", "text": "Eliminację glutenu", "correct": false}, {"letter": "B", "text": "Hydrolizaty o nieznacznym stopniu hydrolizy białka", "correct": false}, {"letter": "C", "text": "Dietę eliminacyjną u matki", "correct": false}, {"letter": "D", "text": "Hydrolizaty o znacznym stopniu hydrolizy białka", "correct": true}, {"letter": "E", "text": "Mleko kozie", "correct": false}], "type": "single"}, {"text": "Leczenie przewlekłej astmy u dzieci poniżej 5 roku życia — lek 1 rzutu:", "hint": "GINA (≤5 r.ż.): leczenie kontrolujące I rzutu = małe dawki wGKS (np. budezonid 200 µg/d). Przy braku kontroli — zwiększenie dawki lub dodanie LTRA.", "options": [{"letter": "A", "text": "Lek przeciwhistaminowy doustnie", "correct": false}, {"letter": "B", "text": "Beta-mimetyk wziewnie", "correct": false}, {"letter": "C", "text": "GKS wziewnie w dużej dawce", "correct": false}, {"letter": "D", "text": "GKS wziewnie w małej dawce", "correct": true}, {"letter": "E", "text": "GKS doustnie", "correct": false}], "type": "single"}, {"text": "Podstawowe kryterium rozpoznania dysplazji oskrzelowo-płucnej:", "hint": "BPD = zapotrzebowanie na tlen (FiO₂ >21%) ≥28 dni. Stopień ciężkości ocenia się w 36. tygodniu wieku postmenstruacyjnego (lub w 56. dobie życia u urodzonych >32 tc.).", "options": [{"letter": "A", "text": "Duszność i tachypnoe >60/min", "correct": false}, {"letter": "B", "text": "Obecność trzeszczeń nad oboma polami płucnymi w ciągu 72 h od porodu", "correct": false}, {"letter": "C", "text": "Obecność rozsianych zmian drobnoplamistych na RTG klp", "correct": false}, {"letter": "D", "text": "Konieczność stosowania antybiotykoterapii przez co najmniej 10 dni po urodzeniu", "correct": false}, {"letter": "E", "text": "Konieczność leczenia tlenem FiO2 >21% ponad 12 h/d przez co najmniej 28 dni po urodzeniu", "correct": true}], "type": "single"}, {"text": "Najczęstsza przyczyna zapalenia oskrzelików:", "hint": "Zapalenie oskrzelików (typowo <2 r.ż., szczególnie <6 m.ż.) = RSV (~70%). Leczenie objawowe (tlen, nawodnienie). Profilaktyka u wcześniaków — palivizumab.", "options": [{"letter": "A", "text": "Streptococcus pneumoniae", "correct": false}, {"letter": "B", "text": "Mycoplasma pneumoniae", "correct": false}, {"letter": "C", "text": "Wirus RSV", "correct": true}, {"letter": "D", "text": "Wirus Coxsackie", "correct": false}, {"letter": "E", "text": "Astma", "correct": false}], "type": "single"}, {"text": "U 5-letniej dziewczynki: luźne stolce z domieszką krwi, wymioty, gorączka. Po tygodniu: osłabienie, bladość, zażółcenie twardówek, obrzęki, nadciśnienie. Hb 6,5 g%, płytki 60 000, wzrost kreatyniny i bilirubiny. Schizocyty w rozmazie. E. coli O157:H7 w posiewie stolca. Rozpoznanie:", "hint": "HUS — triada: mikroangiopatyczna niedokrwistość hemolityczna (schizocyty, ↑LDH, ↓haptoglobina) + małopłytkowość + AKI. Postać typowa po biegunce EHEC (E. coli O157:H7, toksyna Shiga). Leczenie objawowe (płynoterapia ostrożna, dializa, transfuzje). Antybiotyki — klasycznie przeciwwskazane (β-laktamy, FQ ↑ uwalnianie toksyny Shiga); nowsze metaanalizy sugerują bezpieczeństwo azytromycyny/fosfomycyny. Ekulizumab → postać atypowa (aHUS, komplementozależna).", "options": [{"letter": "A", "text": "Ostra białaczka limfoblastyczna", "correct": false}, {"letter": "B", "text": "Zespół nerczycowy", "correct": false}, {"letter": "C", "text": "Zespół Schoenleina-Henocha", "correct": false}, {"letter": "D", "text": "Zespół hemolityczno-mocznicowy", "correct": true}, {"letter": "E", "text": "Kłębkowe zapalenie nerek", "correct": false}], "type": "single"}, {"text": "Oddział pediatryczny, 12-miesięczne dziecko. Gorączka do 39,5°C, wymioty, suchość śluzówek, sztywność karku, objawy oponowe (+), CRP 220 mg%. Leczenie empiryczne:", "hint": "Empiryczne leczenie bakteryjnego ZOMR u dzieci >3 m.ż.: ceftriakson/cefotaksym + wankomycyna (do uzyskania antybiogramu — pokrycie pneumokoków opornych). U <1 m.ż. — dodać ampicylinę (Listeria).", "options": [{"letter": "A", "text": "Penicylina krystaliczna", "correct": false}, {"letter": "B", "text": "Rifampicyna + wankomycyna", "correct": false}, {"letter": "C", "text": "Ceftriakson (cefotaksym) + wankomycyna", "correct": true}, {"letter": "D", "text": "Meropenem + chloramfenikol", "correct": false}, {"letter": "E", "text": "Penicylina krystaliczna + cefuroksym", "correct": false}], "type": "single"}, {"text": "Zalecany antybiotyk dla dzieci z zapaleniem gardła i migdałków wywołanym przez Streptococcus pyogenes:", "hint": "GAS (S. pyogenes) nigdy nie wykazywał oporności na penicylinę. I rzut: fenoksymetylopenicylina (Penicillina V) p.o. przez 10 dni. Przy alergii na penicyliny — makrolid.", "options": [{"letter": "A", "text": "Fenoksymetylopenicylina doustnie", "correct": true}, {"letter": "B", "text": "Doksycyklina doustnie", "correct": false}, {"letter": "C", "text": "Klarytromycyna doustnie", "correct": false}, {"letter": "D", "text": "Cefalosporyna 3. generacji dożylnie", "correct": false}, {"letter": "E", "text": "Cefalosporyna 3. generacji doustnie", "correct": false}], "type": "single"}, {"text": "U 12-miesięcznej dziewczynki rozpoznano grypę A. W poradni: nagły wzrost gorączki do 39,5°C i drgawki gorączkowe. W pierwszej kolejności należy:", "hint": "Aktywne drgawki gorączkowe u dziecka bez dostępu dożylnego → diazepam doodbytniczo (0,5 mg/kg) lub midazolam podpoliczkowo/donosowo. Jeśli napad >5 min — kontynuować leczenie.", "options": [{"letter": "A", "text": "Podać dziecku paracetamol doodbytniczo", "correct": false}, {"letter": "B", "text": "Położyć okład z zimnej wody na główkę", "correct": false}, {"letter": "C", "text": "Podać dziecku diazepam dożylnie", "correct": false}, {"letter": "D", "text": "Podać dziecku diazepam doodbytniczo", "correct": true}, {"letter": "E", "text": "Podać lek przeciwwirusowy oseltamivir", "correct": false}], "type": "single"}, {"text": "Które z poniższych stwierdzeń dotyczących kostniakomięsaka (osteosarcoma) u dzieci jest prawdziwe?", "hint": "Osteosarcoma = najczęstszy pierwotny nowotwór złośliwy kości u dzieci i młodzieży. Szczyt zachorowań 10.–20. r.ż. (okres skoku wzrostowego), M > K, typowo — dalsza przynasada kości udowej/bliższa piszczeli (okolica kolana).", "options": [{"letter": "A", "text": "Ognisko pierwotne rozwija się zwykle w przynasadzie bliższej kości udowej", "correct": false}, {"letter": "B", "text": "Jest to najczęstszy nowotwór złośliwy kości u dzieci", "correct": true}, {"letter": "C", "text": "Szczyt zachorowań przypada na 6-8 rok życia", "correct": false}, {"letter": "D", "text": "Pacjenci są zwykle niskorośli", "correct": false}, {"letter": "E", "text": "Występuje dwukrotnie częściej u dziewcząt niż u chłopców", "correct": false}], "type": "single"}, {"text": "Najczęstszy nowotwór w populacji dziecięcej:", "hint": "Białaczki (~30% nowotworów u dzieci), głównie ALL (~80% wszystkich białaczek). Następnie guzy OUN (~25%) i chłoniaki.", "options": [{"letter": "A", "text": "Rak jajnika", "correct": false}, {"letter": "B", "text": "Mięsak tkanek miękkich", "correct": false}, {"letter": "C", "text": "Siatkówczak", "correct": false}, {"letter": "D", "text": "Białaczka", "correct": true}, {"letter": "E", "text": "Rak żołądka", "correct": false}], "type": "single"}, {"text": "Dawka paracetamolu u dzieci w wieku przedszkolnym:", "hint": "Paracetamol u dzieci: 10–15 mg/kg co 4–6 h p.o./p.r.; max PO 75–90 mg/kg/d (krótkoterminowo, dzieci >3 m.ż.) / 60 mg/kg/d (niemowlęta <3 m.ż.). Dawkowanie i.v.: 15 mg/kg co 6 h, max 60 mg/kg/d (max 4 g/d). Dawka toksyczna: ≥150 mg/kg jednorazowo lub ≥7,5 g u dorosłego.", "options": [{"letter": "A", "text": "1-2 mg/kg m.c.", "correct": false}, {"letter": "B", "text": "100 mg/kg m.c.", "correct": false}, {"letter": "C", "text": "10-15 mg/kg m.c.", "correct": true}, {"letter": "D", "text": "30 mg/kg m.c.", "correct": false}, {"letter": "E", "text": "45 mg/kg m.c.", "correct": false}], "type": "single"}, {"text": "W chorobie wrzodowej wywołanej H. pylori u dzieci — rekomendowane leczenie:", "hint": "ESPGHAN/NASPGHAN: terapia potrójna jednoczesna — IPP + amoksycylina + klarytromycyna (lub metronidazol) przez 14 dni. U dzieci >12 lat możliwa terapia poczwórna z bizmutem.", "options": [{"letter": "A", "text": "PPI przez 7-14 dni; przy braku poprawy — amoksycylina i metronidazol lub klarytromycyna", "correct": false}, {"letter": "B", "text": "PPI przez 3 miesiące", "correct": false}, {"letter": "C", "text": "Sekwencyjne: PPI, następnie amoksycylina, następnie metronidazol lub klarytromycyna (cykle po 7 dni)", "correct": false}, {"letter": "D", "text": "Amoksycylina i metronidazol lub klarytromycyna przez 7 dni, następnie PPI do ustąpienia objawów", "correct": false}, {"letter": "E", "text": "Jednoczesne stosowanie PPI, amoksycyliny i metronidazolu lub klarytromycyny przez 7-14 dni", "correct": true}], "type": "single"}, {"text": "Objawy niedoczynności tarczycy u noworodka:", "hint": "Wrodzona niedoczynność tarczycy: przedłużająca się żółtaczka, makroglosja, przepuklina pępkowa, ochrypły płacz, hipotonia, ZAPARCIA (NIE biegunka!), hipotermia, słabe ssanie.", "items": ["Chrypka", "Przepuklina pępkowa", "Biegunka", "Długa żółtaczka", "Duży język", "Obniżone napięcie mięśniowe"], "options": [{"letter": "A", "text": "1, 2, 3, 6", "correct": false}, {"letter": "B", "text": "1, 2, 3, 4, 5, 6", "correct": false}, {"letter": "C", "text": "1, 2, 4, 5, 6", "correct": true}, {"letter": "D", "text": "1, 4, 5, 6", "correct": false}], "type": "single"}, {"text": "U 7-miesięcznego dziecka zapalenie płuc poprzedzone kilkoma dniami kaszlu i nieżytu nosa. Gorączka do 38,5°C, zmiany zapalne nad płucami, brak duszności. Saturacja 98%. Antybiotyk pierwszego wyboru:", "hint": "CAP u dziecka >3 m.ż. bez ciężkich objawów → amoksycylina 80–90 mg/kg/d p.o. (S. pneumoniae — główny patogen). Makrolidy dodaje się przy podejrzeniu zakażenia atypowego.", "options": [{"letter": "A", "text": "Amoksycylina", "correct": true}, {"letter": "B", "text": "Trimetoprym z sulfametoksazolem", "correct": false}, {"letter": "C", "text": "Amoksycylina z kwasem klawulanowym", "correct": false}, {"letter": "D", "text": "Klarytromycyna", "correct": false}, {"letter": "E", "text": "Cefuroksym", "correct": false}], "type": "single"}, {"text": "NT u dzieci rozpoznaje się:", "hint": "AHA/AAP: NT u dzieci = SBP/DBP ≥95. percentyla dla wieku, płci i wzrostu — w 3 niezależnych pomiarach. Tabele percentyli ciśnienia (4th Task Force).", "options": [{"letter": "A", "text": "W 3 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku i płci", "correct": false}, {"letter": "B", "text": "W 3 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku, płci i wzrostu", "correct": true}, {"letter": "C", "text": "W 5 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku, płci i wzrostu", "correct": false}, {"letter": "D", "text": "W 3 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku i wzrostu", "correct": false}, {"letter": "E", "text": "W 5 niezależnych pomiarach ciśn. skurcz. i/lub rozkurcz. >95 c. dla wieku", "correct": false}], "type": "single"}, {"text": "Kryteria klasyfikacyjne choroby Kawasaki:", "hint": "Choroba Kawasaki: gorączka ≥5 dni + ≥4 z 5: (1) zmiany warg/jamy ustnej (malinowy język), (2) nieropne zapalenie spojówek, (3) wysypka, (4) zmiany kończyn, (5) limfadenopatia szyjna >1,5 cm. Hepatosplenomegalia nie jest kryterium.", "items": ["Malinowy język", "Powiększone szyjne węzły chłonne >1,5 cm", "Zapalenie spojówek nieropne", "Przekrwienie śluzowej jamy ustnej oraz gardła", "Wysypka polimorficzna niepęcherzykowa na ciele", "Zmiany na dłoniach i stopach (rumień i obrzęk), który potem się łuszczy", "Powiększenie wątroby i śledziony"], "options": [{"letter": "A", "text": "1, 2, 3, 4", "correct": false}, {"letter": "B", "text": "1, 3, 4, 5, 6, 7", "correct": false}, {"letter": "C", "text": "1, 2, 3, 4, 5, 6", "correct": true}, {"letter": "D", "text": "1, 2, 5, 6", "correct": false}], "type": "single"}, {"text": "Leczenie choroby Kawasaki:", "hint": "Standard leczenia choroby Kawasaki (AHA 2017): IVIG 2 g/kg w pojedynczym wlewie + ASA 30–50 mg/kg/d w fazie ostrej → 3–5 mg/kg/d (mała dawka) po ≥48 h bez gorączki. GKS (prednizolon) — rozważane w terapii POCZĄTKOWEJ u pacjentów wysokiego ryzyka (skale Kobayashi/Egami/Sano) lub przy oporności na IVIG. Infliksymab/cyklosporyna → przy oporności na IVIG+GKS.", "items": ["Ig dożylnie", "Kwas acetylosalicylowy", "GKS", "Heparyna drobnocząsteczkowa"], "options": [{"letter": "A", "text": "1, 2", "correct": true}, {"letter": "B", "text": "1, 2, 3", "correct": false}, {"letter": "C", "text": "1, 2, 3, 4", "correct": false}, {"letter": "D", "text": "Tylko 1", "correct": false}], "type": "single"}, {"text": "Objawy celiakii u dzieci:", "hint": "Celiakia = objawy klasyczne (biegunka, FTT, wzdęcia) + objawy pozajelitowe (niedokrwistość z niedoboru Fe, hipoplazja szkliwa, nawracające afty, opryszczkowate zapalenie skóry Duhringa, niskorosłość, zaburzenia neuropsychiatryczne). Wszystkie 6 to typowe manifestacje.", "items": ["Hipoplazja szkliwa", "Anemia", "Nawracające afty", "Zaburzenia zachowania, depresja", "Wzdęcia brzucha", "Opóźnienie lub zahamowanie wzrastania"], "options": [{"letter": "A", "text": "1, 2, 3, 4, 5, 6", "correct": true}], "type": "single"}, {"text": "Dziecko 4 mies., 6 kg, wstrząs hipowolemiczny z powodu biegunki. Wstępna dawka przetaczanych płynów:", "hint": "Bolus we wstrząsie u dzieci: 20 ml/kg 0,9% NaCl/mleczanu Ringera szybko (5–10 min), w razie potrzeby powtórzyć do 60 ml/kg. 6 kg × 20 ml/kg = 120 ml.", "options": [{"letter": "A", "text": "500 ml", "correct": false}, {"letter": "B", "text": "60 ml", "correct": false}, {"letter": "C", "text": "120 ml", "correct": true}, {"letter": "D", "text": "40 ml", "correct": false}, {"letter": "E", "text": "240 ml", "correct": false}], "type": "single"}, {"text": "Zaznacz prawidłowe odpowiedzi dotyczące wgłobienia jelita:", "hint": "Wgłobienie — szczyt zachorowań między 6. m.ż. a 2. r.ż. Objawy: kolkowy ból brzucha, wymioty, malinowy galaretowaty stolec. Leczenie: odgłobienie hydrostatyczne/pneumatyczne pod kontrolą USG/RTG; leczenie operacyjne — przy perforacji/niepowodzeniu zachowawczego.", "options": [{"letter": "A", "text": "W diagnostyce konieczna jest scyntygrafia jelit", "correct": false}, {"letter": "B", "text": "Leczenie operacyjne polega na usunięciu jelita grubego i wyłonieniu przetoki jelitowej", "correct": false}, {"letter": "C", "text": "75% przypadków występuje u dzieci po 14. roku życia", "correct": false}, {"letter": "D", "text": "Leczenie zachowawcze polega na odgłobieniu jelita pod kontrolą USG za pomocą wlewu doodbytniczego 0,9% NaCl lub zawiesiny barytowej", "correct": true}, {"letter": "E", "text": "Typowym objawem są zaparcia", "correct": false}], "type": "single"}, {"text": "Na SOR trafił 13-letni pacjent z ostrym bólem jądra od 4 godzin, po wysiłku fizycznym. Silna tkliwość, obrzęk i zaczerwienienie moszny, wysokie i poprzeczne ustawienie jądra. Rozpoznanie:", "hint": "Skręt jądra — nagły ból + obrzęk + wysokie poprzeczne ustawienie jądra + ujemny objaw Prehna + zniesienie odruchu nosidłowego. Wymaga pilnej operacji w ciągu 6 h (później — martwica).", "options": [{"letter": "A", "text": "Wnętrostwo", "correct": false}, {"letter": "B", "text": "Zapalenie najądrza", "correct": false}, {"letter": "C", "text": "Żylaki powrózka nasiennego", "correct": false}, {"letter": "D", "text": "Skręt jądra", "correct": true}, {"letter": "E", "text": "Wodniak jądra", "correct": false}], "type": "single"}, {"text": "Do lekarza zgłasza się matka z 4-letnim synem — otyłość, olbrzymi apetyt od 2-3 r.ż. Jako niemowlę: obniżone napięcie mięśniowe, słabe ssanie. Opóźnienie intelektualne. W badaniu: niski wzrost, obustronne wnętrostwo, małe prącie, małe dłonie i stopy, jasna karnacja. Rozpoznanie:", "hint": "Zespół Pradera-Willego (delecja 15q11–q13 pochodzenia ojcowskiego): noworodkowa hipotonia + słabe ssanie → hiperfagia od 2.–3. r.ż. → otyłość, niski wzrost, hipogonadyzm, małe kończyny, jasna karnacja, niepełnosprawność intelektualna.", "options": [{"letter": "A", "text": "Zespół Marfana", "correct": false}, {"letter": "B", "text": "Zespół Pradera-Willego", "correct": true}, {"letter": "C", "text": "Zespół Klinefeltera", "correct": false}, {"letter": "D", "text": "Zespół Silver-Russela", "correct": false}, {"letter": "E", "text": "Zespół Downa", "correct": false}], "type": "single"}, {"text": "U 2-letniego chłopca — brak apetytu, nudności, bóle brzucha. USG: guz przemieszczający lewą nerkę przednio-bocznie i ku dołowi. TK: guz z ogniskami martwicy, wylewami krwawymi i zwapnieniami. Rozpoznanie:", "hint": "Neuroblastoma (nadnercze lub łańcuch współczulny) — guz zaotrzewnowy PRZEMIESZCZAJĄCY nerkę (nie wewnątrznerkowy), ze zwapnieniami, wylewami krwawymi i ogniskami martwicy. Guz Wilmsa — odwrotnie — wywodzi się Z nerki, bez zwapnień. Markery: VMA/HVA w moczu.", "options": [{"letter": "A", "text": "Hepatoblastoma", "correct": false}, {"letter": "B", "text": "Neuroblastoma", "correct": true}, {"letter": "C", "text": "Chłoniak Hodgkina", "correct": false}, {"letter": "D", "text": "Guz Wilmsa", "correct": false}, {"letter": "E", "text": "Retinoblastoma", "correct": false}], "type": "single"}, {"text": "Niemowlę 5 mies., gorączkuje do 38,5°C od 3 dni. Brak kataru, kaszlu, biegunki, wymiotów, wysypki. RTG klp — norma. Najbardziej prawdopodobna przyczyna gorączki:", "hint": "Gorączka bez uchwytnej przyczyny (FWS) u niemowlęcia — najczęstsza przyczyna = ZUM (~7% dziewczynek, ~2% chłopców). Obowiązkowy posiew moczu (cewnik/nakłucie nadłonowe). Roseola (gorączka trzydniowa) — wysypka pojawia się zwykle po ustąpieniu gorączki.", "options": [{"letter": "A", "text": "Choroba zakaźna — gorączka trzydniowa", "correct": false}, {"letter": "B", "text": "Białaczka", "correct": false}, {"letter": "C", "text": "Zapalenie płuc", "correct": false}, {"letter": "D", "text": "Mononukleoza", "correct": false}, {"letter": "E", "text": "Zakażenie układu moczowego", "correct": true}], "type": "single"}, {"text": "Podstawowym zagrożeniem dla dzieci z nadciśnieniem wrotnym jest:", "hint": "Głównym powikłaniem zagrażającym życiu w nadciśnieniu wrotnym są żylaki przełyku z masywnym krwawieniem. Badanie przesiewowe — endoskopia, profilaktyka — β-blokery, opaskowanie żylaków (banding).", "options": [{"letter": "A", "text": "Krwotok z żylaków przełyku", "correct": true}, {"letter": "B", "text": "Marskość wątroby", "correct": false}, {"letter": "C", "text": "Zespół Budda-Chiariego", "correct": false}, {"letter": "D", "text": "Niedobór masy ciała", "correct": false}, {"letter": "E", "text": "Zakrzepica żyły wrotnej", "correct": false}], "type": "single"}, {"text": "Pierwszym charakterystycznym objawem krzywicy u 4-miesięcznego niemowlęcia jest:", "hint": "Pierwszy objaw krzywicy u niemowlęcia = craniotabes (rozmiękanie potylicy) — uczucie \"piłki pingpongowej\". Później: różaniec krzywiczy, bransoletki krzywicze, zniekształcenia kończyn, opóźnione wyrzynanie zębów.", "options": [{"letter": "A", "text": "Niedobór masy ciała", "corre , "text": "W terapii celowanej stosuje się inhibitor VEGF — bewacizumab (działanie antyangiogenne)", "correct": false}], "type": "single"}, {"text": "Najczęstszy objaw raka endometrium:", "hint": "~90% przypadków raka endometrium objawia się krwawieniem pomenopauzalnym. Umożliwia to wczesne rozpoznanie → dobre rokowanie. Każde krwawienie po menopauzie wymaga biopsji endometrium!", "options": [{"letter": "A", "text": "Upławy ropne", "correct": false}, {"letter": "B", "text": "Bolesna miesiączka", "correct": false}, {"letter": "C", "text": "Krwawienia pomenopauzalne", "correct": true}, {"letter": "D", "text": "Ból podbrzusza", "correct": false}, {"letter": "E", "text": "Powiększenie macicy", "correct": false}], "type": "single"}, {"text": "Czynniki ryzyka zachorowania na raka endometrium:", "hint": "Rak endometrium jest nowotworem ESTROGENOZALEŻNYM. Czynniki ryzyka: estrogen bez przeciwwagi progestagenu (wczesna menarche, późna menopauza, otyłość, PCOS, HTZ samymi estrogenami, brak porodów, cukrzyca). Wielorództwo i palenie tytoniu — czynniki PROTEKCYJNE!", "items": ["Wczesna menarche i późna menopauza", "Otyłość", "PCOS", "Niski status socjoekonomiczny", "Wielorództwo", "Cukrzyca", "Palenie papierosów"], "options": [{"letter": "A", "text": "4, 5, 6, 7", "correct": false}, {"letter": "B", "text": "2, 3, 4, 5", "correct": false}, {"letter": "C", "text": "2, 3, 6, 7", "correct": false}, {"letter": "D", "text": "1, 2, 3, 6", "correct": true}, {"letter": "E", "text": "1, 3, 5, 6", "correct": false}], "type": "single"}, {"text": "Wskaż czynniki ryzyka zachorowania na raka szyjki macicy:", "hint": "Rak szyjki macicy = HPV (zwłaszcza 16, 18) — główny czynnik. Kofaktory: duża liczba partnerów seksualnych, wczesne rozpoczęcie współżycia, wielorództwo, palenie, HIV, antykoncepcja hormonalna, niski status socjoekonomiczny. Otyłość NIE jest czynnikiem ryzyka raka szyjki macicy.", "items": ["Wielorództwo", "Zakażenie wirusem HPV typ 16", "Duża liczba partnerów seksualnych", "Otyłość", "Palenie papierosów", "Niski status socjoekonomiczny"], "options": [{"letter": "A", "text": "1, 2, 3, 4", "correct": false}, {"letter": "B", "text": "1, 2, 3, 5, 6", "correct": true}, {"letter": "C", "text": "1, 2, 3, 4, 5", "correct": false}, {"letter": "D", "text": "2, 3, 4, 5, 6", "correct": false}], "type": "single"}, {"text": "Na Izbę Przyjęć zgłosiła się 30-letnia pacjentka z bólem podbrzusza i 4-tygodniowym brakiem miesiączki (endometrioza, operacja torbieli jajników w wywiadzie). BP 110/68, Ps 98/min. Nieznaczny płyn w zatoce Douglasa, brak ciąży wewnątrzmacicznej w USG. Beta-hCG 1250 mIU/ml. CRP 25 mg/L. Rozpoznanie:", "hint": "Strefa dyskryminacyjna hCG: klasycznie ≥1500–2000 mIU/ml dla TVUS (widoczna IUP); nowsze ACOG 2018 — próg ≥3500 mIU/ml (bezpieczniejszy, mniej fałszywie dodatnich). Tutaj hCG 1250 < strefy dyskryminacyjnej → nie można wykluczyć ani potwierdzić IUP wyłącznie na tej podstawie. W połączeniu z płynem w zatoce Douglasa + czynnikami ryzyka (endometrioza, op. przydatków) → wysokie prawdopodobieństwo ciąży ektopowej. Postępowanie: monitorowanie hCG q48h lub interwencja przy niestabilności.", "options": [{"letter": "A", "text": "Ciąża pozamaciczna jajowodowa prawostronna", "correct": true}, {"letter": "B", "text": "Zapalenie narządów miednicy mniejszej", "correct": false}, {"letter": "C", "text": "Ostre zapalenie uchyłków jelita", "correct": false}, {"letter": "D", "text": "Ostre zapalenie wyrostka robaczkowego", "correct": false}, {"letter": "E", "text": "Torbiel endometrialna jajnika prawego", "correct": false}], "type": "single"}, {"text": "W jakim tygodniu ciąży zaczyna się u płodu produkcja surfaktantu?", "hint": "Pneumocyty typu II rozpoczynają syntezę surfaktantu w 22.–24. tc. Istotne ilości od 32.–34. tc. → płuca dojrzałe. Dlatego do 34. tc. podaje się kortykosteroidy w celu przyspieszenia dojrzewania płuc.", "options": [{"letter": "A", "text": "27.", "correct": false}, {"letter": "B", "text": "34.", "correct": false}, {"letter": "C", "text": "18.", "correct": false}, {"letter": "D", "text": "30.", "correct": false}, {"letter": "E", "text": "22.", "correct": true}], "type": "single"}, {"text": "Jaki jest prawidłowy, fizjologiczny kolor płynu owodniowego w III trymestrze ciąży?", "hint": "Norma — jasny mleczny/perłowy (zawiesina mazi płodowej). Zielony = smółka → zagrożenie płodu. Żółto-pomarańczowy = stara smółka / hiperbilirubinemia. Krwisty = oddzielenie łożyska/krwawienie.", "options": [{"letter": "A", "text": "Jasny, mleczny", "correct": true}, {"letter": "B", "text": "Krwisty", "correct": false}, {"letter": "C", "text": "Żółto-pomarańczowy", "correct": false}, {"letter": "D", "text": "Zielony", "correct": false}, {"letter": "E", "text": "Brunatny", "correct": false}], "type": "single"}, {"text": "Jakie badanie należy do testów przesiewowych I trymestru ciąży?", "hint": "Badania przesiewowe I trymestru (11–13+6 tc.): NT (przezierność karkowa) + PAPP-A + wolne β-hCG ± kość nosowa → obliczenie ryzyka T21/18/13. Kordocenteza, amniopunkcja, biopsja kosmówki — inwazyjne badania diagnostyczne.", "options": [{"letter": "A", "text": "Kordocenteza", "correct": false}, {"letter": "B", "text": "Badanie kariotypu", "correct": false}, {"letter": "C", "text": "Amniopunkcja", "correct": false}, {"letter": "D", "text": "Test PAPP-A z oceną przezierności karkowej (11-13+6 tc.)", "correct": true}, {"letter": "E", "text": "Biopsja trofoblastu", "correct": false}], "type": "single"}, {"text": "Czego nie dokonuje główka w trakcie przechodzenia przez kanał rodny:", "hint": "Mechanizmy porodu: wstawianie, zstępowanie, przygięcie, rotacja wewnętrzna, odgięcie, rotacja zewnętrzna. \"Rotacja poprzeczna\" nie występuje — główka rotuje z położenia poprzecznego do przednio-tylnego.", "options": [{"letter": "A", "text": "Rotacja wewnętrzna", "correct": false}, {"letter": "B", "text": "Rotacja zewnętrzna", "correct": false}, {"letter": "C", "text": "Rotacja poprzeczna", "correct": true}, {"letter": "D", "text": "Przy tter": "D", "text": "Bezbolesne krwawienie w II połowie ciąży", "correct": true}, {"letter": "E", "text": "Obrzęki kończyn dolnych", "correct": false}], "type": "single"}, {"text": "Którego leku nie zastosujesz w leczeniu zapalenia pęcherza moczowego u kobiety ciężarnej?", "hint": "Fluorochinolony (ciprofloksacyna, lewofloksacyna, moksifloksacyna) są PRZECIWWSKAZANE w ciąży (kategoria C/D — artropatia płodu). Bezpieczne: fosfomycyna (1×3 g), amoksycylina/klawulanian, cefuroksym, piwmecylinam, nitrofurantoina (ale nie w I trymestrze ani pod koniec ciąży).", "options": [{"letter": "A", "text": "Fosfomycyna", "correct": false}, {"letter": "B", "text": "Amoksycylina", "correct": false}, {"letter": "C", "text": "Piwmecylinam", "correct": false}, {"letter": "D", "text": "Ciprofloksacyna", "correct": true}, {"letter": "E", "text": "Cefuroksym", "correct": false}], "type": "single"}, {"text": "Kobieta 36 lat, 4 h po porodzie drogami natury, nasilone krwawienie z dróg rodnych. BP 100/60, słabo napięte tętno 116/min, oddechy 12/min, opóźniony powrót włośniczkowy, przytomna. Jaką utratę krwi można podejrzewać:", "hint": "Klasyfikacja wstrząsu wg ATLS: klasa I <750 ml (bez zmian), klasa II 750–1500 ml (HR 100–120, niewielki ↓BP, opóźniony powrót włośniczkowy), klasa III 1500–2000 ml (HR >120, ↓BP, splątanie), klasa IV >2000 ml.", "options": [{"letter": "A", "text": ">3000 ml", "correct": false}, {"letter": "B", "text": "1000-1500 ml", "correct": true}, {"letter": "C", "text": "<100 ml", "correct": false}, {"letter": "D", "text": "200-500 ml", "correct": false}, {"letter": "E", "text": "100-200 ml", "correct": false}], "type": "single"}, {"text": "Ciężarna 33 tyg., pierwsza ciąża, zawroty głowy, podwyższone BP w pomiarach domowych. Na SOR: HR 100/min, BP 142/100. KTG i USG — norma. Preparat wyboru na NT:", "hint": "Leki hipotensyjne w ciąży: labetalol (I rzut), metyldopa, nifedypina. PRZECIWWSKAZANE: ACEI, sartany (teratogenne, zwłaszcza w II–III trymestrze — agenezja nerek płod ży objętość wyrzutowa serca:", "hint": "Hemodynamika ciąży: CO ↑ 30–50% (kosztem ↑ SV + ↑ HR o ~15%), objętość krwi krążącej ↑ 40–50%, SVR ↓. Szczyt zmian w 24.–32. tc.", "options": [{"letter": "A", "text": "Wzrasta jedynie w I trymestrze ciąży", "correct": false}, {"letter": "B", "text": "Zmniejsza się o ok. 10%", "correct": false}, {"letter": "C", "text": "Spada w II trymestrze ciąży", "correct": false}, {"letter": "D", "text": "Wzrasta o 30-50%", "correct": true}, {"letter": "E", "text": "Pozostaje bez zmian", "correct": false}], "type": "single"}, {"text": "Które kryterium jest charakterystyczne dla stanu przedrzucawkowego (preeklampsji)?", "hint": "Stan przedrzucawkowy = nowo rozpoznane NT ≥140/90 + białkomocz ≥300 mg/24 h (lub stosunek białko/kreatynina ≥0,3) po 20. tc. Bez białkomoczu — jeśli występują uszkodzenia narządowe (HELLP, ostre uszkodzenie nerek, obrzęk płuc, objawy neurologiczne).", "options": [{"letter": "A", "text": "Nadciśnienie przed 20. tygodniem ciąży", "correct": false}, {"letter": "B", "text": "Niewielki wzrost ciśnienia skurczowego w 18 tygodniu (do 130 mmHg)", "correct": false}, {"letter": "C", "text": "Białkomocz ≥300 mg/dobę po 20. tygodniu ciąży", "correct": true}, {"letter": "D", "text": "Hipoglikemia", "correct": false}, {"letter": "E", "text": "Małopłytkowość przed ciążą", "correct": false}], "type": "single"}, {"text": "18-letnia otyła ciężarna w 7 tyg. z nasilonymi nudnościami i wymiotami od 3 dni. BP 100/50, HR 100/min. Morfologia, jonogram, enzymy wątrobowe, amylaza, lipaza, TSH — bez odchyleń. Mocz: ketony (+), większy ciężar właściwy. Co jest NIEWŁAŚCIWE?", "hint": "Niepowściągliwe wymioty ciężarnych: nawodnienie (NaCl), leki przeciwwymiotne (doksylamina + pirydoksyna = Diclectin → I rzut, metoklopramid, ondansetron w ciężkich przypadkach). Loperamid to lek przeciwbiegunkowy — nie ma zastosowania (brak biegunki).", "options": [{"letter": "A", "text": "Podanie loperamidu", "correct": true}, {"letter": "B", "text": "Podanie doży : "E", "text": "Leki antykoncepcyjne (dwuskładnikowe)", "correct": false}], "type": "single"}, {"text": "Zmiana adaptacyjna w ciąży:", "hint": "Ciąża: ↑ objętość krwi krążącej (~50%), ↑ SV, ↑ CO (30–50%), ↑ HR (15%), ↑ GFR (50%), ↓ Hb (fizjologiczna niedokrwistość z hemodylucji), ↓ SVR.", "options": [{"letter": "A", "text": "Spadek objętości osocza", "correct": false}, {"letter": "B", "text": "Wzrost objętości wyrzutowej serca", "correct": true}, {"letter": "C", "text": "Spadek przesączania kłębuszkowego", "correct": false}, {"letter": "D", "text": "Wzrost Hb", "correct": false}, {"letter": "E", "text": "Zmniejszenie tętna", "correct": false}], "type": "single"}, {"text": "Zgodnie z indeksem Pearla, która z niżej wymienionych metod posiada największą skuteczność antykoncepcyjną?", "hint": "Wskaźnik Pearla: LNG-IUD ~0,1–0,2 (najniższy!) > implanty 0,05 > wkładka miedziana 0,6 > COC 0,3 (perfect use) / 9 (typical use) > POP 0,5 / 13. LARC (wkładki/implanty) — metody najskuteczniejsze.", "options": [{"letter": "A", "text": "Tabletka antykoncepcyjna estrogenowo-gestagenowa", "correct": false}, {"letter": "B", "text": "Wkładka wewnątrzmaciczna miedziana", "correct": false}, {"letter": "C", "text": "Wkładka wewnątrzmaciczna z lewonorgestrelem", "correct": true}, {"letter": "D", "text": "Tabletka antykoncepcyjna jednoskładnikowa gestagenowa", "correct": false}, {"letter": "E", "text": "Ring dopochwowy", "correct": false}], "type": "single"}, {"text": "Jaka klasyfikacja radiologiczna ocenia prawdopodobieństwo raka sutka na podstawie cech obrazowania w mammografii, USG i MRI:", "hint": "BI-RADS (Breast Imaging-Reporting and Data System) — 0 (badanie niepełne), 1 (norma), 2 (zmiana łagodna), 3 (prawdopodobnie łagodna, <2%), 4 (podejrzana, biopsja), 5 (prawdopodobnie złośliwa, >95%), 6 (potwierdzony rak).", "options": [{"letter": "A", "text": "AVPU", "correct": false}, {"letter": "B", "text": "TNM", "correct": false}, {"letter": "C", "text": "BI-RADS", "correct": true}, {"letter": "D", "text": "Crile", "correct": false}, {"letter": "E", "text": "NIHSS", "correct": false}], "type": "single"}, {"text": "U kobiety 65 lat mammografia — spikularny guz prawej piersi śr. 1 cm, niewyczupalny przy palpacji, wciągnięcie brodawki sutkowej. Postępowanie:", "hint": "Spikularny (gwiaździsty) guz + wciągnięcie brodawki + wiek = wysokie ryzyko raka → BI-RADS 5. ZAWSZE w pierwszej kolejności: biopsja gruboigłowa + ocena histopatologiczna + receptory (ER, PR, HER2, Ki-67) → planowanie leczenia.", "options": [{"letter": "A", "text": "Kontrola za 6 mies", "correct": false}, {"letter": "B", "text": "Mastektomia radykalna", "correct": false}, {"letter": "C", "text": "Leczenie oszczędzające z biopsją węzła wartowniczego", "correct": false}, {"letter": "D", "text": "Biopsja guza, badanie hist-pat i badanie receptorów hormonalnych", "correct": true}, {"letter": "E", "text": "Radioterapia prawej piersi", "correct": false}], "type": "single"}], "Powtarzające się": [{"text": "Resuscytacja niemowlęcia — stosunek liczby uciśnięć klatki piersiowej do liczby oddechów:", "hint": "Według ERC: u dzieci i niemowląt przy dwóch ratownikach medycznych stosunek uciśnięć do oddechów wynosi 15:2; przy jednym ratowniku lub ratowniku laiku – 30:2 (jak u dorosłych). Wyłącznie u noworodków (NRP, przed wypisem z sali porodowej) – 3:1. Na LEK poprawna odpowiedź to prawie zawsze 15:2, gdy pytanie dotyczy niemowlęcia i personelu medycznego. [Sesje: JZ25, L25, W26]", "options": [{"letter": "A", "text": "30:2", "correct": false}, {"letter": "B", "text": "1:1", "correct": false}, {"letter": "C", "text": "15:2", "correct": true}, {"letter": "D", "text": "3:1", "correct": false}, {"letter": "E", "text": "10:2", "correct": false}], "type": "single"}, {"text": "Czego nie stosujemy w leczeniu endometriozy:", "hint": "Endometrioza jest chorobą estrogenozależną – estrogeny w monoterapii są PRZECIWWSKAZANE (stymulują wzrost ognisk). Stosuje się: progestageny, dwuskładnikową antykoncepcję (E+P), ag cysteina (NAC), uzupełnia glutation → neutralizuje toksyczny metabolit NAPQI. Maksymalna skuteczność przy podaniu w ciągu 8–10 h od zażycia. 20 × 500 mg = 10 g – dawka potencjalnie śmiertelna (>150 mg/kg dla 50 kg). Nalokson – opioidy, flumazenil – BZD, atropina/pralidoksym – fosforoorganiczne. [Sesje: JZ25, W25]", "options": [{"letter": "A", "text": "nalokson", "correct": false}, {"letter": "B", "text": "atropina", "correct": false}, {"letter": "C", "text": "pralidoksym", "correct": false}, {"letter": "D", "text": "N-acetylocysteina", "correct": true}, {"letter": "E", "text": "fizostygmina", "correct": false}], "type": "single"}, {"text": "Pierwszym charakterystycznym objawem krzywicy u 4-miesięcznego niemowlęcia jest:", "hint": "Najwcześniejszy objaw krzywicy u niemowlęcia (3–6 mies.) – craniotabes (rozmiękanie potylicy: miękkie obszary kości potylicznej wyczuwalne palpacyjnie). Później pojawiają się: różaniec krzywiczy, bruzda Harrisona, wiotkość mięśni brzucha (\"żabi brzuch\"), opóźnione zarastanie ciemiączka. Koślawość/szpotawość kolan – objaw późny (po 1. roku, gdy dziecko chodzi) – dlatego \"nie pasuje\" do 6-miesięcznego. [Sesje: JZ25, L25, W25]", "options": [{"letter": "A", "text": "niedobór masy ciała", "correct": false}, {"letter": "B", "text": "szpotawość kończyn dolnych", "correct": false}, {"letter": "C", "text": "bóle kostne", "correct": false}, {"letter": "D", "text": "rozmiękanie potylicy", "correct": true}, {"letter": "E", "text": "opóźnione wyrzynanie zębów mlecznych", "correct": false}], "type": "single"}, {"text": "Pierwotna niedoczynność tarczycy:", "hint": "Logika sprzężenia zwrotnego: przy pierwotnej patologii tarczycy TSH zmienia się przeciwnie do poziomu hormonów. Pierwotna niedoczynność = ↑TSH + ↓T3/T4 (tarczyca \"nie pracuje\", podwzgórze \"krzyczy\"). Pierwotna nadczynność = ↓TSH + ↑T3/T4 (tarczyca nadaktywna, oś supresja). Wtórna (przysadkowa): TSH zmienia się w tym samym kierunku co T3/T4. [Sesje: JZ25, L25, W26]", "options": [{"letter": "A", "text": "↑TSH, ↑T3, ↑T4", "correct": false}, {"letter": "B", "text": "↓TSH, ↑T3, ↑T4", "correct": false}, {"letter": "C", "text": "↓TSH, ↓T3, ↑T4", "correct": false}, {"letter": "D", "text": "↓TSH, ↓T3, ↓T4", "correct": false}, {"letter": "E", "text": "↑TSH, ↓T3, ↓T4", "correct": true}], "type": "single"}, {"text": "Mechanizm porodowy to zwroty wykonywane przez płód podczas przechodzenia przez kanał rodny:", "hint": "Kolejność mechanizmu porodu: przygięcie (fleksja) → rotacja wewnętrzna → odgięcie (defleksja) → rotacja zewnętrzna (restitucja). \"Rotacja poprzeczna\" nie istnieje w tym schemacie – to pułapka. Mnemonika: P-R-O-R (Przygięcie – Rotacja wewn. – Odgięcie – Rotacja zewn.). [Sesje: JZ25, W25]", "options": [{"letter": "A", "text": "przygięcie wewnętrzne, rotacja, odgięcie zewnętrzne, rotacja", "correct": false}, {"letter": "B", "text": "przygięcie, odgięcie, rotacja wewnętrzna, rotacja zewnętrzna", "correct": false}, {"letter": "C", "text": "przygięcie, rotacja wewnętrzna, odgięcie, rotacja zewnętrzna", "correct": true}, {"letter": "D", "text": "rotacja wewnętrzna, przygięcie, rotacja zewnętrzna, odgięcie", "correct": false}, {"letter": "E", "text": "odgięcie, przygięcie, rotacja wewnętrzna, rotacja zewnętrzna", "correct": false}], "type": "single"}, {"text": "Przyczyna niedoboru wzrostu NIE JEST:", "hint": "Niski wzrost powodują: Turner, Down, Prader-Willi, Noonan, achondroplazja, celiakia, niedoczynność tarczycy, niedobór GH, zespół Cushinga. Wysoki wzrost: Marfan, Klinefelter, somatotropinoma (akromegalia/gigantyzm), homocystynuria. Pułapka: somatotropinoma = nadmiar GH → wysoki wzrost, NIE niskorosłość. [Sesje: JZ25, W26]", "options": [{"letter": "A", "text": "zespół Turnera", "correct": false}, {"letter": "B", "text": "somatotropinoma", "correct": true}, {"letter": "C", "text": "celiakia", "correct": false}, {"letter": "D", "text": "zespół Pradera-Willego", "correct": false}, {"letter": "E", "text": "niedoczynność tarczycy w chorobie Hashimoto", "correct": false}], "type": "single"}, {"text": "Najczęstszym nowotworem złośliwym tarczycy jest rak:", "hint": "Rak brodawkowaty (PTC) – najczęstszy rak tarczycy (~80%), dobre rokowanie, przerzutuje do węzłów chłonnych. Pęcherzykowy (~10%) – przerzutuje drogą krwionośną (kości, płuca). Rdzeniasty (~5%) – z komórek C, ↑kalcytonina, związany z MEN2. Anaplastyczny (~1%) – najgorzej rokujący, głównie u osób starszych. [Sesje: JZ25, L25]", "options": [{"letter": "A", "text": "rdzeniasty", "correct": false}, {"letter": "B", "text": "brodawkowaty", "correct": true}, {"letter": "C", "text": "pęcherzykowy", "correct": false}, {"letter": "D", "text": "anaplastyczny", "correct": false}, {"letter": "E", "text": "sygnetowatokomórkowy", "correct": false}], "type": "single"}, {"text": "Podstawowy węglowodan w mleku kobiecym:", "hint": "Główny węglowodan mleka kobiecego – laktoza (~7 g/100 ml), disacharyd glukozy i galaktozy. Poza laktozą – HMO (oligosacharydy mleka kobiecego) wspierają mikrobiotę jelitową niemowlęcia. W mleku krowim laktoza wynosi ~4,5 g/100 ml, dlatego mieszanki są wzbogacane. [Sesje: JZ25, L25]", "options": [{"letter": "A", "text": "sacharoza", "correct": false}, {"letter": "B", "text": "glukoza", "correct": false}, {"letter": "C", "text": "fruktoza", "correct": false}, {"letter": "D", "text": "mannoza", "correct": false}, {"letter": "E", "text": "laktoza", "correct": true}], "type": "single"}, {"text": "Wskaż cechę, która NIE PASUJE do obrazu klinicznego szpiczaka plazmocytowego:", "hint": "Kryteria CRAB (IMWG): C – hiperkalcemia >2,75 mmol/l (lub >0,25 powyżej normy), R – uszkodzenie nerek: kreatynina >2 mg/dl (lub eGFR <40), A – anemia: Hb <10 g/dl (lub >2 g/dl poniżej normy), B – zmiany kostne (ogniska lityczne). Chromosom Filadelfia (BCR-ABL, t9;22) – to CML/ALL, NIE szpiczak. Na LEK wartości graniczne CRAB: Ca >2,75, kreatynina >2, Hb <10. [Sesje: W25, W26]", "options": [{"letter": "A", "text": "Hiperkalcemia", "correct": false}, {"letter": "B", "text": "Uszkodzenie nerek", "correct": false}, {"letter": "C", "text": "Anemia (niedokrwistość)", "correct": false}, {"letter": "D", "text": "Zmiany kostne", "correct": false}, {"letter": "E", "text": "Obecność chromosomu Filadelfia", "correct": true}], "type": "single"}, {"text": "Hemofilia B - to niedobór czynnika:", "hint": "Hemofilia A = niedobór czynnika VIII, hemofilia B (choroba Christmasa) = niedobór czynnika IX, hemofilia C = niedobór czynnika XI. Mnemonika: A → 8, B → 9. Przy urazie głowy u hemofilika – ZAWSZE: substytucja czynnika do 100% (~50 IU/kg dla cz. VIII) + hospitalizacja + CT głowy, nawet bez objawów neurologicznych (ryzyko opóźnionego krwiaka wewnątrzczaszkowego). Desmopresyna – tylko przy łagodnej postaci hemofilii A (aktywność cz. VIII >5%). [Sesje: W25, W26]", "options": [{"letter": "A", "text": "VIII", "correct": false}, {"letter": "B", "text": "IX", "correct": true}, {"letter": "C", "text": "XI", "correct": false}, {"letter": "D", "text": "XII", "correct": false}, {"letter": "E", "text": "II", "correct": false}], "type": "single"}, {"text": "Objawy Jaworskiego, Rovsinga, Blumberga:", "hint": "Wszystkie trzy objawy (Jaworskiego, Rovsinga, Blumberga) dotyczą zapalenia wyrostka robaczkowego. Rovsing – ucisk lewego dołu biodrowego wywołuje ból po stronie prawej (przekazywanie ciśnienia przez okrężnicę). Jaworski (psoas) – ból przy biernym wyproście prawej kończyny dolnej. Blumberg – ból przy gwałtownym oderwaniu ręki (objaw otrzewnowy). Goldflam – nerki, Chełmoński – pęcherzyk żółciowy. [Sesje: W25, W26]", "options": [{"letter": "A", "text": "zapalenie pęcherza moczowego", "correct": false}, {"letter": "B", "text": "zapalenie pęcherzyka żółciowego", "correct": false}, {"letter": "C", "text": "kolka moczowa", "correct": false}, {"letter": "D", "text": "zapalenie trzustki", "correct": false}, {"letter": "E", "text": "zapalenie wyrostka robaczkowego", "correct": true}], "type": "single"}, {"text": "Resuscytacja niemowlęcia — stosunek liczby uciśnięć klatki piersiowej do liczby oddechów:", "hint": "Stosunki uciśnięć do oddechów w CPR: dorośli → 30:2 (jeden lub dwóch ratowników). Dzieci/niemowlęta → 30:2 przy jednym ratowniku, 15:2 przy dwóch ratownikach medycznych. Noworodki (NRP) → 3:1. Uwaga: L25/pyt.43 dotyczy USG przesiewowego w ciąży – zalecane są 3 badania (11–14, 18–22, 28–32 tc wg PTGiP). [Sesje: JZ25, L25, W26]", "options": [{"letter": "A", "text": "30:2", "correct": false}, {"letter": "B", "text": "1:1", "correct": false}, {"letter": "C", "text": "15:2", "correct": true}, {"letter": "D", "text": "3:1", "correct": false}, {"letter": "E", "text": "10:2", "correct": false}], "type": "single"}, {"text": "Wskaż cechy charakteryzujące zespół nerczycowy:", "hint": "Klasyczna tetrada zespołu nerczycowego: białkomocz >3,5 g/d/1,73 m² + hipoalbuminemia (<3 g/dl) + obrzęki + hiperlipidemia (+ lipiduria). Pieniowy mocz = dużo białka. Krwiomocz (kolor \"coca-cola\") i nadciśnienie tętnicze – cechy zespołu NEFRYTYCZNEGO, nie nerczycowego. Różnica: nephrotic = białka + lipidy, nephritic = krew + nadciśnienie. [Sesje: L25, W25, W26]", "options": [{"letter": "A", "text": "poliuria, krwiomocz, hipercholesterolemia", "correct": false}, {"letter": "B", "text": "hipoalbuminemia, uogólnione obrzęki, nadciśnienie tętnicze", "correct": false}, {"letter": "C", "text": "hipoalbuminemia, hipercholesterolemia, nadciśnienie tętnicze", "correct": false}, {"letter": "D", "text": "hipoalbuminemia, podwyższone stężenie kreatyniny w surowicy krwi, hipercholesterolemia", "correct": false}, {"letter": "E", "text": "hipoalbuminemia, białkomocz powyżej 3,5g/dob./1,73 m², uogólnione obrzęki", "correct": true}], "type": "single"}, {"text": "Wskaż nieprawdziwą informację na temat zespołu nerczycowego u dzieci:", "hint": "ZN u dzieci: kryterium białkomoczu – >50 mg/kg/d (lub >40 mg/m²/h, lub UPCR >2 mg/mg). Wartość 100 mg/kg jest nieprawidłowa (próg zbyt wysoki). Cholesterol typowo >250 mg/dl, albuminy <2,5 g/dl. Najczęstsza przyczyna u dzieci – const LS_PREFIX = 'lek_quiz_v2_';

let currentSession = null;
let questions = [];
let shuffled = false;
let queue = [];        // ordered list of question objects for current run
let queueOrder = [];   // original indices into `questions` array (to save/restore shuffle)
let idx = 0;
let answered = false;
let correct = 0;
let wrong = 0;
let skipped = 0;
let wrongQuestions = [];
// answerMap: { queueIndex: 'correct'|'wrong'|'skipped'|'known'|'unknown' }
let answerMap = {};

// ─── LocalStorage helpers ─────────────────────────────────────────────────

function lsKey() { return LS_PREFIX + currentSession; }

function saveProgress() {
  if (!currentSession) return;
  const data = {
    version: 2,
    queueOrder,        // original indices preserving shuffle order
    idx,
    correct, wrong, skipped,
    answerMap
  };
  try { localStorage.setItem(lsKey(), JSON.stringify(data)); } catch(e) {}
  flashSaved();
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(lsKey());
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (d.version !== 2) return null;
    return d;
  } catch(e) { return null; }
}

function clearProgress() {
  if (!confirm('Resetować postęp dla tej sesji?')) return;
  try { localStorage.removeItem(lsKey()); } catch(e) {}
  answerMap = {};
  document.getElementById('resumeBtn').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  updateSessionBadges();
  // Back to controls view
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
}

let saveTimer = null;
function flashSaved() {
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('show'), 1200);
}

// ─── Session selector ─────────────────────────────────────────────────────

function buildSessionGrid() {
  const grid = document.getElementById('sessionGrid');
  grid.innerHTML = '';

  const allCount = Object.values(SESSIONS).reduce((s, qs) => s + qs.length, 0);
  const allBtn = document.createElement('button');
  allBtn.className = 'session-btn all-btn';
  allBtn.dataset.session = '__all__';
  allBtn.onclick = () => selectSession('__all__');
  grid.appendChild(allBtn);

  for (const [name, qs] of Object.entries(SESSIONS)) {
    const btn = document.createElement('button');
    btn.className = 'session-btn';
    btn.dataset.session = name;
    btn.onclick = () => selectSession(name);
    grid.appendChild(btn);
  }
  updateSessionBadges();
}

function updateSessionBadges() {
  // Update counts and saved-progress indicators on session buttons
  const allCount = Object.values(SESSIONS).reduce((s, qs) => s + qs.length, 0);
  const allSaved = loadSavedForSession('__all__');
  const allBtn = document.querySelector('.all-btn');
  if (allBtn) {
    const prog = allSaved ? ` · ${allSaved.idx}/${allSaved.queueOrder.length}` : '';
    allBtn.innerHTML = `<div class="name">Wszystkie sesje</div><div class="count">${allCount} pytań${prog}</div>`;
  }
  for (const [name, qs] of Object.entries(SESSIONS)) {
    const btn = document.querySelector(`[data-session="${CSS.escape(name)}"]`);
    if (!btn) continue;
    const saved = loadSavedForSession(name);
    const prog = saved ? ` · ${saved.idx}/${saved.queueOrder.length}` : '';
    btn.innerHTML = `<div class="name">${name}</div><div class="count">${qs.length} pytań${prog}</div>`;
  }
}

function loadSavedForSession(name) {
  try {
    const raw = localStorage.getItem(LS_PREFIX + name);
    if (!raw) return null;
    const d = JSON.parse(raw);
    return d.version === 2 ? d : null;
  } catch(e) { return null; }
}

function selectSession(name) {
  currentSession = name;
  document.querySelectorAll('.session-btn').forEach(b => {
    b.classList.toggle('active',
      b.dataset.session === name ||
      (name === '__all__' && b.classList.contains('all-btn')));
  });

  questions = name === '__all__'
    ? Object.values(SESSIONS).flat()
    : (SESSIONS[name] || []);

  document.getElementById('controls').style.display = 'flex';
  document.getElementById('qCount').textContent = questions.length + ' pytań';
  document.getElementById('wrongOnlyBtn').style.display = wrongQuestions.length ? 'block' : 'none';
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'none';

  // Show resume / reset if saved progress exists
  const saved = loadSaved();
  document.getElementById('resumeBtn').style.display = saved ? 'inline-block' : 'none';
  document.getElementById('resetBtn').style.display  = saved ? 'inline-block' : 'none';
  document.getElementById('startBtn').style.display  = 'inline-block';
}

// ─── Shuffle / wrong-only ─────────────────────────────────────────────────

function toggleShuffle() {
  shuffled = !shuffled;
  document.getElementById('shuffleBtn').classList.toggle('active', shuffled);
}

function toggleWrongOnly() {
  if (wrongQuestions.length) {
    questions = wrongQuestions;
    document.getElementById('qCount').textContent = questions.length + ' pytań (błędne)';
  }
}

// ─── Quiz start / resume ──────────────────────────────────────────────────

function startQuiz(qs) {
  const pool = qs || questions;
  queueOrder = pool.map((_, i) => i);  // original indices
  if (shuffled) queueOrder.sort(() => Math.random() - 0.5);
  queue = queueOrder.map(i => pool[i]);

  idx = 0;
  correct = 0; wrong = 0; skipped = 0;
  wrongQuestions = [];
  answerMap = {};
  answered = false;

  showQuizArea();
  showQuestion();
}

function resumeQuiz() {
  const saved = loadSaved();
  if (!saved) { startQuiz(); return; }

  queueOrder = saved.queueOrder;
  queue = queueOrder.map(i => questions[i]);
  idx = saved.idx;
  correct = saved.correct;
  wrong = saved.wrong;
  skipped = saved.skipped;
  answerMap = saved.answerMap || {};
  wrongQuestions = queue.filter((_, i) =>
    answerMap[i] === 'wrong' || answerMap[i] === 'unknown');

  answered = false;
  showQuizArea();
  showQuestion();
}

function showQuizArea() {
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('controls').style.display = 'none';
  buildPagination();
}

// ─── Question display ─────────────────────────────────────────────────────

function showQuestion() {
  if (idx >= queue.length) { showResults(); return; }

  const q = queue[idx];
  answered = !!answerMap[idx];  // already answered if in map

  // Progress bar
  const pct = Math.round((idx / queue.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${idx + 1} / ${queue.length}`;
  updateScoreBadge();
  updatePagination();

  document.getElementById('qMeta').textContent = `Pytanie ${idx + 1}`;
  document.getElementById('qText').textContent = q.text;
  // Render numbered scenario items (K-type questions) as an ordered list
  const qItemsEl = document.getElementById('qItems');
  if (q.items && q.items.length) {
    const ol = document.createElement('ol');
    ol.className = 'q-items';
    q.items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      ol.appendChild(li);
    });
    qItemsEl.innerHTML = '';
    qItemsEl.appendChild(ol);
    qItemsEl.style.display = '';
  } else {
    qItemsEl.innerHTML = '';
    qItemsEl.style.display = 'none';
  }
  document.getElementById('qTypeBadge').innerHTML =
    q.type === 'multiple' ? '<span class="q-type-badge">Możliwe kilka odpowiedzi</span>' : '';

  renderOptions(q, answerMap[idx]);

  document.getElementById('hintBox').classList.remove('visible');
  document.getElementById('hintText').textContent = q.hint || '';

  // If coming back to already-answered question, show hint
  if (answered && q.hint) {
    document.getElementById('hintText').textContent = q.hint;
    document.getElementById('hintBox').classList.add('visible');
  }

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = !answered;

  // Scroll pagination button into view
  const pgBtn = document.getElementById('pg_' + idx);
  if (pgBtn) pgBtn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}

function renderOptions(q, savedAnswer) {
  const optDiv = document.getElementById('optionsDiv');
  optDiv.innerHTML = '';
  document.getElementById('revealAnswer').classList.remove('visible');
  document.getElementById('revealBtn').style.display = 'none';

  // Remove lingering known/unknown buttons
  document.querySelectorAll('.reveal-yn-btn').forEach(b => b.remove());

  if (q.type === 'reveal') {
    if (savedAnswer) {
      const ra = document.getElementById('revealAnswer');
      ra.textContent = q.correct_text || '';
      ra.classList.add('visible');
    } else {
      document.getElementById('revealBtn').style.display = 'block';
    }
    return;
  }

  if (q.type === 'reveal_with_options') {
    for (const opt of q.options) {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.disabled = true;
      btn.innerHTML = `<span class="letter">${opt.letter}</span><span class="opt-text">${escHtml(opt.text)}</span>`;
      optDiv.appendChild(btn);
    }
    if (savedAnswer) {
      const ra = document.getElementById('revealAnswer');
      ra.textContent = q.correct_text || '';
      ra.classList.add('visible');
    } else {
      document.getElementById('revealBtn').style.display = 'block';
    }
    return;
  }

  // Standard question
  for (const opt of q.options) {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${opt.letter}</span><span class="opt-text">${escHtml(opt.text)}</span>`;

    if (savedAnswer) {
      btn.disabled = true;
      if (opt.correct) btn.classList.add(savedAnswer === 'correct' ? 'correct' : 'reveal-correct');
      // Mark the wrong choice the user picked — we didn't store which letter, so just show correct
    } else {
      btn.onclick = () => selectOption(btn, opt, q);
    }
    optDiv.appendChild(btn);
  }
}

// ─── Answering ────────────────────────────────────────────────────────────

function selectOption(btn, opt, q) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.option-btn');
  allBtns.forEach(b => b.disabled = true);

  if (opt.correct) {
    btn.classList.add('correct');
    correct++;
    answerMap[idx] = 'correct';
  } else {
    btn.classList.add('wrong');
    wrong++;
    wrongQuestions.push(q);
    answerMap[idx] = 'wrong';
    allBtns.forEach(b => {
      const letter = b.querySelector('.letter').textContent;
      const matchOpt = q.options.find(o => o.letter === letter);
      if (matchOpt && matchOpt.correct) b.classList.add('reveal-correct');
    });
  }

  showHint(q);
  document.getElementById('nextBtn').disabled = false;
  updateScoreBadge();
  updatePagination();
  saveProgress();
}

function revealAnswer() {
  const q = queue[idx];
  answered = true;
  const ra = document.getElementById('revealAnswer');
  ra.textContent = q.correct_text || '';
  ra.classList.add('visible');
  document.getElementById('revealBtn').style.display = 'none';
  showHint(q);
  document.getElementById('nextBtn').disabled = false;

  // Known / not known buttons
  const hintBox = document.getElementById('hintBox');
  const yesBtn = document.createElement('button');
  yesBtn.className = 'ctrl-btn reveal-yn-btn';
  yesBtn.style.cssText = 'margin-top:8px;margin-right:8px';
  yesBtn.textContent = 'Znałem';
  yesBtn.onclick = () => {
    correct++; answerMap[idx] = 'known';
    updateScoreBadge(); updatePagination(); saveProgress();
    yesBtn.remove(); noBtn.remove();
  };
  const noBtn = document.createElement('button');
  noBtn.className = 'ctrl-btn reveal-yn-btn';
  noBtn.style.cssText = 'margin-top:8px';
  noBtn.textContent = 'Nie znałem';
  noBtn.onclick = () => {
    wrong++; wrongQuestions.push(q); answerMap[idx] = 'unknown';
    updateScoreBadge(); updatePagination(); saveProgress();
    yesBtn.remove(); noBtn.remove();
  };
  ra.after(yesBtn);
  yesBtn.after(noBtn);
}

function showHint(q) {
  if (q.hint) {
    document.getElementById('hintText').textContent = q.hint;
    document.getElementById('hintBox').classList.add('visible');
  }
}

// ─── Navigation ───────────────────────────────────────────────────────────

function navigate(dir) {
  if (dir === 1) {
    if (!answered) { skipped++; answerMap[idx] = answerMap[idx] || 'skipped'; }
    saveProgress();
    idx++;
    answered = false;
    showQuestion();
  } else {
    if (idx > 0) { idx--; answered = !!answerMap[idx]; showQuestion(); }
  }
}

function skipQuestion() {
  if (!answered) { skipped++; answerMap[idx] = 'skipped'; }
  saveProgress();
  idx++;
  answered = false;
  showQuestion();
}

function jumpToQuestion(i) {
  saveProgress();
  idx = i;
  answered = !!answerMap[idx];
  showQuestion();
  document.getElementById('questionCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── Score & UI updates ───────────────────────────────────────────────────

function updateScoreBadge() {
  const total = correct + wrong;
  const badge = document.getElementById('scoreBadge');
  badge.textContent = `${correct} / ${total}`;
  badge.className = 'score-badge' + (total > 0 && correct / total >= 0.7 ? ' good' : '');
}

// ─── Pagination ───────────────────────────────────────────────────────────

function buildPagination() {
  const grid = document.getElementById('paginationGrid');
  grid.innerHTML = '';
  for (let i = 0; i < queue.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'pg-btn';
    btn.id = 'pg_' + i;
    btn.textContent = i + 1;
    btn.onclick = () => jumpToQuestion(i);
    grid.appendChild(btn);
  }
  updatePagination();
}

function updatePagination() {
  for (let i = 0; i < queue.length; i++) {
    const btn = document.getElementById('pg_' + i);
    if (!btn) continue;
    btn.className = 'pg-btn';
    const state = answerMap[i];
    if (i === idx) btn.classList.add('pg-current');
    else if (state === 'correct' || state === 'known') btn.classList.add('pg-correct');
    else if (state === 'wrong'   || state === 'unknown') btn.classList.add('pg-wrong');
    else if (state === 'skipped') btn.classList.add('pg-skipped');
  }
}

// ─── Results ──────────────────────────────────────────────────────────────

function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultsArea').style.display = 'block';
  saveProgress();
  updateSessionBadges();

  const answered_count = correct + wrong;
  const pct = answered_count > 0 ? Math.round(correct / answered_count * 100) : 0;
  document.getElementById('resPct').textContent = pct + '%';
  document.getElementById('resDetail').textContent =
    `${answered_count} pytań odpowiedziano, ${skipped} pominięto`;
  document.getElementById('resBreakdown').innerHTML = `
    <div class="breakdown-item"><div class="val green">${correct}</div><div class="lbl">Poprawnie</div></div>
    <div class="breakdown-item"><div class="val red">${wrong}</div><div class="lbl">Błędnie</div></div>
    <div class="breakdown-item"><div class="val grey">${skipped}</div><div class="lbl">Pominięto</div></div>
  `;
}

function restartQuiz() {
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('resultsArea').style.display = 'none';
  startQuiz(questions);
}

function restartWrong() {
  if (!wrongQuestions.length) return;
  startQuiz(wrongQuestions);
}

// ─── Utilities ────────────────────────────────────────────────────────────

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

buildSessionGrid();
</script>
