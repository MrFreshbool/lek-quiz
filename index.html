: "Cechą charakterystyczną rumienia nagłego (gorączki trzydniowej) jest:", "hint": "Roseola infantum (rumień nagły): czynnik etiologiczny HHV-6/7 (NIE EBV!), 3-5 dni wysokiej gorączki → nagłe obniżenie temperatury → pojawienie się wysypki. Często drgawki gorączkowe.", "items": ["nagła gorączka, utrzymująca się 3-5 dni", "czynnik etiologiczny — wirus EBV", "pojawienie się wysypki w chwili spadku temperatury ciała", "pojawienie się wysypki w pierwszej dobie gorączki", "możliwość wystąpienia drgawek gorączkowych"], "options": [{"letter": "A", "text": "3, 4", "correct": false}, {"letter": "B", "text": "4, 5", "correct": false}, {"letter": "C", "text": "1, 2, 5", "correct": false}, {"letter": "D", "text": "1, 3, 5", "correct": true}, {"letter": "E", "text": "tylko 3", "correct": false}], "type": "single"}, {"text": "Wskaż optymalne postępowanie po kontakcie ciężarnej (w III trymestrze ciąży) z dzieckiem, u którego rozpoznano rumień zakaźny:", "hint": "Parvowirus B19 — okres zakaźny: 5-10 dni PRZED pojawieniem się wysypki. Po pojawieniu wysypki pacjent NIE jest zakaźny. Ryzyko dla płodu: największe w 9-20 tc. (obrzęk uogólniony, anemia → śmierć wewnątrzmaciczna); III trymestr (jak w pytaniu) — ryzyko minimalne. Kontakt z dzieckiem z aktywną wysypką → brak ryzyka zakażenia → bez wskazań do izolacji ani diagnostyki. Gdyby kontakt był przed wysypką → serologia IgG/IgM matki + ew. USG Doppler MCA płodu.", "options": [{"letter": "A", "text": "izolacja od chorego dziecka, badania serologiczne w kierunku wcześniejszego zakażenia parwowirusem B19 u matki", "correct": false}, {"letter": "B", "text": "izolacja od chorego dziecka, oczekiwanie na wystąpienie objawów infekcji u matki oraz ultrasonografia płodu", "correct": false}, {"letter": "C", "text": "izolacja od chorego dziecka, bez wskazań do rozszerzania diagnostyki", "correct": false}, {"letter": "D", "text": "bez wskazań do izolacji, bez wskazań do rozszerzania diagnostyki", "correct": true}, {"letter": "E", "text": "bez wskazań do izolacji, wskazana ultrasonografia płodu", "correct": false}], "type": "single"}, {"text": "Który z poniższych opisów charakteryzuje tętno dwubitne?", "hint": "Tętno dwubitne (pulsus bisferiens) = dwie fale dodatnie w czasie skurczu — HCM z zawężeniem drogi odpływu + wada złożona aortalna (AS+AI). C = tętno dikrotyczne (fala skurczowa + dikrotyczna we wczesnym rozkurczu) — tamponada. A = bigeminizm. E = tętno paradoksalne (Kussmaula).", "options": [{"letter": "A", "text": "tętno, w którym po każdym prawidłowym skurczu serca występuje przedwczesne pobudzenie komorowe", "correct": false}, {"letter": "B", "text": "tętno z dwoma falami dodatnimi w czasie skurczu, wywołane obecnością dodatkowej fali przepływu krwi, występuje w kardiomiopatii przerostowej z zawężeniem drogi odpływu oraz w wadzie złożonej (niedomykalność i zwężenie zastawki aortalnej)", "correct": true}, {"letter": "C", "text": "tętno, w którym jedna fala przypada na okres skurczu, a druga na początek rozkurczu, zwykle w tamponadzie serca", "correct": false}, {"letter": "D", "text": "szybkie, słabo wypełnione tętno, występuje we wstrząsie", "correct": false}, {"letter": "E", "text": "zmniejszenie wypełnienia tętna lub jego całkowity zanik z towarzyszącym obniżeniem ciśnienia skurczowego o >10 mmHg podczas wdechu", "correct": false}], "type": "single"}, {"text": "Siedmioletni chłopiec z alergią pokarmową, ze wstrząsem anafilaktycznym po wypiciu mleka w wywiadzie. Obrzęk powiek i podudzi, białko (+++) w moczu, CRP w normie. Jakie rozpoznanie?", "hint": "U dziecka obrzęki powiek/goleni + białkomocz (+++) + norma CRP = zespół nerczycowy (często choroba minimalnych zmian — MCD). Atopia w wywiadzie jest skojarzona z MCD.", "options": [{"letter": "A", "text": "nasilenie objawów alergii pokarmowej", "correct": false}, {"letter": "B", "text": "podejrzenie zakażenia układu moczowego", "correct": false}, {"letter": "C", "text": "reakcja toksyczna po ukąszeniu owadów", "correct": false}, {"letter": "D", "text": "podejrzenie uczulenia na jad owadów", "correct": false}, {"letter": "E", "text": "podejrzenie zespołu nerczycowego", "correct": true}], "type": "single"}, {"text": "U 16-letniej pacjentki z nefropatią toczniową z eGFR 45 ml/min/1,73 m² należy rozpoznać następujące stadium przewlekłej niewydolności nerek:", "hint": "Stadia PChN według KDIGO (eGFR): G1 ≥90, G2 60-89, G3a 45-59, G3b 30-44, G4 15-29, G5 <15. eGFR 45 = G3a = stadium 3.", "options": [{"letter": "A", "text": "1", "correct": false}, {"letter": "B", "text": "2", "correct": false}, {"letter": "C", "text": "3", "correct": true}, {"letter": "D", "text": "4", "correct": false}, {"letter": "E", "text": "5", "correct": false}], "type": "single"}, {"text": "Wskaż stany kliniczne przebiegające z „jałowym ropomoczem\":", "hint": "Jałowa ropomocz (sterylna pyuria): gruźlica dróg moczowych, polekowe śródmiąższowe zapalenie nerek, chlamydia/rzeżączka, choroby autoimmunologiczne (SLE, Sjögren), kamica nerkowa, nefropatia analgetyczna.", "items": ["gruźlica dróg moczowych", "ostre polekowe cewkowośródmiąższowe zapalenie nerek", "zakażenie Chlamydia trachomatis / nefropatia toczniowa", "zespół Sjögrena"], "options": [{"letter": "A", "text": "1, 2, 3, 4", "correct": true}, {"letter": "B", "text": "1, 4, 5", "correct": false}, {"letter": "C", "text": "1, 2, 3, 5", "correct": false}, {"letter": "D", "text": "3, 4, 5", "correct": false}, {"letter": "E", "text": "wszystkie wymienione", "correct": false}], "type": "single"}, {"text": "Za początek porodu przyjmuje się:", "hint": "Początek porodu = regularne skurcze (≥1/10 min) + strukturalne zmiany szyjki (skrócenie, rozwarcie). Same odejście wód lub skurcze bez zmian szyjki — to jeszcze nie poród.", "options": [{"letter": "A", "text": "odpłynięcie płynu owodniowego", "correct": false}, {"letter": "B", "text": "odpłynięcie płynu owodniowego i obecność skurczów macicy", "correct": false}, {"letter": "C", "text": "rozwieranie i skracanie się szyjki macicy w wyniku regularnej czynności skurczowej; skurcze co najmniej raz na 10 minut", "correct": true}, {"letter": "D", "text": "rozwieranie i skracanie się szyjki macicy w wyniku regularnej czynności skurczowej; skurcze co najmniej raz na 5 minut", "correct": false}, {"letter": "E", "text": "rozwieranie i skracanie się szyjki macicy w wyniku regularnej czynności skurczowej; skurcze co najmniej raz na 3 minuty", "correct": false}], "type": "single"}, {"text": "Rekomendowana minimalna wartość BMI, kwalifikująca do chirurgicznego leczenia otyłości bez współistniejących schorzeń wynosi:", "hint": "Bariatria bez chorób towarzyszących: BMI ≥40. Z chorobami towarzyszącymi (cukrzyca t.2, OBS, ciężkie NT): ≥35. Nowe rekomendacje IFSO 2022 obniżają progi, ale klasyczna odpowiedź — 40.", "options": [{"letter": "A", "text": "50", "correct": false}, {"letter": "B", "text": "45", "correct": false}, {"letter": "C", "text": "40", "correct": true}, {"letter": "D", "text": "35", "correct": false}, {"letter": "E", "text": "30", "correct": false}], "type": "single"}, {"text": "Najczęściej występującym objawem raka jelita grubego jest:", "hint": "Najczęstsze objawy CRC: zmiana rytmu wypróżnień (zaparcia/biegunki), krwawienie z odbytu, niedokrwistość z niedoboru żelaza (zwłaszcza prawa połowa), bóle. Lewa połowa — objawy obturacyjne, prawa — niedokrwistość.", "options": [{"letter": "A", "text": "zmiana rytmów wypróżnień", "correct": true}, {"letter": "B", "text": "ból brzucha", "correct": false}, {"letter": "C", "text": "niedrożność", "correct": false}, {"letter": "D", "text": "niedokrwistość", "correct": false}, {"letter": "E", "text": "krwawienie utajone", "correct": false}], "type": "single"}, {"text": "Najczęstszą bezpośrednią przyczyną ostrego zapalenia otrzewnej jest:", "hint": "Wtórne zapalenie otrzewnej najczęściej — perforacja PP (wrzód, wyrostek, uchyłek, guz). Sepsa — następstwo, nie przyczyna zapalenia otrzewnej.", "options": [{"letter": "A", "text": "zadzierzgnięcie jelita cienkiego", "correct": false}, {"letter": "B", "text": "wgłobienie jelita cienkiego w jelito grube", "correct": false}, {"letter": "C", "text": "perforacja przewodu pokarmowego", "correct": true}, {"letter": "D", "text": "sepsa", "correct": false}, {"letter": "E", "text": "niedrożność jelita grubego", "correct": false}], "type": "single"}, {"text": "Najczęstszą przyczyną niedrożności mechanicznej dolnego odcinka przewodu pokarmowego jest/są:", "hint": "DOLNY odcinek (jelito grube): rak — №1 przyczyna mechanicznej niedrożności. GÓRNY odcinek (jelito cienkie): zrosty — №1, przepukliny — №2.", "options": [{"letter": "A", "text": "uchyłki jelita grubego", "correct": false}, {"letter": "B", "text": "zrosty otrzewnej", "correct": false}, {"letter": "C", "text": "uchyłek Meckela", "correct": false}, {"letter": "D", "text": "guzy nowotworowe", "correct": true}, {"letter": "E", "text": "bezoary", "correct": false}], "type": "single"}, {"text": "Chory lat 40 przyjęty do SOR z powodu silnych dolegliwości bólowych pod prawym łukiem żebrowym o charakterze kolki żółciowej, z dreszczami i gorączką oraz żółtaczką. CRP podwyższone. W USG poszerzenie dróg żółciowych zewnątrzwątrobowych. Rozpoznanie:", "hint": "Triada Charcota (żółtaczka + gorączka z dreszczami + ból w prawym podżebrzu) + poszerzenie dróg żółciowych w USG = ostre zapalenie dróg żółciowych. Leczenie — antybiotyki + pilna dekompresja (ECPW).", "options": [{"letter": "A", "text": "ostre zapalenie trzustki", "correct": false}, {"letter": "B", "text": "ostre zapalenie pęcherzyka żółciowego", "correct": false}, {"letter": "C", "text": "rak wnęki wątroby", "correct": false}, {"letter": "D", "text": "ostre zapalenie dróg żółciowych", "correct": true}, {"letter": "E", "text": "posocznica", "correct": false}], "type": "single"}, {"text": "W celu rozpoznania POCHP — który parametr spirometrii służy do rozpoznania?", "hint": "POChP: wskaźnik Tiffeneau (FEV1/FVC) <0,70 po bronchodilatatorze — podstawowe kryterium rozpoznania. Nasilenie oceniane według %FEV1 (GOLD 1-4).", "options": [{"letter": "A", "text": "natężona objętość wydechowa pierwszosekundowa (FEV1) oraz natężona pojemność życiowa (FVC)", "correct": true}, {"letter": "B", "text": "pojemność wdechowa (IC)", "correct": false}, {"letter": "C", "text": "objętość oddechowa (TV)", "correct": false}, {"letter": "D", "text": "wydechowa objętość zapasowa (ERV)", "correct": false}, {"letter": "E", "text": "wdechowa objętość zapasowa (IRV)", "correct": false}], "type": "single"}], "Lato 2025": [{"text": "W ostrej fazie zatorowości płucnej nie stosuje się:", "hint": "W ostrej ZP stosuje się antykoagulanty (HDCz/HNF) i trombolitykami (alteplaza, streptokinaza), ale NIE ASA — aspiryna jest nieskuteczna w zakrzepicy żylnej.", "options": [{"letter": "A", "text": "streptokinazy", "correct": false}, {"letter": "B", "text": "kwasu acetylosalicylowego", "correct": true}, {"letter": "C", "text": "heparyny drobnocząsteczkowej", "correct": false}, {"letter": "D", "text": "heparyny niefrakcjonowanej", "correct": false}, {"letter": "E", "text": "alteplazy", "correct": false}], "type": "single"}, {"text": "OGTT przed pracą na czczo glukoza 100 mg/dl i po 2h 214 mg/dl. Rozpoznanie?", "hint": "Glikemia 2 h po OGTT ≥200 mg/dl = cukrzyca (niezależnie od wartości na czczo). 140-199 mg/dl = nieprawidłowa tolerancja glukozy.", "options": [{"letter": "A", "text": "cukrzyca", "correct": true}, {"letter": "B", "text": "nieprawidłowa tolerancja glukozy", "correct": false}, {"letter": "C", "text": "nieprawidłowa glikemia na czczo", "correct": false}, {"letter": "D", "text": "normoglikemia", "correct": false}, {"letter": "E", "text": "stan przedcukrzycowy", "correct": false}], "type": "single"}, {"text": "Operacja sposobem Mayo:", "hint": "Metoda Mayo — klasyczna plastyka przepukliny pępkowej techniką „vest-over-pants\" (zachodzące na siebie płaty rozcięgna) bez siatki.", "options": [{"letter": "A", "text": "przepuklina udowa z zastosowaniem siatki", "correct": false}, {"letter": "B", "text": "przepuklina udowa bez zastosowania siatki", "correct": false}, {"letter": "C", "text": "przepuklina pachwinowa z zastosowaniem siatki", "correct": false}, {"letter": "D", "text": "przepuklina pachwinowa bez zastosowania siatki", "correct": false}, {"letter": "E", "text": "przepuklina pępkowa bez zastosowania siatki", "correct": true}], "type": "single"}, {"text": "Do szpitala zgłosiło się 10 miesięczne dziecko we wstrząsie, 8 kg z hipowolemią. Jaka dawka podawanych płynów w początkowej resuscitacii płynowej:", "hint": "Wg Lissauera (str. 112) bolus = 10 ml/kg → 80 ml (odpowiedź egzaminacyjna). UWAGA: PALS/ERC 2021 zaleca 20 ml/kg w wstrząsie hipowolemicznym (= 160 ml u 8 kg dziecka); ograniczenie do 10 ml/kg pochodzi z badania FEAST dotyczącego wstrząsu septycznego w krajach o ograniczonych zasobach.", "options": [{"letter": "A", "text": "800", "correct": false}, {"letter": "B", "text": "160", "correct": false}, {"letter": "C", "text": "80 (Tom Lissauer Pediatria st. 112)", "correct": true}, {"letter": "D", "text": "40", "correct": false}, {"letter": "E", "text": "1600", "correct": false}], "type": "single"}, {"text": "Pierwsze szczepienie u zdrowego dziecka przeciwko Haemophilus influenzae b?", "hint": "W polskim kalendarzu szczepień Hib rozpoczyna się od 6-7 tygodnia życia (2. miesiąc), łącznie z DTP, IPV i HepB w postaci szczepionki skojarzonej.", "options": [{"letter": "A", "text": "2 miesiąc", "correct": true}, {"letter": "B", "text": "1 tydzień", "correct": false}, {"letter": "C", "text": "1 doba", "correct": false}, {"letter": "D", "text": "1 miesiąc", "correct": false}, {"letter": "E", "text": "8 miesięcy", "correct": false}], "type": "single"}, {"text": "Przesiewowe badania w kierunku wrodzonej niedoczynności tarczycy z pozytywnym wynikiem pozwala wdrożyć leczenie:", "hint": "Skrining wrodzonej niedoczynności tarczycy (TSH z pięty) wykonuje się w 3-4 dobie życia; leczenie L-tyroksyną należy rozpocząć przed 14. dniem życia, aby zapobiec niepełnosprawności intelektualnej.", "options": [{"letter": "A", "text": "w okresie prenatalnym", "correct": false}, {"letter": "B", "text": "po 3 miesiącach", "correct": false}, {"letter": "C", "text": "w 2 tygodnia", "correct": true}, {"letter": "D", "text": "po 2. miesiącu", "correct": false}, {"letter": "E", "text": "w 2. dni po urodzeniu", "correct": false}], "type": "single"}, {"text": "Oznaczenie D-dimeru we krwi nie ma zastosowania:", "hint": "VITT rozpoznaje się na podstawie przeciwciał anty-PF4 (jak w HIT), a nie D-dimeru. D-dimer stosuje się w diagnostyce ŻChZZ, rozwarstwienia aorty i DIC.", "options": [{"letter": "A", "text": "wykluczenie kliniczne istotnej ŻChZZ", "correct": false}, {"letter": "B", "text": "rozpoczęcie rozwarstwienia aorty", "correct": false}, {"letter": "C", "text": "rozpoczęcie zespołu DIC", "correct": false}, {"letter": "D", "text": "manifestacja chorych z rozpoznanej zakrzepicą", "correct": false}, {"letter": "E", "text": "rozpoznanie immunologicznej małopłytkowości zakrzepowej wywołanej przez szczepienie przeciwko Covid-19", "correct": true}], "type": "single"}, {"text": "W leczeniu której z chorób metabolicznych ma być stosowana dieta bezlaktozowa:", "hint": "W galaktozemii (niedobór GALT) laktoza rozkłada się na glukozę i galaktozę, dlatego konieczna jest dieta bezlaktozowa (= bezgalaktozowa).", "options": [{"letter": "A", "text": "choroba syropu klonowego", "correct": false}, {"letter": "B", "text": "fruktozemia", "correct": false}, {"letter": "C", "text": "fenylketonuria", "correct": false}, {"letter": "D", "text": "galaktozemia", "correct": true}, {"letter": "E", "text": "mukopolisacharydoza", "correct": false}], "type": "single"}, {"text": "Do leków kontrolujących przebieg astmy oskrzelowej nie należy (pytanie unieważniono czerwiec 2025):", "hint": "W astmie stosuje się leki ANTYcholinergiczne (tiotropium), a cholinergiczne powodują skurcz oskrzeli. Pytanie unieważnione z powodu nieprecyzyjnego sformułowania.", "options": [{"letter": "A", "text": "leki cholinergiczne", "correct": true}, {"letter": "B", "text": "GKS wziewne", "correct": false}, {"letter": "C", "text": "GKS doustne", "correct": false}, {"letter": "D", "text": "ß-mimetyki długodziałające", "correct": false}, {"letter": "E", "text": "leki leukotrienowe", "correct": false}], "type": "single"}, {"text": "Podstawowy węglowodan w mleku kobiecym:", "hint": "Laktoza jest głównym węglowodanem mleka kobiecego (~7 g/100 ml), dostarcza ~40% kalorii i wspiera rozwój flory bifidogennej.", "options": [{"letter": "A", "text": "sacharoza", "correct": false}, {"letter": "B", "text": "glukoza", "correct": false}, {"letter": "C", "text": "fruktoza", "correct": false}, {"letter": "D", "text": "mannoza", "correct": false}, {"letter": "E", "text": "laktoza", "correct": true}], "type": "single"}, {"text": "Jakim płynem najlepiej rozpocząć dopajanie 4-miesięcznego dziecka?", "hint": "Do pojenia niemowląt zaleca się wodę źródlaną lub niskominalizowaną, bez cukru, aromatów i ziół.", "options": [{"letter": "A", "text": "woda z cukrem", "correct": false}, {"letter": "B", "text": "napar z rumianku", "correct": false}, {"letter": "C", "text": "sok owocowy", "correct": false}, {"letter": "D", "text": "herbata granulowana o smaku multiowocowym", "correct": false}, {"letter": "E", "text": "woda źródlana lub niskozmineralizowana", "correct": true}], "type": "single"}, {"text": "Najczęstsza przyczyna nadciśnienia tętniczego u dzieci do 10 lat:", "hint": "U dzieci poniżej 10. roku życia dominuje wtórne NT — najczęściej choroby miąższu nerek (kłębuszkowe zapalenie nerek, nefropatia refluksowa). U nastolatków — otyłość i pierwotne NT.", "options": [{"letter": "A", "text": "nadciśnienie monogenowe", "correct": false}, {"letter": "B", "text": "zespół Cushinga", "correct": false}, {"letter": "C", "text": "choroby nerek", "correct": true}, {"letter": "D", "text": "wrodzone wady serca i naczyń", "correct": false}, {"letter": "E", "text": "otyłość", "correct": false}], "type": "single"}, {"text": "Wskaż fałsz dotyczący bromokryptyny:", "hint": "Bromokryptyna (pochodna sporyszu) jest PRZECIWWSKAZANA w chorobach układu sercowo-naczyniowego — powoduje wazospazm, zwłóknienie zastawek, nadciśnienie. Jak wszystkie agoniści dopaminy wywołuje zaburzenia kontroli impulsów.", "options": [{"letter": "A", "text": "lek stosowany w zaburzeniach miesiączkowania", "correct": false}, {"letter": "B", "text": "lek stosowany w połogu pragnącym powstrzymać laktację", "correct": false}, {"letter": "C", "text": "lek bezpieczny u osób z chorobami sercowo-naczyniowymi", "correct": true}, {"letter": "D", "text": "jest pochodną ergokryptyny o działaniu pobudzającym receptory dopaminergiczne", "correct": false}, {"letter": "E", "text": "efektem stosowania bromokryptyny mogą być zaburzenia kontroli i impulsów w postaci kompulsywnych zakupów, zachowań hiperseksualnych czy hazardu", "correct": false}], "type": "single"}, {"text": "Do SOR zgłosiła się kobieta 31, dotychczas zdrowa, z powodu osłabienia, gorączki, wymioty, bólu w okolicy lędźwiowej, objawów dyzurycznych i znanego osłabienia. W badaniu przedmiotowym cechy odwodnienia, + Goldflam po stronie lewej, RR 95/70. W wykonywanych badaniach leukocytoza, podw. CRP, kreatynina w górnej granicy normy, st. potasu w normie, w badaniu ogólnym moczu leukocyturia i wałeczki leukocytowe, białkomocz. Wskaż nieprawidłową odpowiedź dotyczącą dalszego postępowania:", "hint": "Ostre odmiedniczkowe zapalenie nerek z cechami sepsy/hipowolemii (RR 95/70, odwodnienie) — bezwzględne wskazanie do hospitalizacji; leczenie ambulatoryjne jest NIEPRAWIDŁOWE.", "options": [{"letter": "A", "text": "leczenie objawowe - leki przeciwbólowe, przeciwgorączkowe, przeciwwymiotne, nawadnianie parenteralne", "correct": false}, {"letter": "B", "text": "leczenie ambulatoryjne", "correct": true}, {"letter": "C", "text": "hospitalizacja", "correct": false}, {"letter": "D", "text": "antybiotyk wstępnie empirycznie fluorochinolony lub aminoglikozydy (w mono lub z ampicylinę), lub cefalosporyny III gen., a następne celowana", "correct": false}, {"letter": "E", "text": "pobranie moczu na posiew przed początkiem antybiotykoterapii", "correct": false}], "type": "single"}, {"text": "Najczęstszą postacią zakażeń u noworodków jest:", "hint": "U noworodków najczęstszą postacią zakażenia jest sepsa (wczesna/późna noworodkowa) z powodu niedojrzałości układu immunologicznego i barier ochronnych.", "options": [{"letter": "A", "text": "bakteryjne zapalenie płuc", "correct": false}, {"letter": "B", "text": "zakażenie układu moczowego", "correct": false}, {"letter": "C", "text": "posocznica", "correct": true}, {"letter": "D", "text": "zapalenie opon mózgowo-rdzeniowych", "correct": false}, {"letter": "E", "text": "bakteryjne zapalenie skóry", "correct": false}], "type": "single"}, {"text": "U chłopca odma samoistna 4 cm, był leczony 2 lata temu drenażem z powodu odmy samoistnej po tej samej stronie. Gra na trąbce w orkiestrze. Leczenie w tym przypadku:", "hint": "Nawracająca samoistna odma opłucnowa + podwyższone ryzyko nawrotu (gra na instrumencie dętym) — wskazanie do VATS-bulektomii z pleurodezą.", "options": [{"letter": "A", "text": "drenaż w zniszczeniu ogólnym", "correct": false}, {"letter": "B", "text": "drenaż w zniszczeniu miejscowym", "correct": false}, {"letter": "C", "text": "torakotomia lub torakoskopia z usunięciem pęcherze rozedmowych", "correct": true}, {"letter": "D", "text": "torakotomia zwiadowcza", "correct": false}, {"letter": "E", "text": "torakoskopia z resekcją płuca", "correct": false}], "type": "single"}, {"text": "Do oceny rozwoju płciowego chłopca wykorzystuje się:", "hint": "Orchidometr Pradera — standardowe narzędzie do oceny objętości jąder (>4 ml = początek pokwitania u chłopców wg skali Tannera).", "options": [{"letter": "A", "text": "siatki centylowe", "correct": false}, {"letter": "B", "text": "pomiar wymiaru dwubarkowego kości barkowych", "correct": false}, {"letter": "C", "text": "pomiar wymiaru dwugrzbieniowego kości miednicy", "correct": false}, {"letter": "D", "text": "orchidometer", "correct": true}, {"letter": "E", "text": "stadiometer", "correct": false}], "type": "single"}, {"text": "Krzywica, niedobór witaminu D u 6 miesięcznych niemowląt, nie pasuje:", "hint": "Deformacje kolan (genu varum/valgum) pojawiają się u dzieci po rozpoczęciu chodzenia (>1 roku), a nie w 6. miesiącu życia. U 6-miesięcznego — craniotabes, różaniec krzywiczy, bruzda Harrisona.", "options": [{"letter": "A", "text": "brudzą Harrisona", "correct": false}, {"letter": "B", "text": "rozmiękanie potylicy", "correct": false}, {"letter": "C", "text": "koślawość / szpotawość kolan", "correct": true}, {"letter": "D", "text": "wiotkość mięśni brzucha", "correct": false}, {"letter": "E", "text": "poszerzenie przynasadowych kości długich i chrząstki nasad w RTG", "correct": false}], "type": "single"}, {"text": "Do objawów nadczynności tarczycy nie należą:", "hint": "Obrzęki śluzowate (myxoedema) są objawem HIPOtyreozY. W HIPERtyreozIE — utrata masy ciała, pocenie się, biegunka, tachykardia.", "options": [{"letter": "A", "text": "biegunki", "correct": false}, {"letter": "B", "text": "ciastowate obrzęki", "correct": true}, {"letter": "C", "text": "utrata masy ciała", "correct": false}, {"letter": "D", "text": "potliwość", "correct": false}, {"letter": "E", "text": "nadpobudliwość", "correct": false}], "type": "single"}, {"text": "Nasilenie objawów nadmiernego owłosienia w obszarach skóry zależnych od androgenów, skala?", "hint": "Skala Ferriman-Gallwey ocenia hirsutyzm (owłosienie w 9 strefach androgenozależnych); ≥8 punktów = hirsutyzm.", "options": [{"letter": "A", "text": "POP-Q", "correct": false}, {"letter": "B", "text": "Westa", "correct": false}, {"letter": "C", "text": "Bishopa", "correct": false}, {"letter": "D", "text": "VAS", "correct": false}, {"letter": "E", "text": "Ferrimana-Gallweya", "correct": true}], "type": "single"}, {"text": "Warunkami do usunięcia drenu z jamy opłucnej są:", "hint": "Drenaż usuwa się, gdy WSZYSTKIE warunki są spełnione: płuco rozprężone na RTG, brak przecieku powietrza, ilość wydzieliny <100-200 ml/dobę.", "options": [{"letter": "A", "text": "żadne", "correct": false}, {"letter": "B", "text": "wszystkie", "correct": true}, {"letter": "C", "text": "płyn <100-200 ml", "correct": false}, {"letter": "D", "text": "obraz radiologiczny w pełni rozprężany płuca", "correct": false}, {"letter": "E", "text": "brak przecieku powietrza przez dren", "correct": false}], "type": "single"}, {"text": "Objawem zatoru tętnicy płucnej nie jest:", "hint": "W ZP rozwija się HIPOtensja/wstrząs (niewydolność prawej komory), a nie wzrost ciśnienia. Tachykardia, sinica, duszność, poszerzenie żył szyjnych — typowe.", "options": [{"letter": "A", "text": "sinica i wstrząs", "correct": false}, {"letter": "B", "text": "przyspieszenie oddechu i tętna", "correct": false}, {"letter": "C", "text": "znaczny wzrost ciśnienie tętniczego", "correct": true}, {"letter": "D", "text": "krwioplucie", "correct": false}, {"letter": "E", "text": "poszerzenie żył szyjnych", "correct": false}], "type": "single"}, {"text": "Klasyfikacja Lauren:", "hint": "Klasyfikacja Lauren dzieli raka żołądka na typ jelitowy (intestinal) i rozlany (diffuse) — ważne dla rokowania i postępowania terapeutycznego.", "options": [{"letter": "A", "text": "krwawienie z wzroku żołądka", "correct": false}, {"letter": "B", "text": "uraz dróg żółciowych", "correct": false}, {"letter": "C", "text": "rak żołądka", "correct": true}, {"letter": "D", "text": "rak jelita grubego", "correct": false}, {"letter": "E", "text": "rak piersi", "correct": false}], "type": "single"}, {"text": "W leczeniu sekwencyjnym osteoporozy w drugim etapie, nie zastosuje się:", "hint": "Romosozumab — lek anaboliczny na PIERWSZY etap (12 mies.), następnie przejście na leki antyresorpcyjne (bisfosfoniany, denosumab, raloksyfen) w DRUGIM etapie.", "options": [{"letter": "A", "text": "kwas zoledronowego", "correct": false}, {"letter": "B", "text": "raloksyfenu", "correct": false}, {"letter": "C", "text": "romosozumabu", "correct": true}, {"letter": "D", "text": "ryzedronianu", "correct": false}, {"letter": "E", "text": "denosumabu", "correct": false}], "type": "single"}, {"text": "U pacjenta z encefalopatią nadciśnieniową, niewydolnością wątroby, jaki lek nie zastosujesz żeby zmniejszyć ciśnienie (przy umowie że wszystkie te leki są dostępne):", "hint": "Klonidyna jest przeciwwskazana — działanie ośrodkowo-sedacyjne maskuje objawy encefalopatii nadciśnieniowej. Lekami z wyboru są labetalol i nikardypina i.v. (ESH/ESC 2023). Przy dodatkowej niewydolności wątroby preferuje się nikardypinę (klirens nerkowy) nad labetalol/metoprolol (metabolizm wątrobowy). Cel: obniżenie MAP o ≤25% w 1. godzinie.", "options": [{"letter": "A", "text": "nitroglycerina iv", "correct": false}, {"letter": "B", "text": "klonidyna iv", "correct": true}, {"letter": "C", "text": "labetalol iv", "correct": false}, {"letter": "D", "text": "nikardypin iv", "correct": false}, {"letter": "E", "text": "metoprolol iv", "correct": false}], "type": "single"}, {"text": "Warunkiem do założenia kleszczy nie jest:", "hint": "Do założenia kleszczy wymagane jest WSTAWIENIE główki do miednicy małej (co najmniej na poziomie guzów kulszowych), a nie samo przyparcie do wchodu.", "options": [{"letter": "A", "text": "żywy płód", "correct": false}, {"letter": "B", "text": "całkowite rozwarcie szyjki macicy", "correct": false}, {"letter": "C", "text": "eutroficzny płód, kleszczowa budowa głowy", "correct": false}, {"letter": "D", "text": "główka przyparta do wchodu miednicy", "correct": true}, {"letter": "E", "text": "prawidłowa budowa miednicy", "correct": false}], "type": "single"}, {"text": "Zaburzenia czynności podwgórzowo-przysadkowej połączone z podwyższonej prolaktyn należą według WHO do zaburzeń miesiączków klasy:", "hint": "Według WHO grupa VI — hiperprolaktynemia z dysfunkcją podwzgórzowo-przysadkową bez guza. Grupa V — hiperprolaktynemia z guzem przysadki.", "options": [{"letter": "A", "text": "I", "correct": false}, {"letter": "B", "text": "II", "correct": false}, {"letter": "C", "text": "IV", "correct": false}, {"letter": "D", "text": "VI", "correct": true}, {"letter": "E", "text": "VII", "correct": false}], "type": "single"}, {"text": "Najczęstsza przyczyną choroby Addisona u dzieci w Polsce:", "hint": "W krajach rozwiniętych (w tym Polsce) autoimmunologiczne zapalenie nadnerczy — główna przyczyna choroby Addisona u dzieci i dorosłych, często w ramach APS typu 1 lub 2.", "options": [{"letter": "A", "text": "proces autoimmunologiczny", "correct": true}, {"letter": "B", "text": "gruźlica", "correct": false}, {"letter": "C", "text": "zespół Waterhouse-Friderichsena", "correct": false}, {"letter": "D", "text": "przerzuty neuroblastoma", "correct": false}, {"letter": "E", "text": "ostra białaczka limfoblastyczna", "correct": false}], "type": "single"}, {"text": "Którego zestawu leków nie zastosujesz w leczeniu skojarzonym cukrzycy typu 2:", "hint": "Glimepiryd i gliklazyd — oba preparaty sulfonylomocznikowe (ta sama grupa), NIE należy ich łączyć ze sobą ze względu na nasilenie hipoglikemii bez dodatkowej skuteczności.", "options": [{"letter": "A", "text": "metformin, glimepiryd, gliklazyd", "correct": true}, {"letter": "B", "text": "metformin, empagliflozyn, liraglutyd", "correct": false}, {"letter": "C", "text": "dapagliflozyn, metformin, gliklazyd", "correct": false}, {"letter": "D", "text": "pioglitazon, glimepiryd, metformin", "correct": false}, {"letter": "E", "text": "metformin, akarboza, glimepiryd", "correct": false}], "type": "single"}, {"text": "Do uwarunkowanych monogenowo chorób autosomalnie dominujących należy:", "hint": "Achondroplazja — mutacja FGFR3, dziedziczenie autosomalnie dominujące. Mukowiscydoza — AR, hemofilia A i Duchenne — sprzężone z chromosomem X (rec.), zespół Downa — chromosomowy.", "options": [{"letter": "A", "text": "mukowiscydoza", "correct": false}, {"letter": "B", "text": "hemofilia A", "correct": false}, {"letter": "C", "text": "zespół Downa", "correct": false}, {"letter": "D", "text": "dystrofia mięśniowa Duchenne", "correct": false}, {"letter": "E", "text": "achondroplazja", "correct": true}], "type": "single"}, {"text": "Fałszywe twierdzenie dotyczące działania insuliny w ciąży:", "hint": "Po porodzie zapotrzebowanie na insulinę GWAŁTOWNIE SPADA (o ~50%) z powodu ustąpienia łożyskowych hormonów diabetogennych, a nie wzrasta.", "options": [{"letter": "A", "text": "w drugiej połowie ciąży obserwuje szczyt wydzielania z łożyska hormonów peptydowych prolaktyny i laktoferyna które mają cechy czynników diabetogennych", "correct": false}, {"letter": "B", "text": "nawet krótki głód (do 12h) stanowi bodziec działający wyraźnie lipolitycznie i ketogenne u kobiety w ciąży powoduje poranną acetonuria", "correct": false}, {"letter": "C", "text": "po porodzie zapotrzebowanie na insulinę wzrasta w pierwszej dobie na 50% większy niż przed porodem", "correct": true}, {"letter": "D", "text": "pod wpływem czynników diabetogennych i zwiększenia insulinooporności w celu utrzymania normoglikemii dochodzi do stałego zwiększenia sekrecji insuliny", "correct": false}, {"letter": "E", "text": "mimo mniejszego efektu działania insuliny w drugiej połowie ciąży nadal utrzymuje się tendencja do obniżenia glikemii na czczo obserwowana od pierwszego trzymestru", "correct": false}], "type": "single"}, {"text": "U dziecka wymioty, osłabiony, zmniejszenie diurezy, glukoza 450 mg%, podać w pierwszej kolejności:", "hint": "W DKA u dziecka PIERWSZYM krokiem jest nawodnienie izotonicznym roztworem (0,9% NaCl), a insulinę rozpoczyna się 1 godzinę po rozpoczęciu wlewu.", "options": [{"letter": "A", "text": "nawadnianie i.v", "correct": true}, {"letter": "B", "text": "magnezu siarczan i.v.", "correct": false}, {"letter": "C", "text": "insulin i.v.", "correct": false}, {"letter": "D", "text": "natrium bicarbonicum", "correct": false}, {"letter": "E", "text": "insulina s.c.", "correct": false}], "type": "single"}, {"text": "Dziecko 4 tygodnia, wymiotuje ścisłym mlekiem, ale jest głodny, chętnie je, obniża się go waga, w około prawego nadbrzusza owalny guzek 2-3 cm:", "hint": "Klasyka przerostowego zwężenia odźwiernika: 4.-6. tydzień, wymioty „fontanną\" bezpośrednio po karmieniu, dziecko głodne, wyczuwalne „oliwkowate\" tworzenie w prawym podżebrzu.", "options": [{"letter": "A", "text": "nowotwór jelita cienkiego", "correct": false}, {"letter": "B", "text": "zwężenie odźwiernika", "correct": true}, {"letter": "C", "text": "alergia na mleko", "correct": false}, {"letter": "D", "text": "choroba Hirschsprunga", "correct": false}, {"letter": "E", "text": "pylorospasm", "correct": false}], "type": "single"}, {"text": "Zespół Lericha obejmuje:", "hint": "Zespół Lericha — niedrożność aorty końcowej i tętnic biodrowych; triada: chromanie przestankowe, impotencja, brak tętna na tętnicach udowych.", "options": [{"letter": "A", "text": "zwężenie tętnicy łokciowej", "correct": false}, {"letter": "B", "text": "niedrożność żyły głównej górnej", "correct": false}, {"letter": "C", "text": "zwężenie tętnicy szyjnej wewnętrznej", "correct": false}, {"letter": "D", "text": "występowanie żyły łukowatej tylnej (żyły Leonarda)", "correct": false}, {"letter": "E", "text": "zwężenie lub całkowite zamknięcie końcowego odcinka aorty brzusznej i tętnic biodrowych", "correct": true}], "type": "single"}, {"text": "Najczęstszym nowotworem złośliwym tarczycy jest rak:", "hint": "Rak brodawkowaty — ~80% wszystkich złośliwych nowotworów tarczycy, najlepsze rokowanie, przerzuty do węzłów chłonnych.", "options": [{"letter": "A", "text": "rdzeniasty", "correct": false}, {"letter": "B", "text": "brodawkowaty", "correct": true}, {"letter": "C", "text": "pęcherzykowy", "correct": false}, {"letter": "D", "text": "anaplastyczny", "correct": false}, {"letter": "E", "text": "sygnetowatokomórkowy", "correct": false}], "type": "single"}, {"text": "Przy jakich stanach nie obserwujemy ciastowate obrzęki uogólnione przez obniżone ciśnienie onkotyczne?", "hint": "W niedoczynności tarczycy obrzęki (obrzęk śluzowaty) są spowodowane odkładaniem mukopolisacharydów (kwas hialuronowy) w skórze, a NIE obniżeniem ciśnienia onkotycznego.", "options": [{"letter": "A", "text": "marskość wątroby", "correct": false}, {"letter": "B", "text": "zespół nerczycowy", "correct": false}, {"letter": "C", "text": "niedoczynność tarczycy", "correct": true}, {"letter": "D", "text": "wodobrzusze", "correct": false}, {"letter": "E", "text": "niedożywienie", "correct": false}], "type": "single"}, {"text": "Cukrzyca przedciążowa po 20 r.z. z wywiadem < 10 lat, bez zmian w obrębie naczyń, to cukrzyca:", "hint": "Klasyfikacja White: klasa B — początek po 20. roku życia, czas trwania <10 lat, bez powikłań naczyniowych. Klasa C — 10-19 lat/wiek 10-19. Klasa F — nefropatia.", "options": [{"letter": "A", "text": "F", "correct": false}, {"letter": "B", "text": "C", "correct": false}, {"letter": "C", "text": "R", "correct": false}, {"letter": "D", "text": "A", "correct": false}, {"letter": "E", "text": "B", "correct": true}], "type": "single"}, {"text": "10 letnia dziewczynka wzrost w siatce centylowej mieści na 5 centylu, a masa na 50 centylu. Jakie to dziecko?", "hint": "Wzrost na 5. centylu = niskorosłość, ale masa ciała na 50. centylu dla wieku oznacza nadwagę WZGLĘDEM wzrostu (BMI/masa dla wzrostu są podwyższone).", "options": [{"letter": "A", "text": "z prawidłową masa ciała i niskim wzrostem", "correct": false}, {"letter": "B", "text": "niskie z nadwagą", "correct": true}, {"letter": "C", "text": "z niedoborem masy ciała", "correct": false}, {"letter": "D", "text": "wysokie z nadwagą", "correct": false}, {"letter": "E", "text": "wysokie z niedoborem masy ciała", "correct": false}], "type": "single"}, {"text": "Badanie dziecka na celiakię?", "hint": "Przesiew celiakii — anty-tTG IgA + całkowite IgA. Według nowych zaleceń ESPGHAN przy tTG IgA >10× GGN biopsji można nie wykonywać.", "options": [{"letter": "A", "text": "gastroduodenoskopia", "correct": false}, {"letter": "B", "text": "kalprotektyna w stolcu", "correct": false}, {"letter": "C", "text": "wodorowy test oddechowy", "correct": false}, {"letter": "D", "text": "przeciwciała tkankowej transglutaminazie", "correct": true}, {"letter": "E", "text": "przeciwciała transporterowi cynku (znt8)", "correct": false}], "type": "single"}, {"text": "Zabieg Crede'go to:", "hint": "Chwyt Credégo — wyciśnięcie oddzielonej łożyska przez powłoki brzuszne po uchwyceniu macicy ręką. Stosowany przy zatrzymaniu oddzielenia łożyska.", "options": [{"letter": "A", "text": "ręczne odklejanie łożyska", "correct": false}, {"letter": "B", "text": "masaż macicy przez powłoki brzuszne", "correct": false}, {"letter": "C", "text": "trakcja sznury pępowinowego w celu odklejania łożyska", "correct": false}, {"letter": "D", "text": "podanie 5 jednostek oksytocyny po urodzeniu się dziecka", "correct": false}, {"letter": "E", "text": "próba wyciśnięcia łożyska z macicy po jej uchwyceniu przez powłoki brzuszne", "correct": true}], "type": "single"}, {"text": "69 letnia kobieta z cukrzycą typu II i nadciśnieniem tętniczym była na cmentarzu i poczuła ostry ból w klatce piersiowej który minął sam po sobie. Potem wystąpiły obrzęki kończyn, osłabienie. Na 5 dzień szmery w płucach, duszność. Jakie rozpoznanie?", "hint": "Niemy zawał u cukrzycyka (atypowy ból) z następczym rozwojem NS (obrzęki, duszność, wilgotne rzężenia po kilku dniach) — klasyczny obraz kliniczny u starszych pacjentek z cukrzycą.", "options": [{"letter": "A", "text": "zaostrzenie POCHP", "correct": false}, {"letter": "B", "text": "niewydolność serca z podejrzeniem przebytego zawału", "correct": true}, {"letter": "C", "text": "podejrzenie zatorowości płucnej", "correct": false}, {"letter": "D", "text": "neuralgia międzyżebrowa", "correct": false}, {"letter": "E", "text": "kolka żółciowa", "correct": false}], "type": "single"}, {"text": "Resusc iesiączki, skąpe plamienie, tępy ból w podbrzuszu. Ostry brzuch i omdlenie — objawy pęknięcia.", "options": [{"letter": "A", "text": "1, 2, 3", "correct": false}, {"letter": "B", "text": "2, 3, 4", "correct": true}, {"letter": "C", "text": "2, 3, 5", "correct": false}, {"letter": "D", "text": "3, 4, 5", "correct": false}, {"letter": "E", "text": "1, 2, 5", "correct": false}], "type": "single"}, {"text": "Niedokrwistość z niedoboru żelaza:", "hint": "IDA (niedokrwistość z niedoboru żelaza): ↓ferrytyna (kluczowy marker niedoboru), ↓MCV (mikrocytoza), ↑TIBC, ↑RDW (anizocytoza), ↓retikulocyty (niedokrwistość hipoproliferacyjna).", "options": [{"letter": "A", "text": "↑TIBS, ↓MCV, ↑retikulocyty, ↑RDW, ↑ferrytyna", "correct": false}, {"letter": "B", "text": "↑TIBS, ↓MCV, ↑retikulocyty, ↑RDW, ↓ferrytyna", "correct": false}, {"letter": "C", "text": "↑TIBS, ↓MCV, ↑retikulocyty, ↑RDW, ↑ferrytyna", "correct": false}, {"letter": "D", "text": "↑TIBS, ↓MCV, ↓retikulocyty, ↑RDW, ↓ferrytyna", "correct": true}, {"letter": "E", "text": "↑TIBS, ↓MCV, ↑retikulocyty, ↑RDW, ↑ferrytyna", "correct": false}], "type": "single"}, {"text": "Jak ocenimy rezerwę jajnikową?", "hint": "AMH — najlepszy marker rezerwy jajnikowej: wytwarzany przez komórki ziarniste pęcherzyków antralnych, niezależny od fazy cyklu. FSH — mniej precyzyjny (tylko we wczesnej fazie folikularnej).", "options": [{"letter": "A", "text": "AMH", "correct": true}, {"letter": "B", "text": "estradiol", "correct": false}, {"letter": "C", "text": "LH", "correct": false}, {"letter": "D", "text": "FSH", "correct": false}, {"letter": "E", "text": "17-OH-progesteron", "correct": false}], "type": "single"}, {"text": "Najczęstszy rak jelita grubego:", "hint": "Najczęstsza lokalizacja raka jelita grubego — odbytnica (30%) i esica (25%). Odcinki dystalne zajmowane są częściej niż proksymalne.", "options": [{"letter": "A", "text": "odbytnica", "correct": true}, {"letter": "B", "text": "okrężnica", "correct": false}, {"letter": "C", "text": "esica", "correct": false}, {"letter": "D", "text": "poprzecznica", "correct": false}, {"letter": "E", "text": "wstępnica", "correct": false}], "type": "single"}, {"text": "Pierwotna niedoczynność tarczycy:", "hint": "Pierwotna niedoczynność tarczycy = uszkodzenie samej tarczycy → ↓T3, ↓T4, kompensacyjne ↑TSH. Wtórna/trzeciorzędowa (przysadka/podwzgórze) — niskie lub prawidłowe TSH przy niskich T3/T4.", "options": [{"letter": "A", "text": "↑TSH, ↑T3, ↑T4", "correct": false}, {"letter": "B", "text": "↓TSH, ↑T3, ↑T4", "correct": false}, {"letter": "C", "text": "↓TSH, ↓T3, ↑T4", "correct": false}, {"letter": "D", "text": "↓TSH, ↓T3, ↓T4", "correct": false}, {"letter": "E", "text": "↑TSH, ↓T3, ↓T4", "correct": true}], "type": "single"}, {"text": "Wskaż prawdziwe stwierdzenie dotyczące niepowściągliwych wymiotów ciężarnych:", "hint": "HG (hyperemesis gravidarum): wymioty z utratą m.c. >5%, ketonurią, ↓K, ↑hCG; zwykle 4.–16. tc. Leczenie (ACOG/NICE 2024): nawodnienie i.v. + doksylamina 10 mg + pirydoksyna 10 mg (lek z wyboru) + metoklopramid/ondansetron. Tiamina 100 mg i.v. OBOWIĄZKOWO — profilaktyka encefalopatii Wernickego. Czynniki ryzyka: GTD, ciąża mnoga, hipertyreoza, NISKIE BMI (NIE otyłość). UWAGA: opcja „c\\\" (encefalopatia Wernickego) jest też prawdą.", "options": [{"letter": "A", "text": "pojawiają się przed 16 tyg. ciąży, sprzyjają utracie m.c. do 5%, rozwija się ketonuria", "correct": false}, {"letter": "B", "text": "ustępują po 20 t.c.", "correct": false}, {"letter": "C", "text": "sprzyjają rozwoju encefalopatii Wernickego", "correct": false}, {"letter": "D", "text": "ryzyko wystąpienia: otyłość, nadczynność tarczycy", "correct": false}, {"letter": "E", "text": "leczenie — płynoterapia, ale też leki przeciwhistaminowe, na przykład doksylamina", "correct": true}], "type": "single"}, {"text": "Młody mężczyzna, silny ból brzucha, 5/10, nie ustępuje przy zmianie pozycji ciała, nie może go zlokalizować. Jaki to ból?", "hint": "Ból trzewny — rozlany, słabo lokal B", "text": "wada wrodzona polegająca na rozszczepie cewki moczowej z ujściem na grzbietowej stronie prącia", "correct": false}, {"letter": "C", "text": "wada rozwojowa polegająca na braku wykształcenia odcinka końcowego cewki moczowej", "correct": true}, {"letter": "D", "text": "brak jednego lub obu jąder", "correct": false}, {"letter": "E", "text": "żadne z powyższych", "correct": false}], "type": "single"}, {"text": "Najczęstsze nowotwory u dzieci Europy?", "hint": "Białaczki (głównie ALL) — ~30% wszystkich nowotworów u dzieci w Europie. Na 2. miejscu — guzy OUN, na 3. — chłoniaki.", "options": [{"letter": "A", "text": "retinoblastoma", "correct": false}, {"letter": "B", "text": "białaczka", "correct": true}, {"letter": "C", "text": "neuroblastoma", "correct": false}, {"letter": "D", "text": "nefroblastoma", "correct": false}, {"letter": "E", "text": "guz Brennera", "correct": false}], "type": "single"}, {"text": "Siniczy bolesny obrzęk kończyny (phlegmasia caerulea dolens) spowodowany jest:", "hint": "Phlegmasia caerulea dolens — masywna zakrzepica biodrowo-udowa Z ZAJĘCIEM krążenia obocznego (żył powierzchownych), prowadząca do zgorzeli żylnej. Zagraża życiu i kończynie.", "options": [{"letter": "A", "text": "zatorem", "correct": false}, {"letter": "B", "text": "zakrzepem jednego z ramion protezy aortalno-dwuudowej", "correct": false}, {"letter": "C", "text": "obrzękiem limfatycznym", "correct": false}, {"letter": "D", "text": "zakrzepicą żylaków kończyn dolnych", "correct": false}, {"letter": "E", "text": "uogólnioną zakrzepicą żył powierzchownych i głębokich", "correct": true}], "type": "single"}, {"text": "Zespół Zollingera-Ellisona. Jakie objawy? nadmierna sekrecja kwasu solnego oporność na leczenie wrzodów biegunka zgaga ból brzucha spadek masy ciała krwawienia", "hint": "Klasyczna diada ZES (zespół Zollingera-Ellisona) — hipersekrecja HCl (z powodu gastryny) + oporne, mnogie/atypowo umiejscowione wrzody (w tym jelita czczego). Biegunka jest również częstym objawem.", "options": [{"letter": "A", "text": "1,2", "correct": true}, {"letter": "B", "text": "2,3", "correct": false}, {"letter": "C", "text": "3,4", "correct": false}, {"letter": "D", "text": "4,5", "correct": false}, {"letter": "E", "text": "1,5", "correct": false}], "type": "single"}, {"text": "Jakie nie są objawy zatorowości płucnej?", "hint": "W ZP zawsze TAchykardia (kompensacyjna), a nie bradykardia. Bradykardia może wystąpić tylko w fazie preterminalnej (zatrzymanie krążenia PEA).", "options": [{"letter": "A", "text": "nitkowate tętno", "correct": false}, {"letter": "B", "text": "sinica górnej połowy ciała", "correct": false}, {"letter": "C", "text": "tachikardia", "correct": false}, {"letter": "D", "text": "hipotonia", "correct": false}, {"letter": "E", "text": "bradykardia", "correct": true}], "type": "single"}, {"text": "Główka w kanale rodnym dokonuje podczas porodu fizjologicznego następujących zwrotów:", "hint": "Biomechanizm porodu przy ułożeniu potylicowym: 1) zgięcie główki, 2) obrót wewnętrzny, 3) odgięcie (urodzenie główki), 4) obrót zewnętrzny główki/wewnętrzny barków.", "options": [{"letter": "A", "text": "przygięcie, odgięcie, obrót, obrót", "correct": false}, {"letter": "B", "text": "odgięcie, obrót, przygięcie, obrót", "correct": false}, {"letter": "C", "text": "przygięcie, obrót, obrót, odgięcie", "correct": false}, {"letter": "D", "text": "obrót, przygięcie, odgięcie, obrót", "correct": false}, {"letter": "E", "text": "przygięcie, obrót, odgięcie, obrót", "correct": true}], "type": "single"}, {"text": "Udar maciczno-łożyskowy:", "hint": "Apopleksja maciczno-łożyskowa (macica Couvelaire'a) — przesiąkanie krwią miometrium przy ciężkim przedwczesnym oddzieleniu łożyska, może prowadzić do DIC i krwotoku atonicznego.", "options": [{"letter": "A", "text": "wylew w mięsień macicy przez oddzielenie łożyska", "correct": true}, {"letter": "B", "text": "przedwczesne pęknięcie błon płodowych", "correct": false}, {"letter": "C", "text": "prowadzi do DIC", "correct": false}, {"letter": "D", "text": "potrzebuje obserwacji", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Z czym powiązane rozwarstwienie aorty?", "hint": "NT — główny czynnik ryzyka rozwarstwienia aorty (70-80% przypadków). Inne: zespół Marfana, Ehlersa-Danlosa, dwupłatkowa zastawka aortalna, uraz, kokaina.", "options": [{"letter": "A", "text": "z nadciśnieniem tętniczym", "correct": true}, {"letter": "B", "text": "nagły wzrost ciśnienia w krążeniu płucnym", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Czym jest zespół pustego serca, przyczyny?", "hint": "Zespół „pustego serca\" — radiologiczny obraz zmniejszonego cienia serca przy ciężkiej hipowolemii (masywna utrata krwi, wstrząs). Opcje niepełne.", "options": [{"letter": "A", "text": "obraz na RTG — nie widno sylwetki serca", "correct": true}, {"letter": "B", "text": "?", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Ostre zapalenie uchyłków — najczęstsze powikłanie?", "hint": "Ropień — najczęstsze powikłanie ostrego zapalenia uchyłków (~15-20%), klasyfikacja Hinchey I-II. Wolna perforacja i zapalenie otrzewnej — rzadziej, ale groźniejsze.", "options": [{"letter": "A", "text": "ropień", "correct": true}, {"letter": "B", "text": "mikroperforacja", "correct": false}, {"letter": "C", "text": "zrosy", "correct": false}, {"letter": "D", "text": "zapalenie otrzewnej", "correct": false}, {"letter": "E", "text": "niedrożność jelitowa", "correct": false}], "type": "single"}, {"text": "Niemiarowość zupełna w EKG oznacza:", "hint": "„Całkowita niemiarowość\" (arrhythmia absoluta) = bezwzględnie nieregularne odstępy R-R + brak załamków P — charakterystyczna dla migotania przedsionków.", "options": [{"letter": "A", "text": "całkowicie nieprawidłowe odstępy RR, charakterystyczne dla migotania przedsionków", "correct": true}, {"letter": "B", "text": "tachikardia", "correct": false}, {"letter": "C", "text": "bradykardia", "correct": false}, {"letter": "D", "text": "częściowo nieprawidłowe odstępy RR", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Kobieta z biegunką, ustępuje po IPP:", "hint": "Biegunka ustępująca po IPP — patognomiczne dla gastrinomy (zespół Zollingera-Ellisona). Nadmierny gastryna → hipersekrecja HCl → uszkodzenie śluzówki jelita cienkiego + inaktywacja lipaz → tłuszczowa biegunka i wrzody oporne na leczenie. IPP blokuje hipersekrecję HCl → ustępuje biegunka. Glukagonoma powoduje cukrzycę i nekrotyczny rumień wędrujący (4D: Dermatitis, Diabetes, DVT, Depression) — NIE biegunkę zależną od IPP. UWAGA: pełna lista opcji nieznana — opcja „e\\\" ustawiona jako [AI].", "options": [{"letter": "A", "text": "glukagonoma", "correct": false}, {"letter": "B", "text": "WZJG", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "gastrinoma (ZZE) [AI]", "correct": true}], "type": "single"}, {"text": "Złamanie Galeazziego dotyczy:", "hint": "Złamanie Galeazziego = złamanie dalszej 1/3 kości promieniowej + zwichnięcie w dystalnym stawie promieniowo-łokciowym. Złamanie Monteggia (lustrzane) — złamanie kości łokciowej + zwichnięcie głowy kości promieniowej.", "options": [{"letter": "A", "text": "złamania trzonu kości promieniowej w jej 1/3 dalszej części, z jednoczesnym zwichnięciem stawu promieniowo-łokciowego dalszego", "correct": true}, {"letter": "B", "text": "?", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Najczęstszy rak wątroby?", "hint": "HCC (rak wątrobowokomórkowy) — najczęstszy pierwotny nowotwór wątroby (~85-90%). Główne czynniki ryzyka: marskość wątroby każdej etiologii, HBV, HCV, alkohol, NAFLD.", "options": [{"letter": "A", "text": "HCC — Rak wątrobowokomórkowy", "correct": true}, {"letter": "B", "text": "?", "correct": false}, {"letter": "C", "text": "?", "correct": false}, {"letter": "D", "text": "?", "correct": false}, {"letter": "E", "text": "?", "correct": false}], "type": "single"}, {"text": "Różyczka u noworodka — profilaktyka, szczepienie dzieci?", "hint": "Profilaktyka wrodzonej różyczki — masowe szczepienia MMR dzieci i weryfikacja odporności kobiet przed ciążą. Szczepionka w ciąży jest PRZECIWWSKAZANA (żywa atenuowana).", "options": [{"letter": "129", "text": "Różyczka u noworodka — profilaktyka, szczepienie dzieci?", "correct": false}], "correct_text": "Profilaktyka — szczepienie MMR (świnka-odra-różyczka). W Polsce: I dawka w 13-14 m.ż., II dawka w 6 r.ż. Szczepionka żywa atenuowana, przeciwwskazana w ciąży. Zapobiega różyczce wrodzonej (CRS).", "type": "reveal_with_options"}, {"text": "Jaki oocyt po oddzieleniu pierwszego ciałka kierunkowego?", "hint": "Po odłączeniu 1. ciałka kierunkowego oocyt I rzędu staje się OOCYTEM II RZĘDU (haploidalny 23, 2c), który zatrzymuje się w metafazie II do momentu zapłodnienia.", "options": [{"letter": "130", "text": "Jaki oocyt po oddzieleniu pierwszego ciałka kierunkowego?", "correct": false}], "correct_text": "Oocyt II rzędu (drugiego rzędu) — zatrzymany w metafazie II mejozy. Ukończenie mejozy II następuje dopiero po zapłodnieniu z wytworzeniem drugiego ciałka kierunkowego.", "type": "reveal_with_options"}, {"text": "Ocenianie ukrwienia kończyny — palpacja na różnych tętnicach — jakich?", "hint": "Do oceny ukrwienia kończyny dolnej palpuje się kolejno: tętnicę udową, podkolanową, piszczelową tylną i grzbietową stopy. Dla kończyny górnej — ramienną, promieniową, łokciową.", "options": [{"letter": "131", "text": "Ocenianie ukrwienia kończyny — palpacja na różnych tętnicach — jakich?", "correct": false}], "correct_text": "Kończyna dolna: t. udowa (a. femoralis), t. podkolanowa (a. poplitea), t. piszczelowa tylna (a. tibialis posterior — za kostką przyśrodkową), t. grzbietowa stopy (a. dorsalis pedis). Kończyna górna: t. ramienna, t. promieniowa, t. łokciowa.", "type": "reveal_with_options"}, {"text": "Operacja przy otyłości — jelitowo-jelitowo-jelitowo — z bazy (Roux-en-Y)", "hint": "Bypass żołądkowy Roux-en-Y: wytworzenie małego zbiornika żołądkowego + zespolenie jelita czczego w kształcie litery Y. Kombinacja mechanizmu restrykcyjnego i upośledzonego wchłaniania w redukcji masy ciała.", "options": [{"letter": "132", "text": "Operacja przy otyłości — jelitowo-jelitowo-jelitowo — z bazy (Roux-en-Y)", "correct": false}], "correct_text": "Roux-en-Y gastric bypass (RYGB) — wyłączenie żołądkowe z zespoleniem typu Roux-Y. Tworzy się mały zbiornik żołądkowy zespolony z pętlą jelita czczego (Roux), a pozostała część dwunastnicy/jelita czczego z sokami trawiennymi zespala się \"bok do boku\" niżej, tworząc kształt Y.", "type": "reveal_with_options"}, {"text": "Dziecko hipoglikemia w świadomości — sok?", "hint": "W hipoglikemii u dziecka PRZYTOMNEGO — reguła 15: 15 g szybkich węglowodanów doustnie (sok, glukoza), pomiar glikemii powtórzyć po 15 min. Glukagon tylko przy utracie przytomności.", "options": [{"letter": "133", "text": "Dziecko hipoglikemia w świadomości — sok?", "correct": false}], "correct_text": "TAK — przytomne dziecko z hipoglikemią: 10-15 g szybko wchłanianych węglowodanów doustnie (sok owocowy, glukoza w tabletkach, miód). Po 15 min — kontrola glikemii. Glukagon zarezerwowany dla NIEPRZYTOMNYCH.", "type": "reveal_with_options"}, {"text": "Szwy na szyjce macicy — kiedy nakładamy? Niewydolności cieśniowo-szyjkowej (anamneza późnych poronień / przedwczesnych porodów) Skrócenie szyjki <25 mm w II trymestrze + wywiad przedwczesnego porodu Profilaktycznie 12-14 t.c.; ratowniczo do 24 t.c. (rescue cerclage)", "hint": "Szew szyjki macicy (cerklarz) wskazany przy niewydolności cieśniowo-szyjkowej: profilaktycznie w 12-14 tyg. przy obciążonym wywiadzie, przy skróceniu szyjki macicy <25 mm w II trymestrze lub ratunkowy (rescue) do 24 tyg.", "options": [{"letter": "134", "text": "Szwy na szyjce macicy — kiedy nakładamy?", "correct": false}], "correct_text": "Cerclage szyjki macicy (np. McDonald, Shirodkar) zakładamy przy:", "type": "reveal_with_options"}, {"text": "Homans — kiedy?", "hint": "Objaw Homansa (ból łydki przy grzbietowym zgięciu stopy) stosowano przy podejrzeniu zakrzepicy żył głębokich podudzia. W nowoczesnej praktyce nieprzydatny z powodu niskiej czułości — zastąpiony skalą Wells + D-dimerem + USG.", "options": [{"letter": "135", "text": "Homans — kiedy?", "correct": false}], "correct_text": "Objaw Homansa — ból w łydce przy zgięciu grzbietowym stopy, badamy przy podejrzeniu zakrzepicy żył głębokich (ZŻG). UWAGA: ma niską czułość i swoistość (~40-50%), nie jest wystarczający do rozpoznania ZŻG, dziś rzadko stosowany.", "type": "reveal_with_options"}, {"text": "Skala CHADS-VASc C — Congestive HF (1 pkt) H — Hypertension (1 pkt) A₂ — Age ≥75 (2 pkt) D — Diabetes (1 pkt) S₂ — Stroke/TIA/zator (2 pkt) V — Vascular disease (1 pkt) A — Age 65-74 (1 pkt) Sc — Sex category (kobieta) (1 pkt)", "hint": "CHA₂DS₂-VASc ocenia ryzyko udaru w migotaniu przedsionków. Antykoagulanty wskazane przy ≥2 u mężczyzn i ≥3 u kobiet (płeć żeńska sama w sobie — 1 punkt, ale nieuwzględniana izolowanie).", "options": [{"letter": "136", "text": "Skala CHADS-VASc", "correct": false}], "correct_text": "CHA₂DS₂-VASc — szacuje ryzyko udaru u pacjentów z migotaniem przedsionków:Antykoagulacja: ≥2 pkt u mężczyzn, ≥3 pkt u kobiet.", "type": "reveal_with_options"}, {"text": "Wierzchołkowe ułożenie", "hint": "Ułożenie potylicowe (szczytowe) — norma: główka maksymalnie zgięta, punkt prowadzący — małe ciemiączko, przewodnik o obwodzie 32 cm. Ułatwia przejście przez kanał rodny.", "options": [{"letter": "137", "text": "Wierzchołkowe ułożenie", "correct": false}], "correct_text": "Ułożenie wierzchołkowe (potylicowe) — najczęstsze i fizjologiczne ułożenie płodu: główka mocno przygięta do klatki piersiowej, brodą do mostka, punkt prowadzący — ciemiączko tylne (potyliczne małe). Najmniejszy obwód główki przechodzącej przez kanał rodny (32 cm).", "type": "reveal_with_options"}], "Jesień ZG 2025": [{"text": "Ciężarna: 26 t.c. Test OGTT: glukoza na czczo 90, po 1h — 195, po 2h — 140. Jakie powinny być wartości glikemii w dalszej kontroli u tej pacjentki?", "hint": "GDM wg OGTT: na czczo ≥92, 1h ≥180, 2h ≥153 — wystarczy jedna nieprawidłowa wartość. Cele dla GDM: na czczo <90 mg/dl, 1h po posiłku <140 mg/dl, 2h <120 mg/dl.", "options": [{"letter": "A", "text": "Nie wymaga kontroli — wyniki norma", "correct": false}, {"letter": "B", "text": "Glikemia na czczo <90, 1h po posiłku <140", "correct": true}, {"letter": "C", "text": "Glikemia na czczo <125, 1h po posiłku <200 mg/dl", "correct": false}, {"letter": "D", "text": "Rozpoznanie — łagodna postać cukrzycy ciążowej, leczenie — dieta", "correct": false}, {"letter": "E", "text": "Rozpoznajemy IFG i zalecamy zgłosić się do diabetologa po zakończeniu ciąży", "correct": false}], "type": "single"}, {"text": "Ciąża bliźniacza dwuzygotyczna, dwukosmówkowa, dwuowodniowa powstała w wyniku zapłodnienia:", "hint": "Bliźnięta dwuzygotyczne = 2 komórki jajowe + 2 plemniki → zawsze DCDA (dwukosmówkowa, dwuowodniowa). Jednozygotyczne mogą być DCDA, MCDA lub MCMA w zależności od czasu podziału zygoty.", "options": [{"letter": "A", "text": "Jednej komórki jajowej przez 2 plemniki", "correct": false}, {"letter": "B", "text": "2 komórek jajowych przez 1 plemnik", "correct": false}, {"letter": "C", "text": "Jednej komórki jajowej przez 1 plemnik", "correct": false}, {"letter": "D", "text": "2 komórek jajowych przez 2 plemniki", "correct": true}], "type": "single"}, {"text": "Które z wymienionych ostrych powikłań są charakterystyczne dla cukrzycy typu 1?", "hint": "DKA — typowe ostre powikłanie T1DM (bezwzględny niedobór insuliny → lipoliza → ketony). HHS — typowy dla T2DM (zachowana resztkowa insulinemia hamująca ketogenezę).", "options": [{"letter": "A", "text": "Stan hiperglikemiczno-hiperosmolarny", "correct": false}, {"letter": "B", "text": "Wstrząs hiperglikemiczny", "correct": false}, {"letter": "C", "text": "Zasadowica oddechowa", "correct": false}, {"letter": "D", "text": "Śpiączka mleczanowa", "correct": false}, {"letter": "E", "text": "Cukrzycowa kwasica ketonowa", "correct": true}], "type": "single"}, {"text": "Glikemicznym celem leczenia w cukrzycy typu 1 jest uzyskanie wartości HbA1c:", "hint": "PTD 2024 — ogólny cel HbA1c ≤7,0% dla większości dorosłych z cukrzycą. Bardziej rygorystyczny cel ≤6,5% — dla T1DM o krótkim czasie trwania; ≤8% — dla osób starszych z powikłaniami.", "options": [{"letter": "A", "text": "<6%", "correct": false}, {"letter": "B", "text": "<6,5%", "correct": false}, {"letter": "C", "text": "<8%", "correct": false}, {"letter": "D", "text": "<7%", "correct": true}, {"letter": "E", "text": "<7,5%", "correct": false}], "type": "single"}, {"text": "Czynniki sprzyjające obrzękowi mózgu w cukrzycowej kwasicy ketonowej:", "hint": "Wszystkie wymienione czynniki zwiększają ryzyko obrzęku mózgu w DKA: młody wiek, wczesne włączenie insuliny, szybki spadek osmolalności, nadmierna płynoterapia (>4 L/m²), zbyt szybkie obniżanie glikemii (>100 mg/dl/h). Dlatego glikemię obniża się stopniowo (~50 mg/dl/h).", "items": ["Młody wiek dziecka", "Wczesne zastosowanie insulinoterapii (od pierwszej godziny leczenia)", "Szybkie obniżenie osmolalności", "Podaż płynów dożylnych >4000 ml/m²", "Obniżanie stężenia glukozy o 80 mg% (3,5 mmol/l) na godzinę"], "options": [{"letter": "A", "text": "2, 3, 4", "correct": false}, {"letter": "B", "text": "1, 3, 4", "correct": false}, {"letter": "C", "text": "3, 4, 5", "correct": false}, {"letter": "D", "text": "1, 2, 3, 4", "correct": false}, {"letter": "E", "text": "1, 2, 3, 4, 5", "correct": true}], "type": "single"}, {"text": "U 17-letniego chłopca z cukrzycą typu 1 na wycieczce rowerowej doszło do hipoglikemii, stężenie glukozy 68 mg%. Chłopiec przytomny, ma zawroty głowy. Postępowanie:", "hint": "Reguła 15/15: pacjent przytomny → 15 g węglowodanów prostych p.o., kontrola glikemii po 15 min. Glukagon i.m. — tylko przy utracie przytomności.", "options": [{"letter": "A", "text": "Wezwać pogotowie", "correct": false}, {"letter": "B", "text": "Spożyć produkt zawierający 15 g glukozy", "correct": true}, {"letter": "C", "text": "Podać sobie odpowiednią dawkę insuliny", "correct": false}, {"letter": "D", "text": "Podać sobie zastrzyk z 1 mg glukagonu", "correct": false}, {"letter": "E", "text": "Udać się do poradni diabetologicznej", "correct": false}], "type": "single"}, {"text": "Chory z niewydolnością serca i cukrzycą typu 2 — nie należy stosować:", "hint": "Pioglitazon (TZD) — przeciwwskazany w HF (retencja płynów, zaostrzenie HF). Empagliflozyna i pozostałe SGLT2i są wręcz rekomendowane w HF (poprawiają rokowanie).", "options": [{"letter": "A", "text": "Akarbozy", "correct": false}, {"letter": "B", "text": "Glimepirydu", "correct": false}, {"letter": "C", "text": "Pioglitazonu", "correct": true}, {"letter": "D", "text": "Empagliflozyny", "correct": false}, {"letter": "E", "text": "Semaglutydu", "correct": false}], "type": "single"}, {"text": "Czynniki ryzyka zachorowania na raka płuca:", "hint": "Główny czynnik — tytoń (~85%), następnie ekspozycja zawodowa/środowiskowa (azbest, radon) oraz czynniki dziedziczne. UV i otyłość NIE są czynnikami ryzyka raka płuca.", "items": ["Promieniowanie UV, solaria", "Dziedziczenie", "Otyłość", "Tytoń", "Czynniki zawodowe, środowiskowe"], "options": [{"letter": "A", "text": "1, 2, 3", "correct": false}, {"letter": "B", "text": "2, 3, 4, 5", "correct": false}, {"letter": "C", "text": "2, 4, 5", "correct": true}, {"letter": "D", "text": "1, 4, 5", "correct": false}], "type": "single"}, {"text": "U pacjenta po przeszczepieniu nerki rozpoznano zapalenie płuc prawostronne. Po celowanej antybiotykoterapii pacjent gorączkuje 5. dobę. Stosowaną antybiotykoterapię należy:", "hint": "U pacjentów w immunosupresji (po transplantacji) przy utrzymującej się gorączce mimo celowanej antybiotykoterapii — należy podejrzewać zakażenie grzybicze (Aspergillus, Pneumocystis). Antybiotyku się nie odstawia, dodaje się lek przeciwgrzybiczny.", "options": [{"letter": "A", "text": "Kontynuować i dodatkowo zastosować lek przeciwgrzybiczny", "correct": true}, {"letter": "B", "text": "Odstawić, pobrać krew na posiewy i podać nowe antybiotyki dobrane empirycznie", "correct": false}, {"letter": "C", "text": "Odstawić i zastosować lek przeciwgrzybiczny", "correct": false}, {"letter": "D", "text": "Kontynuować do 7. doby; jeżeli nadal gorączka — zmienić na antybiotyki dobrane empirycznie i powtórzyć posiewy", "correct": false}, {"letter": "E", "text": "Kontynuować, ponieważ jest zgodna z antybiogramem", "correct": false}], "type": "single"}, {"text": "Objawy radiologiczne uszkodzenia przepony:", "hint": "Wszystkie wymienione objawy są klasycznymi cechami radiologicznymi pęknięcia przepony: uniesienie kopuły, pętle jelita/żołądka w jamie opłucnej, zgłębnik NG widoczny powyżej przepony, zatarcie obrysu przepony.", "options": [{"letter": "A", "text": "Uniesienie kopuły przepony, przesunięcie śródpiersia", "correct": false}, {"letter": "B", "text": "Jelito, żołądek widoczny w lewej jamie opłucnej", "correct": false}, {"letter": "C", "text": "Zgłębnik żołądkowy widoczny powyżej przepony", "correct": false}, {"letter": "D", "text": "Zatarcie obrysu przepony i niedodma płuca", "correct": false}, {"letter": "E", "text": "Wszystkie odpowiedzi są prawidłowe", "correct": true}], "type": "single"}, {"text": "W trakcie cholecystektomii laparoskopowej — podejrzenie raka pęcherzyka żółciowego:", "hint": "Przy śródoperacyjnym podejrzeniu raka pęcherzyka żółciowego — konwersja do operacji otwa , "Zaprzestanie picia alkoholu i palenia tytoniu", "Wyrównywanie zaburzeń gospodarki węglowodanowej"], "options": [{"letter": "A", "text": "1, 2, 3, 4, 5", "correct": true}, {"letter": "B", "text": "1, 2", "correct": false}, {"letter": "C", "text": "2, 3, 5", "correct": false}, {"letter": "D", "text": "1, 2, 4", "correct": false}, {"letter": "E", "text": "2, 3, 4, 5", "correct": false}], "type": "single"}, {"text": "U chorych z PZT — leczenie inwazyjne endoskopowe z wyjątkiem:", "hint": "Złogów >5 mm w przewodzie Wirsunga nie da się usunąć endoskopowo — konieczna jest wcześniejsza ESWL lub leczenie operacyjne. Endoskopowo można leczyć: torbiele rzekome, zwężenia (stenty), sfinkterotomia, drobne złogi.", "options": [{"letter": "A", "text": "Leczenia torbieli rzekomych", "correct": false}, {"letter": "B", "text": "Wprowadzenia stentu do przewodu trzustkowego", "correct": false}, {"letter": "C", "text": "Leczenia zwężenia przewodu żółciowego wspólnego", "correct": false}, {"letter": "D", "text": "Sfinkterotomii brodawki większej dwunastnicy", "correct": false}, {"letter": "E", "text": "Usunięcia złogów o średnicy >5 mm z przewodu trzustkowego", "correct": true}], "type": "single"}, {"text": "Łagodny przebieg ostrego zapalenia trzustki. Postępowanie:", "hint": "OZT (nawet łagodne) = hospitalizacja + płynoterapia (mleczan Ringera; wg WATERFALL 2022 NEJM preferowana moderate resuscytacja — bolus 10 ml/kg + 1,5 ml/kg/h, bezpieczniejsza niż agresywna 5–10 ml/kg/h) + analgezja + wczesne żywienie p.o. w ciągu 24–48 h po ustąpieniu nudności. Antybiotyki — tylko przy zakażonej martwicy (nie profilaktycznie).", "options": [{"letter": "A", "text": "Leczenie ambulatoryjne, leki prokinetyczne, antybiotykoterapia", "correct": false}, {"letter": "B", "text": "Leczenie ambulatoryjne, antybiotykoterapia, leki przeciwbólowe", "correct": false}, {"letter": "C", "text": "Hospitalizacja, płynoterapia dożylna, leki przeciwbólowe, wstrzymanie żywienia doustnego", "correct": true}, {"letter": sowany w leczeniu CML.", "options": [{"letter": "A", "text": "Metotreksat", "correct": true}, {"letter": "B", "text": "Interferon alfa", "correct": false}, {"letter": "C", "text": "Allo-HCT", "correct": false}, {"letter": "D", "text": "Imatynib (Glivec)", "correct": false}, {"letter": "E", "text": "Hydroksymocznik (hydroksykarbamid)", "correct": false}], "type": "single"}, {"text": "U 55-letniego mężczyzny z alkoholową marskością wątroby stwierdzono guz prawego płata wątroby i podwyższone stężenie alfa-fetoproteiny. Najbardziej prawdopodobne rozpoznanie:", "hint": "HCC = marskość wątroby (o dowolnej etiologii) + guz + ↑AFP. AFP >400 ng/ml w marskiej wątrobie jest praktycznie diagnostyczne. Marskość alkoholowa — wiodący czynnik ryzyka HCC w Polsce.", "options": [{"letter": "A", "text": "Naczyniak wątroby", "correct": false}, {"letter": "B", "text": "Rak z komórek wątrobowych", "correct": true}, {"letter": "C", "text": "Nasieniak o nietypowym umiejscowieniu", "correct": false}, {"letter": "D", "text": "Przerzut raka z jelita grubego", "correct": false}, {"letter": "E", "text": "Regenerujący guzek w marskiej wątrobie", "correct": false}], "type": "single"}, {"text": "Próba samobójcza — 20 tabletek paracetamolu po 500 mg. Lek z wyboru:", "hint": "10 g paracetamolu = dawka toksyczna. Antidotum: NAC (odtwarza pulę glutationu → detoksykacja NAPQI). Najskuteczniejsza w pierwszych 8–10 h od zatrucia.", "options": [{"letter": "A", "text": "Nalokson", "correct": false}, {"letter": "B", "text": "Atropina", "correct": false}, {"letter": "C", "text": "Pralidoksym", "correct": false}, {"letter": "D", "text": "N-acetylocysteina", "correct": true}, {"letter": "E", "text": "Fizostygmina", "correct": false}], "type": "single"}, {"text": "Ojciec 8-letniej dziewczynki choruje na hipercholesterolemię rodzinną (AD). Ryzyko wystąpienia tej choroby u dziecka wynosi:", "hint": "Dziedziczenie autosomalne dominujące (rodzic heterozygotyczny) → 50% ryzyko dla każdego dziecka. FH — najczęściej mutacja genu LDLR.", "options": [{"letter": "A", "text": "25%", "correct": false}, {"letter": "B", "text": "100%", "correct": false}, {"letter": "C", "text": "50%", "correct": true}, {"letter": "D", "text": "75%", "correct": false}, {"letter": "E", "text": "1%", "correct": false}], "type": "single"}, {"text": "Powikłania, które mogą wystąpić po doraźnym zaopatrzeniu uszkodzonego miąższu płuca:", "hint": "Po urazie płuca mogą wystąpić: torbiel rzekoma pourazowa, przetoka tętniczo-żylna, ropień płuca, przedłużony przeciek powietrza, niedodma — wszystkie wymienione są możliwymi powikłaniami.", "options": [{"letter": "A", "text": "Rzekoma torbiel pourazowa i przetoka tętniczo-żylna", "correct": false}, {"letter": "B", "text": "Zakażenie z powstaniem ropnia płuca", "correct": false}, {"letter": "C", "text": "Przedłużony przeciek powietrza i niedodma", "correct": false}, {"letter": "D", "text": "Wszystkie odpowiedzi są poprawne", "correct": true}, {"letter": "E", "text": "Żadna odpowiedź nie jest prawidłowa", "correct": false}], "type": "single"}, {"text": "Wzrost stężenia BNP/NT-proBNP może wystąpić w przebiegu:", "hint": "BNP/NT-proBNP rośnie w: HF (ostrej, przewlekłej), zawale serca, zatorowości płucnej, nadczynności tarczycy, PChN. β-blokery i ACEI w leczeniu HF wręcz OBNIŻAJĄ BNP. Niedoczynność tarczycy → ↓BNP.", "items": ["Ostrej niewydolności serca", "W trakcie leczenia antagonistami układu adrenergicznego", "Zawału serca", "Nieleczonej niedoczynności tarczycy", "Przewlekłej niewydolności serca", "W trakcie leczenia ACEI"], "options": [{"letter": "A", "text": "1, 3, 4", "correct": false}, {"letter": "B", "text": "1, 3, 5", "correct": true}, {"letter": "C", "text": "3, 5, 6", "correct": false}, {"letter": "D", "text": "2, 4, 6", "correct": false}, {"letter": "E", "text": "1, 2, 3", "correct": false}], "type": "single"}, {"text": "Wskaż fałszywe stwierdzenie dotyczące kiły:", "hint": "Treponema pallidum to krętek (spirocheta), a NIE klasyczna bakteria Gram-ujemna (zbyt cienka do barwienia metodą Grama, widoczna w mikroskopii w ciemnym polu). Pozostałe stwierdzenia są prawdziwe.", "options": [{"letter": "A", "text": "Objawem kiły I okresu jest wrzód twardy (wrzód Huntera) pojawiający się 3 tygodnie–3 miesiące od zakażenia", "correct": false}, {"letter": "B", "text": "Kiła wczesna (do 2 lat od zakażenia) dzieli się na kiłę I okresu, kiłę II okresu oraz kiłę wczesną utajoną", "correct": false}, {"letter": "C", "text": "Odczyny serologiczne: krętkowe (TPHA, TPPA, FTA-ABS, EIA/IgG, EIA/IgM) i niekrętkowe (RPR, VDRL, USR)", "correct": false}, {"letter": "D", "text": "W leczeniu kiły I i II okresu zaleca się benzatynową penicylinę G 2,4 mln j.m. domięśniowo w pojedynczej dawce", "correct": false}, {"letter": "E", "text": "Kiła jest chorobą STD, czynnik etiologiczny — Gram-ujemna bakteria krętek blady (Treponema pallidum)", "correct": true}], "type": "single"}, {"text": "Jakie leki nie stosuje się w leczeniu podtrzymującym remisję choroby Crohna:", "hint": "Podtrzymanie remisji w chorobie Crohna: AZA/6-MP, MTX, leki biologiczne (anty-TNF). NIE stosuje się: GKS (jedynie indukcja, nie podtrzymanie!) i 5-ASA (słaba skuteczność w chorobie Crohna — to lek dla WZJG).", "items": ["Azatiopryna", "Merkaptopuryna", "GKS", "5-ASA", "Leki biologiczne", "Metotreksat"], "options": [{"letter": "A", "text": "1, 2", "correct": false}, {"letter": "B", "text": "3, 4", "correct": true}, {"letter": "C", "text": "2, 5", "correct": false}, {"letter": "D", "text": "3, 6", "correct": false}, {"letter": "E", "text": "2, 6", "correct": false}], "type": "single"}, {"text": "W zapaleniu płuc spowodowanym MRSA antybiotykiem z wyboru jest:", "hint": "Zapalenie płuc o etiologii MRSA: wankomycyna i.v. (MIC ≤2) lub linezolid. β-laktamy (w tym meropenem i cefuroksym) NIE działają na MRSA.", "options": [{"letter": "A", "text": "Doksycyklina", "correct": false}, {"letter": "B", "text": "Wankomycyna", "correct": true}, {"letter": "C", "text": "Makrolid", "correct": false}, {"letter": "D", "text": "Meropenem", "correct": false}, {"letter": "E", "text": "Cefuroksym", "correct": false}], "type": "single"}, {"text": "Podstawowym objawem klinicznym złamania żeber jest:", "hint": "Złamanie żebra — punktowa bolesność nad uszkodzonym żebrem, nasilająca się przy kaszlu, głębokim wdechu, ruchach. Duszność/odma/krwiak opłucnej — powikłania, a nie podstawowy objaw.", "options": [{"letter": "A", "text": "Duszność", "correct": false}, {"letter": "B", "text": "Rozedma podskórna", "correct": false}, {"letter": "C", "text": "Bolesność żebra nasilająca się przy kaszlu", "correct": true}, {"letter": "D", "text": "Odma opłucnowa", "correct": false}, {"letter": "E", "text": "Płyn w jamie opłucnej", "correct": false}], "type": "single"}, {"text": "Rekomendowane miejsce założenia drenażu opłucnowego w przypadku odmy opłucnowej to:", "hint": "Triangle of safety (BTS/ATS): IV–V międzyżebrze w linii pachowej przedniej/środkowej — obszar między brzegiem pectoralis major a latissimus dorsi powyżej linii sutka. Alternatywa przy odmie (dostęp Monaldi): II międzyżebrze w linii środkowo-obojczykowej. ZAWSZE po GÓRNYM brzegu żebra — pęczek naczyniowo-nerwowy biegnie wzdłuż dolnego brzegu. UWAGA: „drenaż Bülaua\" to metoda podwodnego drenażu, a nie lokalizacja.", "options": [{"letter": "A", "text": "VII-VIII międzyżebrze w linii pachowej przedniej po dolnym brzegu żebra", "correct": false}, {"letter": "B", "text": "VIII-IX międzyżebrze w linii pachowej przedniej po górnym brzegu żebra", "correct": false}, {"letter": "C", "text": "IV-VI międzyżebrze w linii pachowej przedniej lub środkowej albo II międzyżebrze w linii środkowo-obojczykowej po dolnym brzegu żebra", "correct": false}, {"letter": "D", "text": "VII-VIII międzyżebrze w linii pachowej przedniej po górnym brzegu żebra", "correct": false}, {"letter": "E", "text": "IV-VI międzyżebrze w linii pachowej przedniej lub środkowej albo II międzyżebrze w linii środkowo-obojczykowej po górnym brzegu żebra", "correct": true}], "type": "single"}, {"text": "Do SOR zgłosiła się 60-letnia kobieta, 5 dni bólów brzucha w podbrzuszu, T 38,5°C, zatrzymanie gazów. Uchyłkowatość jelita grubego w wywiadzie. Wzmożone napięcie powłok, obrona mięśniowa, brak perystaltyki. CRP 200 mg/l, prokalcytonina 35 ng/ml. Rozpoznanie:", "hint": "Uchyłkowatość w wywiadzie + ból w lewym podbrzuszu + gorączka + objawy otrzewnowe + ↑↑CRP/PCT = ostre zapalenie uchyłków z możliwą perforacją (Hinchey III/IV).", "options": [{"letter": "A", "text": "Ostre zapalenie wyrostka robaczkowego", "correct": false}, {"letter": "B", "text": "Zapalenie uchyłków jelita grubego z możliwą perforacją", "correct": true}, {"letter": "C", "text": "Ostre zapalenie trzustki", "correct": false}, {"letter": "D", "text": "Ostre zapalenie pęcherzyka żółciowego", "correct": false}, {"letter": "E", "text": "Perforacja wrzodu trawiennego", "correct": false}], "type": "single"}, {"text": "Pacjent 78 lat, zespół kruchości, NT 1 st. Zalecone leczenie:", "hint": "ESC 2024: u starszych pacjentów z zespołem kruchości rozpoczynamy od monoterapii (mała dawka), ostrożnie z uwagi na ryzyko hipotonii i upadków. Cel ≤140/90, u >80 lat ≤150/90.", "options": [{"letter": "A", "text": "Bez leków — modyfikacja diety, ćwiczenia, spacery", "correct": false}, {"letter": "B", "text": "1 lek hipotensyjny", "correct": true}, {"letter": "C", "text": "2 leki hipotensyjne", "correct": false}, {"letter": "D", "text": "3 leki hipotensyjne", "correct": false}, {"letter": "E", "text": "4 leki hipotensyjne", "correct": false}], "type": "single"}, {"text": "Typowe objawy ostrego zapalenia wyrostka robaczkowego:", "hint": "Sekwencja Cope'a/Murphy'ego w appendicitis: brak apetytu → nudności/wymioty → ból (początkowo trzewny w nadbrzuszu/okolicy pępka, migrujący po 6–12 h do prawego dołu biodrowego/McBurney) → stan podgorączkowy 37,5–38°C. Krwawienie z DOPP NIE jest objawem zapalenia wyrostka — sugeruje IBD, uchyłki, niedokrwienie. UWAGA: „objaw Murphy'ego\" to standardowo objaw uciskowy w ostrym zapaleniu pęcherzyka żółciowego.", "items": ["Temperatura ciała 37-38°C", "Krwawienie z dolnego odcinka PP", "Nudności i wymioty", "Ból początkowo w nadbrzuszu i okolicy pępka, następnie w prawym podbrzuszu", "Brak apetytu"], "options": [{"letter": "A", "text": "2, 4", "correct": false}, {"letter": "B", "text": "1, 3, 4, 5", "correct": true}, {"letter": "C", "text": "1, 2, 3", "correct": false}, {"letter": "D", "text": "1, 2, 4", "correct": false}, {"letter": "E", "text": "1, 2, 3, 4, 5", "correct": false}], "type": "single"}, {"text": "Który patogen jest najczęstszą przyczyną choroby wrzodowej żołądka:", "hint": "H. pylori — przyczyna ~70% wrzodów żołądka i ~95% wrzodów dwunastnicy. Druga częsta przyczyna — NLPZ.", "options": [{"letter": "A", "text": "Acinetobacter baumannii", "correct": false}, {"letter": "B", "text": "Clostridium difficile", "correct": false}, {"letter": "C", "text": "Giardia lamblia", "correct": false}, {"letter": "D", "text": "H. pylori", "correct": true}, {"letter": "E", "text": "Candida albicans", "correct": false}], "type": "single"}, {"text": "W przypadku masywnego krwawienia z DOPP — brak źródła w endoskopii:", "hint": "Przy ujemnej kolonoskopii u niestabilnego pacjenta → arteriografia z embolizacją (uwidacznia krwawienie ≥0,5 ml/min). Leczenie operacyjne — ostateczność w razie niepowodzenia.", "options": [{"letter": "A", "text": "Irygacja okrężnicy zimnym roztworem 0,9% NaCl", "correct": false}, {"letter": "B", "text": "Laparotomia z wyłonieniem ileostomii", "correct": false}, {"letter": "C", "text": "Laparotomia z resekcją całego jelita grubego z zespoleniem z odbytnicą", "correct": false}, {"letter": "D", "text": "Przetoczenie 4-6 j. świeżo mrożonego osocza wraz z koncentratem płytek krwi", "correct": false}, {"letter": "E", "text": "Arteriografia; przy uwidocznieniu miejsca krwawienia — embolizacja naczynia", "correct": true}], "type": "single"}, {"text": "Pacjentka przed planową operacją przepukliny, stosuje aspir
