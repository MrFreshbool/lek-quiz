<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LEK Quiz">
<meta name="theme-color" content="#0f1117">
<meta name="format-detection" content="telephone=no">
<title>LEK Quiz — Nostryfikacja ZG</title>
<style>
  /* ── NEW pagination & reset styles (prepended) ── */
  .pagination-wrap {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .pagination-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .pagination-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .pg-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    height: 28px;
    min-width: 28px;
    padding: 0 4px;
    text-align: center;
    transition: border-color 0.1s, background 0.1s, color 0.1s;
  }
  .pg-btn:hover { border-color: var(--accent); color: var(--text); }
  .pg-btn.pg-current { border-color: var(--accent); color: var(--accent); background: #181c38; }
  .pg-btn.pg-correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .pg-btn.pg-wrong   { background: var(--wrong-bg);   border-color: var(--wrong);   color: var(--wrong); }
  .pg-btn.pg-skipped { border-color: #6b4c10; color: #a16207; }
  .reset-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--wrong);
    cursor: pointer;
    font-size: 12px;
    padding: 5px 12px;
    transition: border-color 0.15s;
  }
  .reset-btn:hover { border-color: var(--wrong); }
  .save-indicator {
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .save-indicator.show { opacity: 1; }
  /* ── end new styles ── */
</style>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3248;
    --text: #e8eaf0;
    --text-muted: #8b90a8;
    --accent: #5b6ef5;
    --accent-dim: #3d4db5;
    --correct: #22c55e;
    --correct-bg: #052e16;
    --wrong: #ef4444;
    --wrong-bg: #2d0a0a;
    --hint-bg: #1e1a06;
    --hint-border: #a16207;
    --hint-text: #fde68a;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 20px;
  }
  .app { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header { padding: 24px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .header p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  /* Session selector */
  .session-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .session-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    padding: 14px 16px;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
  }
  .session-btn:hover { border-color: var(--accent); background: var(--surface2); }
  .session-btn.active { border-color: var(--accent); background: var(--surface2); }
  .session-btn .name { font-size: 14px; font-weight: 600; }
  .session-btn .count { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .session-btn.all-btn { border-style: dashed; }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 7px 14px;
    transition: color 0.15s, border-color 0.15s;
  }
  .ctrl-btn:hover { color: var(--text); border-color: var(--accent); }
  .ctrl-btn.active { color: var(--accent); border-color: var(--accent); }
  .ctrl-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .ctrl-btn.primary:hover { background: var(--accent-dim); }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.3s;
  }
  .progress-text { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .score-badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .score-badge.good { border-color: var(--correct); color: var(--correct); }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .q-meta {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
  }
  .q-items {
    margin: 8px 0 4px 0;
    padding-left: 24px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--text);
  }
  .q-items li {
    margin-bottom: 2px;
  }
  .q-type-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .option-btn {
    align-items: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    cursor: pointer;
    display: flex;
    font-size: 14px;
    gap: 12px;
    padding: 12px 16px;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #1f2438; }
  .option-btn:disabled { cursor: default; }
  .option-btn .letter {
    background: var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    min-width: 24px;
    padding: 4px 6px;
    text-align: center;
  }
  .option-btn .opt-text { line-height: 1.5; padding-top: 1px; }
  .option-btn.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .option-btn.correct .letter { background: var(--correct); color: #fff; }
  .option-btn.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .option-btn.wrong .letter { background: var(--wrong); color: #fff; }
  .option-btn.reveal-correct {
    border-color: var(--correct);
    opacity: 0.5;
  }

  /* Hint */
  .hint-box {
    background: var(--hint-bg);
    border: 1px solid var(--hint-border);
    border-radius: var(--radius);
    color: var(--hint-text);
    display: none;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 12px;
    padding: 14px 16px;
  }
  .hint-box.visible { display: block; }
  .hint-label { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; margin-bottom: 6px; opacity: 0.7; }

  /* Reveal answer (for text questions) */
  .reveal-answer {
    background: var(--correct-bg);
    border: 1px solid var(--correct);
    border-radius: var(--radius);
    color: var(--correct);
    display: none;
    font-size: 14px;
    font-weight: 600;
    margin-top: 12px;
    padding: 14px 16px;
  }
  .reveal-answer.visible { display: block; }

  /* Navigation */
  .nav-row {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-top: 16px;
  }
  .nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    padding: 10px 20px;
    transition: border-color 0.15s;
  }
  .nav-btn:hover { border-color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .nav-btn.next-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .nav-btn.next-btn:hover { background: var(--accent-dim); }
  .skip-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 10px;
    text-decoration: underline;
  }
  .skip-btn:hover { color: var(--text); }

  /* Results */
  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
  }
  .results-card h2 { font-size: 22px; margin-bottom: 8px; }
  .results-card .big-score {
    font-size: 56px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin: 16px 0;
  }
  .results-card .score-detail { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
  .results-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .breakdown-item {
    background: var(--surface2);
    border-radius: 8px;
    padding: 14px;
  }
  .breakdown-item .val { font-size: 24px; font-weight: 700; }
  .breakdown-item .lbl { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .val.green { color: var(--correct); }
  .val.red { color: var(--wrong); }
  .val.grey { color: var(--text-muted); }

  /* Responsive */
  @media (max-width: 500px) {
    .session-grid { grid-template-columns: 1fr 1fr; }
    .results-breakdown { grid-template-columns: 1fr 1fr; }
  }
</style>
<style>
  /* ── iPad / touch fixes (appended) ── */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #0f1117; }
  body {
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  button {
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  /* Safari greys out text of disabled buttons — answered options must stay readable */
  .option-btn:disabled { color: var(--text); -webkit-text-fill-color: currentColor; }
  .option-btn:disabled:not(.reveal-correct) { opacity: 1; }
  .option-btn .letter { -webkit-text-fill-color: currentColor; }
  .nav-btn:disabled { color: var(--text); -webkit-text-fill-color: currentColor; }
  .nav-btn.next-btn:disabled { color: #fff; }

  @media (hover: none), (pointer: coarse) {
    /* no sticky hover after a tap */
    .session-btn:hover { border-color: var(--border); background: var(--surface); }
    .session-btn.active:hover { border-color: var(--accent); background: var(--surface2); }
    .ctrl-btn:hover { color: var(--text-muted); border-color: var(--border); }
    .ctrl-btn.active:hover { color: var(--accent); border-color: var(--accent); }
    .ctrl-btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .option-btn:hover:not(:disabled) { border-color: var(--border); background: var(--surface2); }
    .nav-btn:hover { border-color: var(--border); }
    .nav-btn.next-btn:hover { background: var(--accent); border-color: var(--accent); }
    .skip-btn:hover { color: var(--text-muted); }
    .pg-btn:hover { border-color: var(--border); color: var(--text-muted); }
    .pg-btn.pg-current:hover { border-color: var(--accent); color: var(--accent); }
    .pg-btn.pg-correct:hover { border-color: var(--correct); color: var(--correct); }
    .pg-btn.pg-wrong:hover { border-color: var(--wrong); color: var(--wrong); }
    .pg-btn.pg-skipped:hover { border-color: #6b4c10; color: #a16207; }
    .reset-btn:hover { border-color: var(--border); }

    /* finger-sized targets */
    .app { max-width: 860px; }
    .q-text { font-size: 18px; }
    .q-items { font-size: 17px; }
    .option-btn { font-size: 17px; padding: 16px 18px; min-height: 56px; }
    .option-btn .letter { font-size: 14px; min-width: 28px; padding: 6px 8px; }
    .option-btn:active:not(:disabled) { border-color: var(--accent); background: #1f2438; }
    .ctrl-btn { font-size: 15px; padding: 11px 18px; min-height: 44px; }
    .reset-btn { font-size: 14px; padding: 10px 14px; min-height: 44px; }
    .nav-btn { font-size: 16px; padding: 13px 22px; min-height: 48px; }
    .skip-btn { font-size: 15px; padding: 13px 14px; min-height: 48px; }
    .session-btn { padding: 16px 18px; }
    .session-btn .name { font-size: 16px; }
    .session-btn .count { font-size: 13px; }
    .pagination-grid { gap: 7px; }
    .pg-btn { font-size: 13px; height: 40px; min-width: 40px; }
    .hint-box { font-size: 15px; }
    .reveal-answer { font-size: 16px; }
  }
  @media (max-width: 500px) {
    .nav-row { gap: 6px; }
    .nav-btn { padding: 12px 12px; font-size: 15px; }
    .skip-btn { padding: 12px 6px; }
  }
  .noscript-msg {
    background: var(--hint-bg); border: 1px solid var(--hint-border); border-radius: var(--radius);
    color: var(--hint-text); font-size: 16px; line-height: 1.6; margin-bottom: 20px; padding: 16px;
  }
  /* ── end iPad fixes ── */
</style>
</head>
<body>
<div class="app">
  <noscript><div class="noscript-msg">
    Ten podgląd nie uruchamia skryptów, więc quiz nie działa. Otwórz plik w przeglądarce Safari.<br>
    Этот просмотрщик не запускает скрипты — откройте файл в Safari.
  </div></noscript>
  <div class="header">
    <h1>LEK Quiz — Nostryfikacja ZG</h1>
    <p>Wybierz sesję egzaminacyjną i zacznij ćwiczyć</p>
  </div>

  <!-- Session selector -->
  <div class="session-grid" id="sessionGrid"></div>

  <!-- Controls -->
  <div class="controls" id="controls" style="display:none">
    <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()">Losuj kolejność</button>
    <button class="ctrl-btn" id="wrongOnlyBtn" onclick="toggleWrongOnly()" style="display:none">Tylko błędne</button>
    <button class="ctrl-btn primary" id="startBtn" onclick="startQuiz()">Start</button>
    <button class="ctrl-btn primary" id="resumeBtn" onclick="resumeQuiz()" style="display:none">Kontynuuj →</button>
    <span style="flex:1"></span>
    <button class="reset-btn" id="resetBtn" onclick="clearProgress()" style="display:none">Resetuj postęp</button>
    <span id="qCount" style="font-size:13px;color:var(--text-muted);margin-left:8px"></span>
  </div>

  <!-- Quiz area -->
  <div id="quizArea" style="display:none">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText"></span>
      <span class="score-badge" id="scoreBadge">0 / 0</span>
    </div>

    <div class="question-card" id="questionCard">
      <div class="q-meta" id="qMeta"></div>
      <div class="q-text" id="qText"></div>
      <div id="qItems" style="display:none"></div>
      <div id="qTypeBadge"></div>
      <div class="options" id="optionsDiv"></div>
      <button class="ctrl-btn" id="revealBtn" onclick="revealAnswer()" style="margin-top:12px;display:none">Pokaż odpowiedź</button>
      <div class="reveal-answer" id="revealAnswer"></div>
      <div class="hint-box" id="hintBox">
        <div class="hint-label">HINT</div>
        <div id="hintText"></div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Poprzednie</button>
      <span class="save-indicator" id="saveIndicator">Zapisano</span>
      <button class="skip-btn" onclick="skipQuestion()">Pomiń</button>
      <button class="nav-btn next-btn" id="nextBtn" onclick="navigate(1)" disabled>Następne →</button>
    </div>

    <div class="pagination-wrap" id="paginationWrap">
      <div class="pagination-label">Pytania</div>
      <div class="pagination-grid" id="paginationGrid"></div>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsArea" style="display:none">
    <div class="results-card">
      <h2>Wynik sesji</h2>
      <div class="big-score" id="resPct"></div>
      <div class="score-detail" id="resDetail"></div>
      <div class="results-breakdown" id="resBreakdown"></div>
      <button class="ctrl-btn primary" onclick="restartQuiz()" style="margin-right:8px">Powtórz wszystkie</button>
      <button class="ctrl-btn" onclick="restartWrong()">Powtórz błędne</button>
    </div>
  </div>
</div>

etter": "E", "text": "mycoplasma pneumoniae.", "correct": true}], "type": "single"}, {"text": "Wskaż nieprawdziwe zdanie dotyczące mięsaków tkanek miękkich (MTM).", "hint": "", "options": [{"letter": "A", "text": "Rokowanie w przypadku MTM jest niekorzystne.", "correct": false}, {"letter": "B", "text": "Charakterystycznym objawem MTM jest niebolesny guz, najczęściej zlokalizowany podpowięziowo.", "correct": false}, {"letter": "C", "text": "Najczęstszą lokalizacją przerzutów MTM jest wątroba.", "correct": true}, {"letter": "D", "text": "Biopsja wycinająca jest przeciwwskazana w przypadku MTM o średnicy >5cm.", "correct": false}, {"letter": "E", "text": "MTM wykazują dużą skłonność do tworzenia przerzutów drogą krwi.", "correct": false}], "type": "single"}, {"text": "Leukostaza to", "hint": "", "options": [{"letter": "A", "text": "stała liczba leukocytów we krwi.", "correct": false}, {"letter": "B", "text": "zmniejszona liczba białych krwinek we krwi.", "correct": false}, {"letter": "C", "text": "zaburzenia przepływu krwi w makrokrążeniu związana ze znaczną leukocytozą (powyżej 100000/ul).", "correct": false}, {"letter": "D", "text": "powikłania zatorowe (zatory ze złepów leukocytów) związana ze znaczną leukocytozą (powyżej 100000/ul).", "correct": false}, {"letter": "E", "text": "zaburzenia przepływu krwi w mikrokrążeniu związana ze znaczną leukocytozą (powyżej 100000/ul).", "correct": true}], "type": "single"}, {"text": "W przypadku wystąpienia bezbolesnego krwiomoczu u pacjenta bez wcześniejszego wywiadu chorobowego najwłaściwszym postępowaniem jest", "hint": "", "options": [{"letter": "A", "text": "obserwacja.", "correct": false}, {"letter": "B", "text": "wykonanie badania ogólnego moczu i włączenie antybiotykoterapii.", "correct": false}, {"letter": "C", "text": "skierowanie chorego na podwiązanie tętnicy nerkowej.", "correct": false}, {"letter": "D", "text": "natychmiastowa cystoskopia.", "correct": false}, {"letter": "E", "text": "wykonanie usg.", "correct": true}], "type": "single"}, {"text": "Najczęstszy nowotwór złośliwy nerki występujący u dzieci to", "hint": "", "options": [{"letter": "A", "text": "rakowiak.", "correct": false}, {"letter": "B", "text": "guz liściasty.", "correct": false}, {"letter": "C", "text": "chłoniak.", "correct": false}, {"letter": "D", "text": "guz Wilmsa (nerczak płodowy).", "correct": true}, {"letter": "E", "text": "rak nerkowokomórkowy (RCC).", "correct": false}], "type": "single"}, {"text": "30-letnia pierwiastka w 34. tygodniu ciąży zgłasza się na badanie kontrolne. W pomiarach gabinetowych ciśnienie tętnicze wynosi 155/95 mmHg (potwierdzone w dwóch pomiarach). W badaniu ogólnym moczu stwierdzono białkomocz [0,5 g/dobę]. Pacjentka skarży się na narastające obrzęki podudzi i uporczywy ból w nadbrzuszu. W badaniach laboratoryjnych: płytki krwi 90 tys./ul (norma >150 tys.), aktywność enzymów wątrobowych (AST, ALT) trzykrotnie powyżej normy. Najbardziej prawdopodobne rozpoznanie to", "hint": "", "options": [{"letter": "A", "text": "nadciśnienie tętnicze indukowane ciążą (PIH).", "correct": false}, {"letter": "B", "text": "rzucawka.", "correct": false}, {"letter": "C", "text": "zespół HELLP.", "correct": true}, {"letter": "D", "text": "stan przedrzucawkowy (preeklampsja).", "correct": false}, {"letter": "E", "text": "ciążowe stłuszczenie wątroby.", "correct": false}], "type": "single"}], "Wiosna 2026": [{"text": "Szybko postępujące kłębuszkowe zapalenie nerek u chorego z owrzodzeniami przegrody nosa i jej perforacją oraz obecnością ropnej wydzieliny z dróg oddechowych mogą przemawiać za następnym rozpoznaniem:", "hint": "Klasyczna triada GPA: ENT (owrzodzenia/perforacja przegrody nosa) + Płuca + Nerki (RPGN). Perforacja przegrody nosa = GPA, dopóki nie udowodniono inaczej. Goodpasture — płuca + nerki, ale bez zajęcia laryngologicznego.", "options": [{"letter": "A", "text": "Zespół Goodpasture'a", "correct": false}, {"letter": "B", "text": "Ziarniakowatość z zapaleniem naczyń (GPA)", "correct": true}, {"letter": "C", "text": "Nadciśnienie złośliwe", "correct": false}, {"letter": "D", "text": "Nefropatia IgA", "correct": false}, {"letter": "E", "text": "Zespół hemolityczno-mocznicowy", "correct": false}], "type": "single"}, {"text": "Jak dziedziczy się achondroplazja?", "hint": "Achondroplazja = mutacja FGFR3, dziedziczenie autosomalne dominujące. ~80% przypadków to mutacje de novo. Postać homozygotyczna (AA) jest letalna.", "options": [{"letter": "A", "text": "Autosomalnie dominująco", "correct": true}, {"letter": "B", "text": "Autosomalnie recesywnie", "correct": false}, {"letter": "C", "text": "Mitochondrialnie", "correct": false}, {"letter": "D", "text": "Recesywnie sprzężona z chromosomem X", "correct": false}, {"letter": "E", "text": "Dominująco sprzężona z chromosomem X", "correct": false}], "type": "single"}, {"text": "Wskaż cechę, która NIE PASUJE do obrazu klinicznego szpiczaka plazmocytowego:", "hint": "Szpiczak = CRAB (Calcium ↑, Renal failure, Anemia, Bone lesions). Chromosom Filadelfia (BCR-ABL) jest charakterystyczny dla CML, a nie dla szpiczaka.", "options": [{"letter": "A", "text": "Hiperkalcemia", "correct": false}, {"letter": "B", "text": "Uszkodzenie nerek", "correct": false}, {"letter": "C", "text": "Anemia (niedokrwistość)", "correct": false}, {"letter": "D", "text": "Zmiany kostne", "correct": false}, {"letter": "E", "text": "Obecność chromosomu Filadelfia", "correct": true}], "type": "single"}, {"text": "Jaki stopień zwężenia tchawicy po intubacji jest klinicznie istotny i objawia się dusznością?", "hint": "<50% — zwykle bezobjawowe; >50% — pojawia się duszność wysiłkowa; >75% — duszność spoczynkowa, stridor. 50% = początek istotności klinicznej.", "options": [{"letter": "A", "text": "Ponad 10%", "correct": false}, {"letter": "B", "text": "Ponad 25%", "correct": false}, {"letter": "C", "text": "Ponad 50%", "correct": true}, {"letter": "D", "text": "Ponad 75%", "correct": false}, {"letter": "E", "text": "Wszystkie powyższe", "correct": false}], "type": "single"}, {"text": "Przepuklina Morgagniego:", "hint": "Przepuklina Morgagniego — ubytek w przedniej części przepony (przymostkowo). Po stronie lewej serce „zakrywa\" tę okolicę, dlatego przepuklina powstaje po stronie prawej. Mnemonik: Morgagni = Mostek = prawa strona.", "options": [{"letter": "A", "text": "Prawostronna", "correct": true}, {"letter": "B", "text": "Lewostronna", "correct": false}, {"letter": "C", "text": "Obustronna", "correct": false}, {"letter": "D", "text": "Wszystko prawidłowo", "correct": false}, {"letter": "E", "text": "Nie ma prawidłowo", "correct": false}], "type": "single"}, {"text": "Najczęściej rak kobiet:", "hint": "Nr 1 u kobiet pod względem zachorowalności = rak piersi. Uwaga: najczęstszy ≠ najbardziej śmiertelny (najbardziej śmiertelny — rak płuca).", "options": [{"letter": "A", "text": "Rak piersi", "correct": true}, {"letter": "B", "text": "Rak szyjki macicy", "correct": false}, {"letter": "C", "text": "Rak trzonu macicy", "correct": false}, {"letter": "D", "text": "Rak jajników", "correct": false}], "type": "single"}, {"text": "Najczęstszą przyczyną przedwczesnego porodu jest:", "hint": "Wśród WYMIENIONYCH przyczyn nr 1 = zakażenie wewnątrzmaciczne (najczęściej wstępujące/ascendentne). Mechanizm: zakażenie → zapalenie → ↑ prostaglandyny → skurcze + PROM. Uwaga: globalnie ~40–50% porodów przedwczesnych to przypadki idiopatyczne/spontaniczne bez uchwytnej przyczyny, ale spośród konkretnych etiologii infekcja dominuje.", "options": [{"letter": "A", "text": "Wady macicy", "correct": false}, {"letter": "B", "text": "Nadciśnienie tętnicze", "correct": false}, {"letter": "C", "text": "Cukrzyca", "correct": false}, {"letter": "D", "text": "Cholestaza", "correct": false}, {"letter": "E", "text": "Zakażenie wewnątrzmaciczne", "correct": true}], "type": "single"}, {"text": "Najczęściej rak szyjki macicy to: Rak płaskonabłonkowy (carcinoma planoepitheliale)", "hint": "~70–80% przypadków → rak płaskonabłonkowy, rozwija się z nabłonka w strefie transformacji. HPV 16 → częściej rak płaskonabłonkowy. Mnemonik: Szyjka = Squamous.", "options": [], "correct_text": "Rak płaskonabłonkowy (carcinoma planoepitheliale)", "type": "reveal"}, {"text": "Kiedy podajemy immunoglobulinę w ciąży?", "hint": "Profilaktyka konfliktu serologicznego (RhD) — standardowo w 28. tygodniu ciąży. 11–18 t.c. — zbyt wcześnie, 36–38 — zbyt późno (sensybilizacja mogła już zajść).", "options": [{"letter": "A", "text": "11–14 t.c.", "correct": false}, {"letter": "B", "text": "21–26 t.c.", "correct": false}, {"letter": "C", "text": "28–30 t.c.", "correct": true}, {"letter": "D", "text": "16–18 t.c.", "correct": false}, {"letter": "E", "text": "36–38 t.c.", "correct": false}], "type": "single"}, {"text": "Kobieta w 34. tygodniu ciąży: ciśnienie 155/95 mmHg, białko w moczu >0,5 g, obrzęki, ból w prawym podżebrzu, płytki 80 000, podwyższone AST i ALT. Jakie jest rozpoznanie? Zespół HELLP", "hint": "Preeklampsja (RR ↑ + białkomocz) + kryteria HELLP: H – Hemolysis, EL – Elevated Liver enzymes (↑ AST/ALT), LP – Low Platelets (80 000). Ból w prawym podżebrzu = rozciąganie torebki wątroby. HELLP = wskazanie do zakończenia ciąży.", "options": [], "correct_text": "Zespół HELLP", "type": "reveal"}, {"text": "W jaki dzień występuje owulacja, jeżeli cykl prawidłowy oraz trwa 35 dni? Około 21. dnia cyklu", "hint": "Owulacja = długość cyklu − 14 (faza lutealna ≈ 14 dni, stała). 35 − 14 = 21. Zmienia się faza folikularna, nie lutealna.", "options": [], "correct_text": "Około 21. dnia cyklu", "type": "reveal"}, {"text": "Czego nie będzie w zespole krótkiego jelita?", "hint": "Short bowel → ↓ powierzchni wchłaniania → malabsorpcja + utrata wody. Będą biegunki, hipokaliemia (utrata K⁺), hipokalcemia (↓ wchłaniania Ca²⁺). Zaparcia — przeczą patofizjologii (przyspieszony pasaż, a nie spowolniony).", "items": ["Hipokaliemia", "Hipokalcemia", "Biegunki"], "options": [{"letter": "1", "text": "Hipokaliemia", "correct": false}, {"letter": "2", "text": "Hipokalcemia", "correct": false}, {"letter": "3", "text": "Biegunki", "correct": false}, {"letter": "4", "text": "Zaparcia", "correct": true}], "type": "single"}, {"text": "Zespół nerczycowy: 1) Białko w moczu powyżej 3,5 g 2) Białko w moczu poniżej 3,5 g 3) Lipiduria 4) Lipidemia Правильные ответы: 1, 3, 4", "hint": "Zespół nerczycowy = białkomocz >3,5 g/d + hipoalbuminemia + obrzęki + hiperlipidemia + lipiduria. Białko <3,5 — to obraz nefrytyczny/subnefrotyczny. Mnemonik: „Nephrotic = Protein + Lipids\".", "options": [{"letter": "1", "text": "Białko w moczu powyżej 3,5 g**</u> 2) Białko w moczu poniżej 3,5 g", "correct": true}, {"letter": "3", "text": "Lipiduria", "correct": true}, {"letter": "4", "text": "Lipidemia", "correct": true}], "type": "multiple"}, {"text": "Główny czynnik etiologii międzybłoniaka opłucnej jest:", "hint": "Międzybłoniak opłucnej = azbest (must-know, prawie zawsze jedna odpowiedź). Okres latencji 20–40 lat. Nikiel → rak płuca; pył krzemowy → krzemica (silikoza); benzen → białaczki.", "options": [{"letter": "A", "text": "Ekspozycja na nikiel", "correct": false}, {"letter": "B", "text": "Na pył krzemowy", "correct": false}, {"letter": "C", "text": "Na benzen", "correct": false}, {"letter": "D", "text": "Na azbest", "correct": true}, {"letter": "E", "text": "Wszystkie nieprawidłowe", "correct": false}], "type": "single"}, {"text": "Stężenie jakiego hormonu obserwujemy w ciąży?", "hint": "W ciąży ↑ β-hCG (podtrzymuje ciałko żółte), ↑ Progesteron (hamuje skurcze), ↑ Estradiol (wzrost macicy). FSH i LH ↓ — hamowane przez ujemne sprzężenie zwrotne.", "options": [{"letter": "A", "text": "Estradiol", "correct": true}, {"letter": "B", "text": "FSH", "correct": false}, {"letter": "C", "text": "β-hCG", "correct": true}, {"letter": "D", "text": "Progesteron", "correct": true}, {"letter": "E", "text": "LH", "correct": false}], "type": "multiple"}, {"text": "Cukrzyca typu LADA to:", "hint": "LADA = Latent Autoimmune Diabetes in Adults = wolno postępująca cukrzyca typu 1 u dorosłych. Obecne przeciwciała (anti-GAD, ICA). Początkowo wygląda jak typ 2, ale z czasem → insulinozależność.", "options": [{"letter": "A", "text": "Monogenowa", "correct": false}, {"letter": "B", "text": "Typu 2", "correct": false}, {"letter": "C", "text": "O znanej etiologii (typ 3)", "correct": false}, {"letter": "D", "text": "Typ 1", "correct": true}, {"letter": "E", "text": "W przebiegu autoimmunologicznego zapalenia tarczycy", "correct": false}], "type": "single"}, {"text": "Przepuklina przeponowa:", "hint": "Wszystkie wymienione — różne typy przepuklin przepony. Bochdalek = tylno-boczna (częściej lewostronna, wrodzona). Morgagni = przednia (częściej prawostronna). Okołoprzełykowa = typ przepukliny rozworu przełykowego (hiatus).", "options": [{"letter": "A", "text": "Bochdaleka", "correct": true}, {"letter": "B", "text": "Morgagniego", "correct": true}, {"letter": "C", "text": "Okołoprzełykowa", "correct": true}], "correct_text": "Odpowiedź: A + B + C (wszystkie)", "type": "reveal_with_options"}, {"text": "Endarterektomia tętnic szyjnych to: Zabieg chirurgiczny polegający na usunięciu blaszki miażdżycowej z tętnicy szyjnej w celu przywrócenia przepływu krwi i zapobiegania udarowi mózgu.", "hint": "Endarterektomia = „wycięcie blaszki z tętnicy\". Wskazania: zwężenie ≥70% (objawowe). Cel: profilaktyka udaru mózgu.", "options": [], "correct_text": "Zabieg chirurgiczny polegający na usunięciu blaszki miażdżycowej z tętnicy szyjnej w celu przywrócenia przepływu krwi i zapobiegania udarowi mózgu.", "type": "reveal"}, {"text": "Jaki najczęstszy czynnik wywołujący astmę u dziecka < 5 lat?", "hint": "U dzieci <5 lat astma częściej ma charakter wheezingu wirusozależnego (RSV, rynowirusy, paragrypa). Alergeny wziewne → częściej u starszych dzieci. Mnemonik: Małe dziecko = wirusy, Starsze = alergia.", "options": [{"letter": "A", "text": "Alergeny pokarmowe", "correct": false}, {"letter": "B", "text": "Alergeny wziewne", "correct": false}, {"letter": "C", "text": "Wirusy", "correct": true}], "type": "single"}, {"text": "Najczęstszą przyczyną wrodzonego przerostu nadnerczy jest:", "hint": "~90–95% przypadków CAH → niedobór 21-hydroksylazy. Patofizjologia: ↓ kortyzol → ↑ ACTH → przerost nadnerczy + ↑ androgeny. Mnemonik: CAH = 21 (prawie zawsze).", "options": [{"letter": "A", "text": "Niedobór ACTH", "correct": false}, {"letter": "B", "text": "Zespół Cushinga", "correct": false}, {"letter": "C", "text": "Niedobór 21-hydroksylazy", "correct": true}, {"letter": "D", "text": "Niedobór 11-hydroksylazy", "correct": false}, {"letter": "E", "text": "Somatotropinoma", "correct": false}], "type": "single"}, {"text": "Dziecko gorzej się uczy, częste omdlenia, nauczyciel zauważyła kaczkowaty chód. Co robimy?", "hint": "Kaczkowaty chód u dziecka = myśl o DMD. To choroba mięśni, nie OUN → TK/MR nie są potrzebne. CK ↑↑↑ → badania genetyczne → ocena serca (EKG/echo). Obiektywne objawy neurologiczne → nie psychiatra.", "options": [{"letter": "A", "text": "TK", "correct": true}, {"letter": "B", "text": "MR", "correct": false}, {"letter": "C", "text": "Pójść do psychiatry", "correct": false}, {"letter": "D", "text": "Pójść do psychologa", "correct": false}, {"letter": "E", "text": "Zmienić szkołę", "correct": false}], "correct_text": "Odpowiedź: Badanie CK (kinaza kreatynowa) → podejrzenie dystrofii mięśniowej Duchenne'a (DMD)", "type": "reveal_with_options"}, {"text": "7-letnia dziewczynka, niewysoką gorączka, nieproduktywny kaszel od 7 dni, 38°C, rzężenia, RTG: zmiany śródmiąższowe + powiększenie węzłów wnęk. Który lek?", "hint": "Klasyka atypowego zapalenia płuc (Mycoplasma pneumoniae): dziecko w wieku szkolnym + suchy kaszel + RTG „gorsze niż pacjent\". Mycoplasma nie ma ściany komórkowej → amoksycylina nie działa. Lek 1. wyboru = makrolid (azytromycyna).", "options": [{"letter": "A", "text": "Amoksycylina", "correct": false}, {"letter": "B", "text": "Metronidazol", "correct": false}, {"letter": "C", "text": "Cyprofloksacyna", "correct": false}, {"letter": "D", "text": "Biseptol", "correct": false}, {"letter": "E", "text": "Makrolid", "correct": true}], "type": "single"}, {"text": "Okres porodu od całkowitego rozwarcia szyjki macicy do urodzenia dziecka:", "hint": "I okres = skurcze → pełne rozwarcie. II okres = pełne rozwarcie → urodzenie dziecka. III okres = urodzenie dziecka → urodzenie łożyska. Mnemonik: I – otwarcie, II – wyjście dziecka, III – łożysko.", "options": [{"letter": "A", "text": "I", "correct": false}, {"letter": "B", "text": "II", "correct": true}, {"letter": "C", "text": "III", "correct": false}, {"letter": "D", "text": "IV", "correct": false}, {"letter": "E", "text": "V", "correct": false}], "type": "single"}, {"text": "75-letni pacjent, silny ból brzucha, wymioty, obrona mięśniowa, objaw Blumberga (+), TK: perforacja jelita grubego. Najczęstsza przyczyna:", "hint": "Perforacja jelita grubego u osoby starszej → najczęściej powikłanie diverticulitis. Uchyłki = najczęstsza patologia jelita grubego u starszych. Mnemonik: Starszy + perforacja jelita = uchyłki.", "options": [{"letter": "A", "text": "Rak jelita grubego", "correct": false}, {"letter": "B", "text": "Zapalenie uchyłków jelita grubego", "correct": true}, {"letter": "C", "text": "Niedokrwienie poprzecznicy", "correct": false}, {"letter": "D", "text": "Skręt esicy", "correct": false}, {"letter": "E", "text": "Perforacja w trakcie kolonoskopii", "correct": false}], "type": "single"}, {"text": "Który parametr KTG najlepiej świadczy o dobrym stanie płodu?", "hint": "Zmienność (variability) 5–25 uderzeń/min = najlepszy wskaźnik utlenowania i stanu OUN płodu. Desceleracje późne = niewydolność łożyska, zapis sinusoidalny = ciężka patologia (anemia płodu). Mnemonik: KTG dobre = zmienność jest.", "options": [{"letter": "A", "text": "Desceleracje późne", "correct": false}, {"letter": "B", "text": "Prawidłowa zmienność czynności serca płodu", "correct": true}, {"letter": "C", "text": "Bradykardia", "correct": false}, {"letter": "D", "text": "Tachykardia", "correct": false}, {"letter": "E", "text": "Sinusoidalny zapis KTG", "correct": false}], "type": "single"}, {"text": "Pacjent 26 lat, hemofilia A, czynnik VIII 3%, uraz głowy po upadku z drabiny. Przytomny, w kontakcie, brak deficytu neurologicznego. Co zrobić?", "hint": "Hemofilia A = niedobór czynnika VIII (nie IX!). Uraz głowy = potencjalnie zagrażający życiu → ZAWSZE czynnik + hospitalizacja. Dawka: 50 IU/kg × 70 kg = 3500 IU. Desmopresyna — tylko w postaci łagodnej (>5%), nie przy 3%.", "items": ["3500 IU czynnika VIII i.v. i do domu", "5600 IU czynnika IX i do domu", "Desmopresyna i do domu", "3500 IU czynnika IX i hospitalizacja"], "options": [{"letter": "1", "text": "3500 IU czynnika VIII i.v. i do domu", "correct": false}, {"letter": "2", "text": "5600 IU czynnika IX i do domu", "correct": false}, {"letter": "3", "text": "Desmopresyna i do domu", "correct": false}, {"letter": "4", "text": "3500 IU czynnika IX i hospitalizacja", "correct": false}, {"letter": "5", "text": "3500 IU czynnika VIII i hospitalizacja", "correct": true}], "type": "single"}, {"text": "Zmniejszenie poziomu estrogenu w okresie menopauzalnym może powodować wszystko Z WYJĄTKIEM:", "hint": "↓ estrogeny → ↓ gęstości kości (osteoporoza), a nie zwiększenie! Wszystko pozostałe — typowe następstwa menopauzy. Mnemonik: Menopauza = wszystko „słabnie\".", "options": [{"letter": "A", "text": "Wysiłkowe nietrzymanie moczu", "correct": false}, {"letter": "B", "text": "Zwiększenie gęstości kości", "correct": true}, {"letter": "C", "text": "Zwiększenie poziomu cholesterolu i LDL", "correct": false}, {"letter": "D", "text": "Nocne poty", "correct": false}, {"letter": "E", "text": "Zmniejszenie poznawczej aktywności i snu", "correct": false}], "type": "single"}, {"text": "Objaw Chvostka u noworodka:", "hint": "Objaw Chvostka = oznaka hipokalcemii (↓ Ca²⁺) — opukanie n. twarzowego → skurcz mięśni twarzy. U noworodka: objawowa hipokalcemia → pilne podanie Ca i.v. Wariant d) — to objaw Trousseau (inna rzecz). Mnemonik: Chvostek = Calcium low.", "options": [{"letter": "A", "text": "Występuje w hipofosfatemii", "correct": false}, {"letter": "B", "text": "Wymaga podania witaminy D3 w dawce uderzeniowej", "correct": false}, {"letter": "C", "text": "Wymaga podania wapnia dożylnie", "correct": true}, {"letter": "D", "text": "To skurcz mięśni dłoni (ręka położnika) po niedokrwieniu", "correct": false}, {"letter": "E", "text": "Występuje w hiperkalcemii", "correct": false}], "type": "single"}, {"text": "Przerzuty raka płuc umiejscawiają się przede wszystkim w:", "hint": "Rak płuca → przerzuty najczęściej: mózg, wątroba, kości, nadnercza. Nerki — znacznie rzadziej, dlatego nie E. Mnemonik: Płuca → mózg i wątroba.", "options": [{"letter": "A", "text": "Mózgu", "correct": false}, {"letter": "B", "text": "Wątrobie", "correct": false}, {"letter": "C", "text": "Nerkach", "correct": false}, {"letter": "D", "text": "A i B (mózg + wątroba)", "correct": true}, {"letter": "E", "text": "A, B i C", "correct": false}], "type": "single"}, {"text": "Najczęstszą przyczyną wtórnego braku miesiączki jest:", "hint": "PCOS = najczęstsze zaburzenie hormonalne u kobiet w wieku rozrodczym → anowulacja → brak regularnych cykli. Ale ZAWSZE najpierw wykluczamy ciążę! Następnie: PCOS → prolaktyna → tarczyca.", "options": [{"letter": "A", "text": "Niedoczynność tarczycy", "correct": false}, {"letter": "B", "text": "Guz przysadki", "correct": false}, {"letter": "C", "text": "Hiperprolaktynemia", "correct": false}, {"letter": "D", "text": "Zespół Ashermana", "correct": false}, {"letter": "E", "text": "PCOS", "correct": true}], "type": "single"}, {"text": "Do niskiego wzrostu nie prowadzi:", "hint": "Turner, Down, niedoczynność tarczycy, Prader-Willi → wszystkie dają niski wzrost. Marfan → odwrotnie: wysoki wzrost + długie kończyny + arachnodaktylia. Mnemonik: Marfan = „mega long\".", "items": ["Zespół Turnera", "Zespół Downa", "Niedoczynność tarczycy", "Zespół Pradera-Williego"], "options": [{"letter": "1", "text": "Zespół Turnera", "correct": false}, {"letter": "2", "text": "Zespół Downa", "correct": false}, {"letter": "3", "text": "Niedoczynność tarczycy", "correct": false}, {"letter": "4", "text": "Zespół Pradera-Williego", "correct": false}, {"letter": "5", "text": "Zespół Marfana", "correct": true}], "type": "single"}, {"text": "U dziecka częstoskurcz nadkomorowy. Co podawać i w jakiej kolejności?", "hint": "Algorytm SVT u dziecka: 1) Manewry wagotoniczne (Valsalva / zimna woda na twarz), 2) Adenozyna i.v., 3) Amiodaron, 4) Kardiowersja. Adrenaliny NIE stosuje się w SVT. Mnemonik: SVT = „Vagal → Adenosine → Shock\".", "options": [{"letter": "A", "text": "Adenozyna IV → amiodaron IV → sotalol IV → kardiowersja", "correct": true}, {"letter": "C", "text": "Zimna woda → Valsalva → adrenalina → amiodaron", "correct": false}, {"letter": "E", "text": "Valsalva → amiodaron → adenozyna → adrenalina", "correct": false}], "correct_text": "Najbliżej prawidłowego: A (ale prawidłowy algorytm: manewry wagalne → adenozyna → amiodaron → kardiowersja)", "type": "reveal_with_options"}, {"text": "Najczęściej rak jajników to:", "hint": "High-grade serous carcinoma (HGSC) → ~70% przypadków raka jajnika. Często związany z BRCA1/2. Mnemonik: Jajnik → surowiczy.", "options": [{"letter": "A", "text": "Gruczołowy", "correct": false}, {"letter": "B", "text": "Drobnokomórkowy", "correct": false}, {"letter": "C", "text": "Jasnokomórkowy", "correct": false}, {"letter": "D", "text": "Surowiczy (serous carcinoma)", "correct": true}, {"letter": "E", "text": "Płaskonabłonkowy", "correct": false}], "type": "single"}, {"text": "Stresowe wrzody po urazach OUN, oparzeniach lub operacjach najczęściej występują w:", "hint": "Wrzody stresowe (Cushing — po urazach OUN, Curling — po oparzeniach) → najczęściej żołądek + dwunastnica. Mnemonik: Stress → Stomach + Duodenum.", "items": ["Przełyku", "Jelicie cienkim", "Jelicie grubym"], "options": [{"letter": "1", "text": "Przełyku", "correct": false}, {"letter": "2", "text": "Żołądku", "correct": true}, {"letter": "3", "text": "Dwunastnicy", "correct": true}], "type": "multiple"}, {"text": "Które dziecko z zapaleniem płuc należy hospitalizować?", "hint": "Bezwzględne wskazania: wiek <6 mies. (wysokie ryzyko ciężkiego przebiegu) + brak opieki w domu (wskazanie społeczne). Gorączka 39 + wymioty = samo w sobie nie jest wskazaniem; saturacja >96% = norma.", "options": [{"letter": "A", "text": "Z gorączką 39°C i wymiotami", "correct": false}, {"letter": "B", "text": "Wiek < 6 miesięcy", "correct": true}, {"letter": "C", "text": "Saturacja >96%", "correct": false}, {"letter": "D", "text": "Brak zapewnionej opieki ze strony rodziców", "correct": true}], "type": "multiple"}, {"text": "O odwodnieniu ciężkim mówimy, gdy ubytek masy ciała dziecka przekracza:", "hint": "Klasyfikacja odwodnienia u dzieci: łagodne → do 5%, umiarkowane → 5–10%, ciężkie → >10%. Mnemonik: 5–10–>10.", "options": [{"letter": "A", "text": "2%", "correct": false}, {"letter": "B", "text": "10%", "correct": true}, {"letter": "C", "text": "1%", "correct": false}, {"letter": "D", "text": "5%", "correct": false}, {"letter": "E", "text": "7%", "correct": false}], "type": "single"}, {"text": "Mężczyzna, fala Pardeego w II, III, aVF (STEMI dolnej ściany), dzień wcześniej wziął sildenafil. Przedszpitalne leczenie — wszystko OPRÓCZ:", "hint": "Sildenafil (inhibitor PDE-5) + nitrogliceryna (azotany) = ciężka hipotensja, nawet wstrząs → bezwzględne przeciwwskazanie! Sildenafil aktywny <24h. Mnemonik: „Sildenafil = NO nitrates 24h\".", "items": ["β-bloker p.o.", "Morfina", "Tlenoterapia", "ASA"], "options": [{"letter": "1", "text": "β-bloker p.o.", "correct": false}, {"letter": "2", "text": "Morfina", "correct": false}, {"letter": "3", "text": "Nitrogliceryna s.l.", "correct": true}, {"letter": "4", "text": "ASA", "correct": false}], "type": "single"}, {"text": "Pacjent z bezbolesną makroskopową hematurią. Co należy zrobić?", "hint": "Bezbolesny makroskopowy krwiomocz = objaw alarmowy → podejrzenie raka pęcherza. Cystoskopia — badanie pierwszego wyboru (wizualizacja + biopsja). Mnemonik: Bezbolesny krwiomocz = rak pęcherza → cystoskopia.", "options": [{"letter": "A", "text": "USG", "correct": false}, {"letter": "B", "text": "Badanie ogólne moczu + antybiotyki", "correct": false}, {"letter": "C", "text": "Nefrektomia", "correct": false}, {"letter": "D", "text": "Uroskopia (cystoskopia)", "correct": true}, {"letter": "E", "text": "Podwiązanie tętnicy nerkowej", "correct": false}], "type": "single"}, {"text": "Najczęstsze przyczyny wielowodzia: 1) Dysrafia (np. bezmózgowie) 2) Cukrzyca u matki 3) Niedorozwój nerek płodu Правильная комбинация: 1 + 2", "hint": "Wielowodzie = ↑ produkcji lub ↓ połykania płynu owodniowego. Dysrafia → ↓ połykanie. Cukrzyca → ↑ diureza płodu. Niedorozwój nerek → ↓ mocz → to MAŁOWODZIE, nie wielowodzie!", "options": [{"letter": "1", "text": "Dysrafia (np. bezmózgowie)", "correct": true}, {"letter": "2", "text": "Cukrzyca u matki**</u> 3) Niedorozwój nerek płodu", "correct": true}], "type": "multiple"}, {"text": "Przyczyny poliurii — wszystko oprócz:", "hint": "Hipokaliemia, psychogenna polidypsja, moczówka nerkowa/centralna → wszystkie powodują poliurię. HIPOkalcemia NIE powoduje poliurii. Pułapka: HIPERkalcemia → powoduje poliurię. Mnemonik: hypo-Ca ≠ poliuria.", "items": ["Hipokaliemia", "Psychogenna polidypsja", "Moczówka nerkowa", "Moczówka centralna"], "options": [{"letter": "1", "text": "Hipokaliemia", "correct": false}, {"letter": "2", "text": "Psychogenna polidypsja", "correct": false}, {"letter": "3", "text": "Moczówka nerkowa", "correct": false}, {"letter": "4", "text": "Moczówka centralna", "correct": false}, {"letter": "5", "text": "Hipokalcjemia", "correct": true}], "type": "single"}, {"text": "Ciężarna 28 tc, OGTT: na czczo 92, po 1h — 173, po 2h — 150. Wynik?", "hint": "Kryteria OGTT w ciąży (WHO/IADPSG): na czczo ≥92, 1h ≥180, 2h ≥153. Wystarczy JEDEN wynik ≥ progowy. Tu: na czczo = 92 → ≥92 → GDM. Mnemonik: „92–180–153 → jeden przekroczony = GDM\".", "options": [{"letter": "A", "text": "Nie podejmować żadnych decyzji — wynik prawidłowy", "correct": false}], "correct_text": "Odpowiedź: Cukrzyca ciążowa (GDM) — wynik NIEPRAWIDŁOWY", "type": "reveal_with_options"}, {"text": "Kobieta z HFrEF, duszność, obrzęk płuc. Leki 1. rzutu: Furosemid i.v. + Nitroprusydek sodu", "hint": "Ostry obrzęk płuc: tlen + furosemid i.v. (↓ zastój) + wazodylatator. Wazodylatator 1. wyboru = nitrogliceryna/azotany i.v. (↓ preload). Nitroprusydek — głównie przy ciężkim nadciśnieniu lub rozwarstwieniu aorty (↓ afterload). WARUNEK: wazodylatatory tylko przy prawidłowym/wysokim RR — przy hipotensji/wstrząsie → dobutamina. Mnemonik: High BP → wazodylatacja, Low BP → leki inotropowe.", "options": [], "correct_text": "Furosemid i.v. + Nitroprusydek sodu", "type": "reveal"}, {"text": "Gruźlica — leki w fazie kontynuacji leczenia:", "hint": "Leczenie gruźlicy: faza intensywna (2 mies.) = HRZE, faza kontynuacji (4 mies.) = tylko HR (izoniazyd + ryfampicyna). Pirazynamid i etambutol — tylko w fazie intensywnej. Mnemonik: Start HRZE → potem HR.", "options": [{"letter": "A", "text": "Izoniazyd", "correct": true}, {"letter": "B", "text": "Ryfampicyna", "correct": true}, {"letter": "C", "text": "Pirazynamid", "correct": false}, {"letter": "D", "text": "Nidrazid", "correct": false}, {"letter": "E", "text": "Etambutol", "correct": false}], "type": "multiple"}, {"text": "Pacjent z chorobą Addisona, hydrokortyzon 30mg/d (20+10mg). Zaplanowana ekstrakcja zęba. Jakie działania?", "hint": "Ekstrakcja zęba = mały stres → wystarczy dodatkowa dawka per os (+20 mg). 100 mg i.v. = duży stres (operacja/sepsa). Nic nie zmieniać = ryzyko przełomu nadnerczowego. Mnemonik: mały stres → p.o., duży → i.v.", "items": ["100mg hydrokortyzonu i.v. i od następnego dnia normalnie", "…", "…", "Nic nie zmieniać"], "options": [{"letter": "1", "text": "100mg hydrokortyzonu i.v. i od następnego dnia normalnie", "correct": false}, {"letter": "2", "text": "…", "correct": false}, {"letter": "3", "text": "…", "correct": false}, {"letter": "4", "text": "1 godzinę przed zabiegiem dodatkowe +20mg per os i 20mg o 15:00", "correct": true}], "type": "single"}, {"text": "Nie jest przyczyną żółtaczki przedwątrobowej:", "hint": "Żółtaczka przedwątrobowa = hemoliza (rozpad erytrocytów). HCV = wątrobowa, muchomor = toksyczna/wątrobowa, Budd-Chiari = zastój wątrobowy, kamica = mechaniczna/pozawątrobowa. Mnemonik: Przedwątrobowa = hemoliza, reszta → wątroba lub drogi żółciowe.", "options": [{"letter": "A", "text": "HCV", "correct": false}, {"letter": "B", "text": "Zatrucie muchomorem", "correct": false}, {"letter": "C", "text": "Zespół Budd-Chiari", "correct": false}, {"letter": "D", "text": "Kamica dróg żółciowych", "correct": false}], "correct_text": "Odpowiedź: ŻADEN z wymienionych nie jest przyczyną żółtaczki przedwątrobowej (wszystkie powyższe)", "type": "reveal_with_options"}, {"text": "Najczęstszy nowotwór złośliwy u dzieci to:", "hint": "Top nowotwory u dzieci: białaczki (nr 1!) → guzy OUN → chłoniaki. Spośród podanych opcji (bez białaczki) → chłoniak jest najczęstszy. Mnemonik: Dzieci = białaczka → mózg → chłoniak.", "options": [{"letter": "A", "text": "Rakowiak", "correct": false}, {"letter": "B", "text": "RCC", "correct": false}, {"letter": "C", "text": "Guz Wilmsa", "correct": false}, {"letter": "D", "text": "Guz liściasty", "correct": false}, {"letter": "E", "text": "Chłoniak", "correct": true}], "type": "single"}, {"text": "PALM-COEIN — do przyczyn nieprawidłowych krwawień macicznych NIE należy:", "hint": "PALM = Polip, Adenomioza, Leiomyoma, Malignancy. COEIN = Coagulopathy, Ovulatory, Endometrial, Iatrogenic, Not classified. Endometrioza ≠ Endometrial (E w COEIN). Endometrioza to inna choroba, nie wchodzi do klasyfikacji PALM-COEIN.", "options": [{"letter": "A", "text": "Zaburzenia owulacji", "correct": false}, {"letter": "B", "text": "Mięśniaki macicy", "correct": false}, {"letter": "C", "text": "Endometrioza", "correct": true}], "type": "single"}, {"text": "Mleczne zęby u dziecka — co prawidłowo? 1) 20 mlecznych zębów, pierwszy ząb w 6 mies., w 1 rok ≥8 zębów 2) 32 zęby, pierwszy w 6 mies., w 1 rok ≥28 3) 32 zęby, pierwszy w 3 mies., w 1 rok ≥20 4) 12 zębów, pierwszy w 6 mies., w 1 rok ≥4 5) 20 zębów, pierwszy w 3 mies., w 1 rok ≥20", "hint": "20 zębów mlecznych (nie 32 — to stałe). Pierwszy ząb ~6 mies. W 1. roku życia zwykle ~6–8 zębów (górna granica ~8 jest prawidłowa). Pełny komplet mleczny ~2,5–3 lat. Spośród opcji tylko „20 zębów + pierwszy w 6 mies.\" jest fizjologiczne. Mnemonik: „6–8–20\".", "options": [{"letter": "1", "text": "20 mlecznych zębów, pierwszy ząb w 6 mies., w 1 rok ≥8 zębów**</u> 2) 32 zęby, pierwszy w 6 mies., w 1 rok ≥28 3) 32 zęby, pierwszy w 3 mies., w 1 rok ≥20 4) 12 zębów, pierwszy w 6 mies., w 1 rok ≥4 5) 20 zębów, pierwszy w 3 mies., w 1 rok ≥20", "correct": true}], "type": "single"}, {"text": "Brak podniesienia jednej lewej połowy klatki piersiowej może być spowodowany:", "hint": "Fibrotorax → usztywnienie opłucnej → brak ruchu. Flail chest → paradoksalne ruchy. Odma → zapadnięcie płuca. Ciąża → wpływa globalnie, nie jednostronnie.", "items": ["Dużą ilością płynu w lewej jamie opłucnowej", "Lewostronny fibrotorax", "Zaawansowana ciąża", "Złamanie 4 żeber w 2 miejscach (flail chest)", "Odma lewostronna"], "options": [{"letter": "1", "text": "Dużą ilością płynu w lewej jamie opłucnowej", "correct": false}, {"letter": "2", "text": "Lewostronny fibrotorax", "correct": true}, {"letter": "3", "text": "Zaawansowana ciąża", "correct": false}, {"letter": "4", "text": "Złamanie 4 żeber w 2 miejscach (flail chest)", "correct": true}, {"letter": "5", "text": "Odma lewostronna", "correct": true}], "correct_text": "Kombinacja: b) 2, 4, 5", "type": "reveal_with_options"}, {"text": "Pacjent z nawrotową obustronną przepukliną pachwinową, już operowany kilkakrotnie metodą Bassiniego. Co zrobić?", "hint": "Przy nawrocie po operacji otwartej → wybieramy dostęp laparoskopowy (TAPP). TAPP omija blizny po poprzednich operacjach, lepszy przy nawrotach i obustronnych przepuklinach. Mnemonik: Nawrót po operacji otwartej → laparoskopia.", "items": ["Operacja metodą Lichtensteina", "Powtórna operacja Bassiniego", "Laparoskopia (ogólnie)", "…"], "options": [{"letter": "1", "text": "Operacja metodą Lichtensteina", "correct": false}, {"letter": "2", "text": "TAPP (laparoskopowo)", "correct": true}, {"letter": "3", "text": "Laparoskopia (ogólnie)", "correct": false}, {"letter": "4", "text": "…", "correct": false}], "type": "single"}, {"text": "Pacjent, dwukrotnie TIA, TK głowy bez zmian. Co zrobić? 1) USG tętnic szyi 2) RM głowy 3) Arteriografia łuku aorty 4) … 5) Nic nie robić", "hint": "Nawracające TIA + TK bez zmian → najczęstsza przyczyna: zwężenie tętnicy szyjnej. USG Doppler tętnic szyjnych = pierwsze badanie: nieinwazyjne, szybkie, przesiewowe. Mnemonik: TIA = sprawdź tętnice szyjne.", "options": [{"letter": "1", "text": "USG tętnic szyi**</u> 2) RM głowy 3) Arteriografia łuku aorty 4) … 5) Nic nie robić", "correct": true}], "type": "single"}, {"text": "Nie wchodzi do rotterdamskich kryteriów PCOS:", "hint": "Kryteria Rotterdam (≥2 z 3): 1) Oligo/anowulacja, 2) Hiperandrogenizm, 3) USG PCOS. Cukrzyca/insulinooporność często współwystępują, ale NIE wchodzą do kryteriów diagnostycznych.", "options": [{"letter": "A", "text": "Cechy PCOS widoczne na USG", "correct": false}, {"letter": "B", "text": "Cukrzyca i insulinooporność", "correct": true}, {"letter": "C", "text": "Nieregularne miesiączki/brak miesiączki", "correct": false}, {"letter": "D", "text": "…", "correct": false}, {"letter": "E", "text": "Wszystko należy", "correct": false}], "type": "single"}, {"text": "Szczepionka przeciw gruźlicy (BCG):", "hint": "BCG NIE chroni skutecznie przed zakażeniem ani transmisją. Chroni przed ciężkimi postaciami u dzieci: gruźlica rozsiana (prosówkowa) + gruźlicze zapalenie opon mózgowo-rdzeniowych. Mnemonik: BCG = chroni przed ciężką gruźlicą u dzieci.", "options": [{"letter": "A", "text": "Zmniejsza ryzyko rozsianej gruźlicy", "correct": false}, {"letter": "B", "text": "Pomaga nie zachorować", "correct": false}, {"letter": "C", "text": "Pomaga nie rozprzestrzeniać choroby", "correct": false}, {"letter": "D", "text": "Pomaga nie zachorować na ciężkie formy choroby", "correct": true}, {"letter": "E", "text": "Wszystko powyższe", "correct": false}], "type": "single"}, {"text": "Szmer holosystoliczny (słyszalny przez całą skurcz) może występować w:", "hint": "Holosystoliczny = regurgitacja/przepływ przez całą fazę skurczu. Przyczyny: MR, TR, VSD. Stenozy (mitralna, trójdzielna) → szmery rozkurczowe. ASD → szmer przepływowy, nie holosystoliczny. Mnemonik: Holosystolic = regurgitacja (MR, TR) + przeciek (VSD).", "items": ["Niedomykalność zastawki mitralnej", "Stenoza zastawki mitralnej", "Niedomykalność zastawki trójdzielnej", "Stenoza zastawki trójdzielnej", "Defekt przegrody międzykomorowej (VSD)", "Defekt przegrody międzyprzedsionkowej (ASD)"], "options": [{"letter": "1", "text": "Niedomykalność zastawki mitralnej", "correct": true}, {"letter": "2", "text": "Stenoza zastawki mitralnej", "correct": false}, {"letter": "3", "text": "Niedomykalność zastawki trójdzielnej", "correct": true}, {"letter": "4", "text": "Stenoza zastawki trójdzielnej", "correct": false}, {"letter": "5", "text": "Defekt przegrody międzykomorowej (VSD)", "correct": true}, {"letter": "6", "text": "Defekt przegrody międzyprzedsionkowej (ASD)", "correct": false}], "correct_text": "Prawidłowa kombinacja: 1, 3, 5 (MR + TR + VSD)", "type": "reveal_with_options"}, {"text": "Palce pałeczkowate nie występują w chorobie:", "hint": "Pułapka! Pomimo hipoksji w POChP, palce pałeczkowate NIE są charakterystyczne. Jeśli pacjent z POChP ma clubbing → szukaj raka płuca lub rozstrzeni oskrzeli. Mnemonik: Clubbing ≠ COPD → think cancer.", "options": [{"letter": "A", "text": "POChP", "correct": true}, {"letter": "B", "text": "WZJG", "correct": false}, {"letter": "C", "text": "Choroba Gravesa-Basedowa", "correct": false}, {"letter": "D", "text": "Siniczne wady serca", "correct": false}, {"letter": "E", "text": "RZS", "correct": false}], "type": "single"}, {"text": "Pacjent 78 lat, ból lewej kończyny po 30 metrach chodzenia, tętno wyczuwalne, TK: zwężenie lewej tętnicy biodrowej zewnętrznej. Co zrobić?", "hint": "Chromanie po 30 m = Fontaine IIb (ciężkie). Lokalizacja: tętnica biodrowa → idealna do leczenia wewnątrznaczyniowego. Kontrolne TK = zbyt pasywne, leki = nie rozwiązują zwężenia. Mnemonik: Claudicatio <50 m → myśl o zabiegu.", "options": [{"letter": "A", "text": "Kontrolne TK za 2–3 miesiące", "correct": false}, {"letter": "B", "text": "Przezskórna angioplastyka (stent)", "correct": true}, {"letter": "C", "text": "…", "correct": false}, {"letter": "D", "text": "…", "correct": false}, {"letter": "E", "text": "Leki przeciwzakrzepowe", "correct": false}], "type": "single"}, {"text": "Kobieta: świąd, biała twarogowata wydzielina, pH pochwy 4.0–4.5 (norma). 1) Kandydoza 2) Chlamydia 3) Bakterialna waginoza 4) … 5) …", "hint": "Klasyczna triada Candida: świąd + twarogowa wydzielina + prawidłowe pH. Bakteryjna waginoza → szara wodnista wydzielina, rybi zapach, pH >4.5. Chlamydia → skąpe objawy. Mnemonik: Candida = twaróg + świąd + prawidłowe pH.", "options": [{"letter": "1", "text": "Kandydoza**</u> 2) Chlamydia 3) Bakterialna waginoza 4) … 5) …", "correct": true}], "type": "single"}, {"text": "Kobieta, duszność przy podejściu na 2 piętro, 400m po płaskiej powierzchni. Stopień wg CCS?", "hint": "CCS I = tylko duży wysiłek. CCS II = szybkie chodzenie, schody, ~200–400 m. CCS III = <200 m, 1 piętro. CCS IV = spoczynek. 2 piętra + 400 m = CCS II.", "items": ["I", "III", "IV", "V"], "options": [{"letter": "1", "text": "I", "correct": false}, {"letter": "2", "text": "II", "correct": true}, {"letter": "3", "text": "IV", "correct": false}, {"letter": "4", "text": "V", "correct": false}], "type": "single"}, {"text": "Rdzeniasty rak tarczycy — jakie objawy?", "hint": "Rak rdzeniasty (MTC) — pochodzi z komórek C → kalcytonina ↑ → biegunki. Twarda tarczyca = typowo dla nowotworu. Bolesność = de Quervain, nie rak. MTC często występuje w zespole MEN2.", "items": ["Szybki rozrost tarczycy z zajęciem tkanek otaczających", "Oznaki zapalne tarczycy, bolesna na dotyk"], "options": [{"letter": "1", "text": "Szybki rozrost tarczycy z zajęciem tkanek otaczających", "correct": false}, {"letter": "2", "text": "Oznaki zapalne tarczycy, bolesna na dotyk", "correct": false}, {"letter": "3", "text": "Bardzo twarda tarczyca", "correct": true}], "type": "single"}, {"text": "Pacjent 68 lat, po zawale, bóle mięśni, CK ↑ ×3, przyjmuje statyny. Co zrobić?", "hint": "CK ×3 = <4× ULN (próg ESC/EAS dla rozważenia odstawienia to ≥4× ULN). Przy CK <4× ULN i tolerowanych objawach można KONTYNUOWAĆ statynę. Przy objawach uciążliwych → tymczasowe odstawienie + kontrola CK + rechallenge (inna statyna/niższa dawka/ezetymib). U pacjenta PO ZAWALE nigdy nie rezygnujemy ze statyny na stałe. Odpowiedź „tymczasowe odstawienie + monitoring\" jest najpełniejsza klinicznie.", "items": ["Koniecznie odstawić", "Odstawić i zastąpić czymś innym", "Nie odstawiać (wzrost nieznaczny)", "…"], "options": [{"letter": "1", "text": "Koniecznie odstawić", "correct": false}, {"letter": "2", "text": "Odstawić i zastąpić czymś innym", "correct": false}, {"letter": "3", "text": "Nie odstawiać (wzrost nieznaczny)", "correct": false}, {"letter": "4", "text": "Odstawić na 6 tygodni, kontrolować CK, dalsze działania zależnie od wyników", "correct": true}], "type": "single"}, {"text": "Leczenie hiperkaliemii — wszystko OPRÓCZ:", "hint": "Aldacton (spironolakton) = diuretyk oszczędzający potas → POGARSZA hiperkaliemię! Glukoza+insulina = przesuwają K⁺ do komórek, wapń = stabilizuje serce, hemodializa = usuwa K⁺, polistyren = wiąże K⁺ w jelitach.", "options": [{"letter": "A", "text": "Glukoza + insulina i.v.", "correct": false}, {"letter": "B", "text": "10% chlorek wapnia", "correct": false}, {"letter": "C", "text": "Hemodializa", "correct": false}, {"letter": "D", "text": "Aldacton (spironolakton)", "correct": true}, {"letter": "E", "text": "Sulfonian polistyrenu", "correct": false}], "type": "single"}, {"text": "Rak Pancoasta z objawami zespołu Hornera to rak:", "hint": "Pancoast = rak szczytu (apex) płuca. Naciekanie splotu współczulnego → zespół Hornera (ptosis + miosis + anhidrosis). Mnemonik: Pancoast = Peak (szczyt) → Horner.", "options": [{"letter": "A", "text": "…", "correct": false}, {"letter": "B", "text": "…", "correct": false}, {"letter": "C", "text": "Rak szczytu płuca", "correct": true}, {"letter": "D", "text": "…", "correct": false}, {"letter": "E", "text": "…", "correct": false}], "type": "single"}, {"text": "Najczęstszą przyczyną zapalenia mięśnia sercowego u dzieci >1 r.ż. jest:", "hint": "Najczęstsza przyczyna myocarditis u dzieci = wirusy: Coxsackie B (klasyka), adenowirusy, parwowirus B19. Mnemonik: Myocarditis = myśl o wirusach.", "options": [{"letter": "A", "text": "Autoimmune", "correct": false}, {"letter": "B", "text": "Wirusowa (np. Coxsackie)", "correct": true}, {"letter": "C", "text": "Bakteryjna (np. Streptococcus)", "correct": false}, {"letter": "D", "text": "Grzybicza (np. Aspergillus)", "correct": false}, {"letter": "E", "text": "…", "correct": false}], "type": "single"}, {"text": "Reguła Wallace'a to reguła:", "hint": "Reguła dziewiątek — ocena powierzchni oparzeń (TBSA). Ciało dzieli się na okolice po 9% lub wielokrotnościach: głowa 9%, każda ręka 9%, przód 18%, tył 18%, każda noga 18%. Mnemonik: Wallace = 9.", "items": ["Siódemek", "Ósemek", "Dziesiątek", "Żadna z powyższych"], "options": [{"letter": "1", "text": "Siódemek", "correct": false}, {"letter": "2", "text": "Ósemek", "correct": false}, {"letter": "3", "text": "Dziewiątek", "correct": true}, {"letter": "4", "text": "Żadna z powyższych", "correct": false}], "type": "single"}, {"text": "Nawrotowy przerzutowy rak szyjki macicy — kiedy pembrolizumab?", "hint": "CPS (Combined Positive Score) = (komórki PD-L1+ / wszystkie komórki) × 100. CPS ≥1 → kwalifikuje do pembrolizumabu. Zwykle w skojarzeniu z chemioterapią ± bewacyzumab.", "options": [], "correct_text": "Odpowiedź: Pembrolizumab (immunoterapia) przy PD-L1 dodatnim, CPS ≥ 1", "type": "reveal"}, {"text": "Pacjentka z chorobą wrzodową oporną na IPP, biegunki, ↑ gastryna, guz w ogonie trzustki 1cm. Postępowanie:", "hint": "Klasyczny Zollinger-Ellison (gastrinoma): wrzody oporne na IPP + biegunki + ↑ gastryna + guz trzustki. Jeśli guz zlokalizowany i resekcyjny → operacja (usunięcie guza). Somatostatyna → tylko przy nieoperacyjnym/przerzutowym. Mnemonik: Zollinger = usuń gastrinomę.", "options": [{"letter": "A", "text": "Antrumektomia + wagotomia", "correct": false}, {"letter": "B", "text": "Gastrektomia", "correct": false}, {"letter": "C", "text": "Usunięcie guza trzustki", "correct": true}, {"letter": "D", "text": "Leczenie somatostatyną", "correct": false}, {"letter": "E", "text": "…", "correct": false}], "type": "single"}, {"text": "Leczenie choroby Hirschsprunga:", "hint": "Hirschsprung = brak komórek zwojowych (aganglioza) → brak perystaltyki. Leczenie: usunięcie odcinka bezzwojowego + zespolenie zdrowego (pull-through). Makrogole = leczenie objawowe, nie rozwiązują problemu. Mnemonik: Hirschsprung = brak zwojów → wytnij ten odcinek.", "options": [{"letter": "A", "text": "Przewlekłe makrogole", "correct": false}, {"letter": "B", "text": "Całkowite usunięcie jelita grubego", "correct": false}, {"letter": "C", "text": "Usunięcie bezzwojowego odcinka jelita grubego", "correct": true}, {"letter": "D", "text": "Poszerzenie zwężonej części jelita cienkiego", "correct": false}, {"letter": "E", "text": "…", "correct": false}], "type": "single"}, {"text": "61-letnia pacjentka z chorobą niedokrwienną serca, ból dławicowy po wejściu na 2 piętro + przejściu 400m po płaskim. Klasyfikacja CCS?", "hint": "CCS II = niewielkie ograniczenie: objawy przy szybkim chodzeniu, schodach, 200–400 m. CCS III = <200 m lub 1 piętro. 2 piętra + 400 m → CCS II.", "options": [{"letter": "A", "text": "IV", "correct": false}, {"letter": "B", "text": "V", "correct": false}, {"letter": "C", "text": "III", "correct": false}, {"letter": "D", "text": "II", "correct": true}, {"letter": "E", "text": "I", "correct": false}], "type": "single"}, {"text": "Które mogą być przyczynami chylotoraksu?", "hint": "Chylothorax = obecność chłonki w jamie opłucnej. Wszystko, co blokuje lub uszkadza przewód piersiowy, może to spowodować: uraz, nowotwory, niewydolność serca, infekcje, wady wrodzone, marskość wątroby (↑ ciśnienia → przeciek).", "items": ["Uszkodzenie przewodu piersiowego", "Złośliwe nowotwory", "Niewydolność serca", "Gruźlica/infekcje", "Wrodzone wady przewodu piersiowego", "Marskość wątroby z wodobrzuszem"], "options": [{"letter": "1", "text": "Uszkodzenie przewodu piersiowego", "correct": true}, {"letter": "2", "text": "Złośliwe nowotwory", "correct": false}, {"letter": "3", "text": "Niewydolność serca", "correct": false}, {"letter": "4", "text": "Gruźlica/infekcje", "correct": false}, {"letter": "5", "text": "Wrodzone wady przewodu piersiowego", "correct": false}, {"letter": "6", "text": "Marskość wątroby z wodobrzuszem", "correct": false}], "correct_text": "Odpowiedź: 1. Wszystkie", "type": "reveal_with_options"}, {"text": "4-miesięczne dziecko: żółta skóra, przepuklina pępkowa, wiotkość mięśni, niepokój, biegunka, duży język. Diagnoza? 1) Wrodzona niedoczynność tarczycy 2) Galaktozemia 3) Mukowiscydoza 4) Pierwotna marskość żółciowa 5) Choroba Addisona", "hint": "Klasyczny obraz hipotyreozy wrodzonej: przedłużona żółtaczka + przepuklina pępkowa + hipotonia + makroglosja + sucha skóra + ZAPARCIA (nie biegunka!) + ospałość. Galaktozemia → hepatomegalia/wymioty/sepsa. Mukowiscydoza → objawy oddechowe/stolce tłuszczowe. UWAGA: w pytaniu podano „biegunka\" — to objaw ATYPOWY dla hipotyreozy (typowe są zaparcia) — prawdopodobnie błąd zapisu. Mnemonik: duży język + przepuklina + żółtaczka = tarczyca.", "options": [{"letter": "1", "text": "Wrodzona niedoczynność tarczycy**</u> 2) Galaktozemia 3) Mukowiscydoza 4) Pierwotna marskość żółciowa 5) Choroba Addisona", "correct": true}], "type": "single"}, {"text": "52-letnia kobieta, krwawienie po ostatniej miesiączce. Jakie postępowanie w pierwszej kolejności?", "hint": "Krwawienie pomenopauzalne = objaw alarmowy → podejrzenie raka endometrium. Biopsja endometrium = badanie pierwszego wyboru (pipelle). Cytologia szyjki macicy nie diagnozuje raka endometrium. Mnemonik: Krwawienie po menopauzie = rak endometrium, dopóki nie udowodnisz inaczej.", "options": [{"letter": "A", "text": "Biopsja endometrium", "correct": true}, {"letter": "B", "text": "USG przezbrzuszne", "correct": false}, {"letter": "C", "text": "Obserwacja", "correct": false}, {"letter": "D", "text": "Cytologia tarczycy", "correct": false}, {"letter": "E", "text": "Cytologia szyjki macicy", "correct": false}], "type": "single"}, {"text": "Który hormon produkowany przez trzustkę obniża poziom cukru?", "hint": "Insulina = jedyny hormon obniżający glikemię (produkowany przez komórki β trzustki). Kortyzol, adrenalina, glukagon → wszystkie podwyższają glikemię. Mnemonik: Insulina = „wpuszcza cukier do komórek\".", "options": [{"letter": "A", "text": "Kortyzol", "correct": false}, {"letter": "B", "text": "Tyrozyna", "correct": false}, {"letter": "C", "text": "Adrenalina", "correct": false}, {"letter": "D", "text": "Glukagon", "correct": false}, {"letter": "E", "text": "Insulina", "correct": true}], "type": "single"}, {"text": "Ciężarna: nagły ból brzucha, macica „napięta jak kamień\", tkliwa, ciemna krew. Diagnoza?", "hint": "Klasyczna triada: nagły ból + twarda macica (hipertonia) + ciemna krew = odklejenie łożyska. Vasa previa = jasna krew + bez bólu. Pęknięcie macicy = utrata czynności skurczowej. Mnemonik: Abruptio = ból + twarda macica + ciemna krew.", "options": [{"letter": "A", "text": "Vasa previa", "correct": false}, {"letter": "B", "text": "Przedwczesne odklejanie łożyska", "correct": true}, {"letter": "C", "text": "Pęknięcie macicy", "correct": false}, {"letter": "D", "text": "…", "correct": false}, {"letter": "E", "text": "…", "correct": false}], "type": "single"}, {"text": "15-miesięczna dziewczynka, gorączka, drgawki trwające 15 minut. Co podać?", "hint": "Drgawki ≥5 min = napad przedłużony → przerwać napad! Lek 1. wyboru = benzodiazepina (diazepam/Relanium). Paracetamol → lek przeciwgorączkowy, nie przeciwdrgawkowy. ASA → przeciwwskazany u dzieci (zespół Reye'a). Adrenalina → anafilaksja, nie drgawki.", "options": [{"letter": "A", "text": "Paracetamol doodbytniczo 10–15 mg/kg", "correct": false}, {"letter": "B", "text": "Kwas acetylosalicylowy 10 mg/kg", "correct": false}, {"letter": "C", "text": "Adrenalina i.m. 0,01 mg/kg", "correct": false}, {"letter": "D", "text": "Relanium (diazepam) doodbytniczo/i.v. 0,2–0,5 mg/kg", "correct": true}, {"letter": "E", "text": "Antybiotyki o szerokim spektrum", "correct": false}], "type": "single"}, {"text": "5-letni chłopczyk, nie chce chodzić do przedszkola, stan podgorączkowy, liczne wybroczyny na szyi, rozległe podbiegnięcia krwawe na kończynach dolnych. Co zrobić?", "hint": "Wybroczyny + podbiegnięcia krwawe bez urazu + stan podgorączkowy + zmiana zachowania = red flag → podejrzenie choroby hematologicznej (np. białaczki). Szukamy: ↓ płytki, ↓ Hb, obecność blastów. Mnemonik: wybroczyny + siniaki bez urazu = krew (hematologia).", "options": [], "correct_text": "Odpowiedź: Morfologia krwi z rozmazem", "type": "reveal"}, {"text": "20-letni pacjent, USG: guz 3 cm po linii pośrodkowej powyżej chrząstki tarczowatej, bez objawów, tylko powiększony obwód szyi. Co to?", "hint": "Guz w linii pośrodkowej szyi + powyżej chrząstki tarczowatej + młody pacjent = torbiel przewodu tarczowo-językowego. Przesuwa się przy połykaniu i wysuwaniu języka. Przerzuty → lokalizacja boczna. Mnemonik: środek szyi = torbiel, bocznie = węzły/nowotwór.", "options": [{"letter": "A", "text": "Przytarczyca górna", "correct": false}, {"letter": "B", "text": "Przerzut nowotworowy", "correct": false}, {"letter": "C", "text": "Promienica", "correct": false}, {"letter": "D", "text": "Dodatkowa tarczyca", "correct": false}, {"letter": "E", "text": "Torbiel środkowa szyi — pozostałość przewodu językowo-tarczycowego", "correct": true}], "type": "single"}, {"text": "Leukostaza to:", "hint": "Leukostaza = wysoka leukocytoza (>100 000/µl) → ↑ lepkość krwi → komórki „zatykają\" mikrokrążenie (kapilary). Nie zakrzep, nie makronaczynia. Objawy: neurologiczne, duszność, zaburzenia widzenia. Mnemonik: LeukoSTAZA = zastój w małych naczyniach.", "options": [{"letter": "A", "text": "Zator naczyniowy spowodowany skrzepem leukocytów (>100 000)", "correct": false}, {"letter": "B", "text": "…", "correct": false}, {"letter": "C", "text": "…", "correct": false}, {"letter": "D", "text": "Zastój w makronaczyniach", "correct": false}, {"letter": "E", "text": "Zastój w mikronaczyniach", "correct": true}], "type": "single"}, {"text": "Niekorzystny czynnik w przebiegu ostrego zapalenia trzustki (OZT):", "hint": "BUN >20–25 mg/dl = zły czynnik prognostyczny w OZT. Wiek → ryzyko ↑ zwykle >55 lat. BMI 29 → nadwaga, ale ciężkie ryzyko dopiero >30–35. Brak zaburzeń elektrolitowych = dobrze. Mnemonik: OZT ciężkie = BUN rośnie.", "options": [{"letter": "A", "text": "Wiek 52 lata", "correct": false}, {"letter": "B", "text": "BUN > 22", "correct": true}, {"letter": "C", "text": "BMI = 29", "correct": false}, {"letter": "D", "text": "Niealkoholowe pochodzenie choroby", "correct": false}, {"letter": "E", "text": "Brak zaburzeń elektrolitowych", "correct": false}], "type": "single"}, {"text": "Nadczynność tarczycy — czego nie dajemy: GKS, β-blokery, jod, tiamazol?", "hint": "Tiamazol → hamuje syntezę hormonów. β-blokery → kontrola objawów. Jod → przełom tarczycowy/przed operacją. GKS → przełom tarczycowy/orbitopatia. Jeśli w teście pytanie „czego nie dajemy\" → odpowiedź „żadne z powyższych\".", "options": [], "correct_text": "Odpowiedź: Wszystkie wymienione MOGĄ być stosowane (w zależności od sytuacji klinicznej)", "type": "reveal"}, {"text": "Lek, który NIE stosuje się w leczeniu kontynuującym gruźlicy:", "hint": "Faza kontynuacji (4 mies.) = tylko H + R (izoniazyd + ryfampicyna). Pyrazynamid ORAZ Etambutol → tylko faza intensywna (2 mies.). Nidrazid = izoniazyd → stosowany w kontynuacji. UWAGA: zarówno Pyrazynamid jak i Etambutol nie są stosowane w kontynuacji — pytanie jest dyskusyjne; Pyrazynamid to „bardziej oczywisty\" egzaminacyjny wybór. Mnemonik: Start HRZE → potem HR.", "options": [{"letter": "A", "text": "Pyrazynamid", "correct": true}, {"letter": "B", "text": "Etambutol", "correct": false}, {"letter": "C", "text": "Nidrazid", "correct": false}, {"letter": "D", "text": "Izoniazyd", "correct": false}, {"letter": "E", "text": "Ryfampicyna", "correct": false}], "type": "single"}, {"text": "Pacjent na SOR z masywnym krwotokiem. Nie ma czasu na oznaczenie grupy krwi. Jaką krew przetoczyć?", "hint": "Grupa 0 Rh− = uniwersalny dawca krwinek czerwonych (brak antygenów A, B, Rh). W stanach nagłych bez oznaczenia grupy → zawsze 0 Rh−. U kobiet w wieku rozrodczym bezwzględnie Rh−; u mężczyzn czasem dopuszcza się 0 Rh+, ale na teście → 0 Rh−.", "options": [{"letter": "A", "text": "Krew zgodną w układzie ABO i Rh po próbie krzyżowej", "correct": false}, {"letter": "B", "text": "KKCz grupy AB Rh+", "correct": false}, {"letter": "C", "text": "KKCz grupy 0 Rh+", "correct": false}, {"letter": "D", "text": "KKCz grupy 0 Rh−", "correct": true}, {"letter": "E", "text": "Osocze świeżo mrożone AB", "correct": false}], "type": "single"}, {"text": "Ostre zapalenie wyrostka robaczkowego. Ucisk z lewej strony boli po prawej. Opisany objaw to:", "hint": "Ucisk w lewym dole biodrowym → przemieszczenie gazów → ↑ ciśnienie w kątnicy → ból po prawej = objaw Rovsinga. Blumberg = ból przy nagłym zwolnieniu ucisku. Goldflam = nerki. Chełmoński = pęcherzyk żółciowy.", "items": ["Jaworskiego", "Blumberga", "Goldflama", "Chełmońskiego"], "options": [{"letter": "1", "text": "Jaworskiego", "correct": false}, {"letter": "2", "text": "Blumberga", "correct": false}, {"letter": "3", "text": "Rovsinga", "correct": true}, {"letter": "4", "text": "Chełmońskiego", "correct": false}], "type": "single"}, {"text": "Objaw podrażnienia otrzewnej polegający na ostrym bólu przy gwałtownym zwolnieniu ucisku powłok brzusznych:", "hint": "Blumberg = objaw otrzewnowy: ból pojawia się przy ZWOLNIENIU ucisku, nie przy samym ucisku. Goldflam = nerki (wstrząsanie okolicy lędźwiowej). Homans = zakrzepica żył głębokich (ból łydki przy zgięciu grzbietowym stopy).", "items": ["Goldflama", "Grafego", "Homansa", "Chełmońskiego"], "options": [{"letter": "1", "text": "Goldflama", "correct": false}, {"letter": "2", "text": "Blumberga", "correct": true}, {"letter": "3", "text": "Homansa", "correct": false}, {"letter": "4", "text": "Chełmońskiego", "correct": false}], "type": "single"}, {"text": "Jaki hormon potwierdza ciążę?", "hint": "β-hCG = jedyny swoisty marker ciąży. Produkowany przez trofoblast od momentu implantacji. Wykrywalny we krwi ~6–8 dni po zapłodnieniu. FSH/LH ↓ w ciąży. Mnemonik: hCG = „human Chorionic Gonadotropin\" = ciąża.", "options": [{"letter": "A", "text": "FSH", "correct": false}, {"letter": "B", "text": "TSH", "correct": false}, {"letter": "C", "text": "β-hCG", "correct": true}, {"letter": "D", "text": "ACTH", "correct": false}, {"letter": "E", "text": "LH", "correct": false}], "type": "single"}, {"text": "Bezwzględne przeciwwskazania do szczepienia ciężarnej przeciwko grypie:", "hint": "Szczepionka inaktywowana przeciwko grypie jest BEZPIECZNA i ZALECANA w ciąży (w każdym trymestrze). Chroni matkę i noworodka (przez przeciwciała). Nie jest przeciwwskazana. Mnemonik: Grypa w ciąży = szczep śmiało.", "options": [{"letter": "A", "text": "…", "correct": false}, {"letter": "B", "text": "…", "correct": false}, {"letter": "C", "text": "Szczepienie przeciwko grypie nie jest przeciwwskazane w ciąży", "correct": true}, {"letter": "D", "text": "…", "correct": false}, {"letter": "E", "text": "…", "correct": false}], "type": "single"}, {"text": "9-miesięczne dziecko: czaszka miękka (przy ucisku zapada się jak piłeczka do ping-ponga), opóźnienie wzrostu, słaby apetyt, ospałość, żółtawa skóra, zaparcia. Diagnoza?", "hint": "Craniotabes (miękka czaszka „ping-pong ball\") = KLASYCZNY objaw krzywicy (niedobór wit. D). Opóźnienie wzrostu + słaby apetyt wpisują się w obraz kliniczny.", "options": [{"letter": "A", "text": "Krzywica", "correct": true}, {"letter": "B", "text": "Wrodzona niedoczynność tarczycy", "correct": false}, {"letter": "C", "text": "Hipoparatyreoza", "correct": false}, {"letter": "D", "text": "Zespół Marfana", "correct": false}, {"letter": "E", "text": "Wrodzone wodogłowie", "correct": false}], "type": "single"}, {"text": "Zaawansowany surowiczy rak jajnika (HGSOC). Stwierdzenie niedoboru rekombinacji homologicznej (HRD) ma znaczenie, ponieważ:", "hint": "HRD (Homologous Recombination Deficiency) = komórki raka nie naprawiają DNA → wrażliwe na inhibitory PARP (olaparib, niraparib). HRD obejmuje BRCA1/2, ale NIE tylko BRCA1. Platyna nadal stosowana. Mnemonik: HRD = PARP works.", "options": [{"letter": "A", "text": "Świadczy o oporności na antracykliny", "correct": false}, {"letter": "B", "text": "Świadczy o wrażliwości na inhibitory PARP (olaparib)", "correct": true}, {"letter": "C", "text": "Występuje wyłącznie u pacjentek z BRCA1", "correct": false}, {"letter": "D", "text": "Świadczy, że nie można stosować preparatów platyny", "correct": false}, {"letter": "E", "text": "Rezygnacja z leczenia operacyjnego na rzecz immunoterapii", "correct": false}], "type": "single"}, {"text": "15-letni chłopiec, ból kolana po urazie (piłka nożna, tydzień temu). Ból ustępuje po NLPZ, ale budzi w nocy. RTG: ogniskowa destrukcja kości + szpuły kostne (sunburst). Diagnoza?", "hint": "Nastolatek + ból kości budzący w nocy + destrukcja kości na RTG + szpuły kostne (sunburst/trójkąt Codmana) = OSTEOSARCOMA. Złamanie pourazowe nie daje destrukcji ogniskowej. Mnemonik: Nastolatek + ból nocny + destrukcja kości = osteosarcoma.", "options": [{"letter": "A", "text": "Osteosarcoma", "correct": true}, {"letter": "B", "text": "Zakażenie stawu (ropne)", "correct": false}, {"letter": "C", "text": "Gorączka reumatyczna", "correct": false}, {"letter": "D", "text": "Ziarniniak eozynofilny kości", "correct": false}, {"letter": "E", "text": "Złamanie pourazowe", "correct": false}], "type": "single"}, {"text": "Które stwierdzenie jest NIEPRAWDZIWE w odniesieniu do mięsaków tkanek miękkich?", "hint": "Mięsaki tkanek miękkich przerzutują DROGĄ KRWIONOŚNĄ, głównie do PŁUC (nie do wątroby!). Wątroba to typowa lokalizacja przerzutów nowotworów przewodu pokarmowego (droga żyły wrotnej). Mnemonik: Mięsaki → płuca; GI → wątroba.", "options": [{"letter": "A", "text": "Przerzutują do wątroby", "correct": true}, {"letter": "B", "text": "Często lokalizują się na kończynach lub tułowiu", "correct": false}, {"letter": "C", "text": "Mogą powodować ucisk na sąsiednie struktury", "correct": false}, {"letter": "D", "text": "Czasami osiągają duże rozmiary i wymagają usunięcia chirurgicznego", "correct": false}, {"letter": "E", "text": "Złe rokowanie", "correct": false}], "type": "single"}, {"text": "Mężczyzna na SOR: ból brzucha, hipotonia, tachykardia. Oddał 3× smoliste stolce. Postępowanie?", "hint": "Smoliste stolce (melena) = krwawienie z GÓRNEGO odcinka przewodu pokarmowego. Pierwszy krok po stabilizacji hemodynamicznej → gastroskopia (diagnostyka + hemostaza). Sengstaken-Blakemore = tylko jako leczenie ratunkowe przy krwawieniu z żylaków przełyku, gdy endoskopia jest nieskuteczna.", "options": [{"letter": "A", "text": "Zabieg endoskopowy — gastroskopia", "correct": true}, {"letter": "B",
